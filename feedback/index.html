<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback | Piras na Física</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-TY56KM22X8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-TY56KM22X8');
  </script>
  <link rel="stylesheet" href="../css/style.css">
  
  
</head>
<body>
  <header id="header"></header>

  <main class="feedback-page">
    <section class="feedback-card">
      <div class="page-heading">
        <span class="feedback-icon" aria-hidden="true">💬</span>
        <div>
          <h1>Deixe seu feedback</h1>
          <p>Conte sua opinião, crítica ou sugestão. Informe seu e-mail se quiser um retorno do criador.</p>
        </div>
      </div>


    <form id="feedback-form" class="feedback-form">
        <label for="rating">Você curtiu o site?</label>
        <div class="form-row radio-row">
          <label><input type="radio" name="rating" value="Sim" checked> Sim</label>
          <label><input type="radio" name="rating" value="Não"> Não</label>
        </div>

        <label for="message">Comentário, crítica, sugestão ou opinião</label>
        <textarea id="message" name="message" rows="6" placeholder="O que você achou do site? Como podemos melhorar?" required></textarea>

        <label for="email">E-mail (opcional)</label>
        <input id="email" name="email" type="email" placeholder="seu@email.com">

        <p class="feedback-note">Seu e-mail só será usado se você quiser receber uma resposta. Os comentários ficam salvos em um banco de dados local.</p>

        <button type="submit" class="btn-hero">Enviar feedback</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2026 — Piras na Física</p>
  </footer>

  <script src="../js/include.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="feedback.js"></script>


</body>
</html>
