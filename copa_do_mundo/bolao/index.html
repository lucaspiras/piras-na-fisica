<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bolão da Copa 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-page center">
    <div class="spinner" style="margin:auto;border-color:rgba(0,0,0,.15);border-top-color:var(--pitch)"></div>
  </div>
  <script type="module">
    import { supabase } from './supabase.js'
    const { data: { user } } = await supabase.auth.getUser()
    if (!user) { location.replace('login.html'); }
    else {
      const { data: profile } = await supabase.from('profiles').select('id').eq('id', user.id).maybeSingle()
      location.replace(profile ? 'dashboard.html' : 'onboarding.html')
    }
  </script>
</body>
</html>
