<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Como te chamam? · Bolão da Copa 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-page">
    <h1>Como te<br>chamam?</h1>
    <div class="pitch-rule"></div>
    <p class="muted mt-12">
      Esse apelido aparece no ranking pra galera. É a única coisa que pedimos.
    </p>

    <div class="card mt-32">
      <form id="form-name" class="auth-form">
        <input
          id="input-name"
          class="input"
          type="text"
          placeholder="Ex.: Zé do Palpite"
          minlength="2"
          maxlength="30"
          required
          autocomplete="nickname"
        >
        <button type="submit" class="btn btn-primary btn-full" id="btn-submit">
          Bora palpitar
        </button>
        <p id="error-msg" class="error-msg hidden"></p>
      </form>
    </div>
  </main>

  <script type="module">
    import { supabase, requireAuth } from './supabase.js'

    const user = await requireAuth()
    if (!user) throw new Error('not reached')

    // Se já tem perfil, vai pro dashboard
    const { data: existing } = await supabase
      .from('profiles').select('id').eq('id', user.id).maybeSingle()
    if (existing) { location.replace('dashboard.html'); }

    const form   = document.getElementById('form-name')
    const btn    = document.getElementById('btn-submit')
    const errMsg = document.getElementById('error-msg')

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      const name = document.getElementById('input-name').value.trim()
      btn.disabled = true
      btn.innerHTML = '<span class="spinner"></span>'
      errMsg.classList.add('hidden')

      const { error } = await supabase
        .from('profiles')
        .insert({ id: user.id, display_name: name })

      if (error) {
        btn.disabled = false
        btn.textContent = 'Bora palpitar'
        errMsg.textContent = 'Não consegui salvar. Tente outro apelido.'
        errMsg.classList.remove('hidden')
        return
      }
      location.replace('dashboard.html')
    })
  </script>
</body>
</html>
