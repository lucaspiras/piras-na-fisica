<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perguntas · Gincana Quiz</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/img/icons/favicon-32.png">
  <link rel="stylesheet" href="../bolao/style.css">
  <style>
    .pq-head { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    .pq-badge { display:inline-block; font-family:var(--font-mono,monospace); font-size:.72rem; font-weight:700;
      padding:3px 9px; border-radius:999px; letter-spacing:.04em; }
    .b-pts   { background:var(--pitch-light); color:var(--pitch-deep); }
    .b-facil { background:#e6f4ea; color:#1e7a44; }
    .b-media { background:#fff2d9; color:#a86a12; }
    .b-dif   { background:#fde3d6; color:#b4441e; }
    .b-vdif  { background:#f3d9f0; color:#7a2470; }
    .pq-card { border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-top:12px; background:#fff; }
    .pq-q { font-size:1.02rem; font-weight:600; line-height:1.4; margin:8px 0 12px; }
    .pq-opt { display:flex; gap:10px; align-items:flex-start; padding:6px 10px; border-radius:9px; font-size:.95rem; }
    .pq-opt .k { font-family:var(--font-mono,monospace); font-weight:700; }
    .pq-opt.correct { background:var(--pitch-light); font-weight:700; color:var(--pitch-deep); }
    .pq-sec { margin-top:28px; }
    .pq-confronto { font-family:var(--font-mono,monospace); font-size:.8rem; color:var(--muted);
      text-transform:uppercase; letter-spacing:.1em; margin-top:20px; border-top:2px solid var(--line); padding-top:10px; }
    @media print {
      .no-print { display:none !important; }
      .pq-card { break-inside:avoid; box-shadow:none; }
      a[href]:after { content:''; }
    }
  </style>
</head>
<body>
  <main class="container pt-24 pb-32">
    <div class="pq-head">
      <div>
        <div class="pq-badge b-pts" style="margin-bottom:6px">Gincana · Copa do Mundo</div>
        <h2 style="margin:0">Perguntas & Gabarito</h2>
      </div>
      <div class="no-print" style="display:flex;gap:8px">
        <button id="btn-print" class="btn btn-ghost btn-sm">🖨 Imprimir</button>
        <a href="admin.html" class="btn btn-ghost btn-sm" style="text-decoration:none">Admin</a>
      </div>
    </div>
    <p class="muted" style="font-size:.85rem;margin-top:6px">
      Fonte: <span class="mono">perguntas_copa.json</span>. A alternativa <strong style="color:var(--pitch-deep)">verde</strong> é a correta.
      Este documento é o gabarito do apresentador — não mostre às equipes.
    </p>
    <div id="content"><div class="empty"><strong>Carregando…</strong></div></div>
  </main>

  <script>
    const esc = s => String(s??'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))
    document.getElementById('btn-print').addEventListener('click', () => window.print())

    function difGroup(ord){
      if (ord>=25) return ['Grande final','b-vdif']
      if (ord>=21) return ['Rodada final','b-dif']
      return ord<=5?['Fácil','b-facil']:ord<=10?['Média','b-media']:ord<=15?['Difícil','b-dif']:['Muito difícil','b-vdif']
    }
    const stripTag = t => t.replace(/^\[[^\]]+\]\s*/, '')

    function card(q, difLabel, difCls, badgeLeft) {
      const opts = q.options.map(o => `<div class="pq-opt ${o.key===q.correct_key?'correct':''}">
        <span class="k">${o.key})</span><span>${esc(o.label)}${o.key===q.correct_key?' ✓':''}</span></div>`).join('')
      const media = q.media ? `<div style="margin-top:8px"><a href="${esc(q.media)}" target="_blank" style="font-size:.82rem">🎬 Vídeo — tocar antes de revelar</a></div>` : ''
      return `<div class="pq-card">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          ${badgeLeft}<span class="pq-badge ${difCls}">${difLabel}</span>${q.media?'<span class="pq-badge b-media">🎬 vídeo</span>':''}</div>
        <div class="pq-q">${esc(stripTag(q.text))}</div>${opts}${media}</div>`
    }

    fetch('perguntas_copa.json').then(r=>r.json()).then(qs => {
      const group = qs.filter(q=>q.phase==='group').sort((a,b)=>a.ord-b.ord)
      const extra = qs.filter(q=>q.phase==='extra').sort((a,b)=>a.ord-b.ord)
      let html = ''

      html += `<div class="pq-sec"><h3>Perguntas ativas — ${group.length} (1 a 25)</h3>
        <p class="muted" style="font-size:.82rem">1–10: 10 pts · 11–20: 20 pts · 21–24: 40 pts (elimina as 2 piores por pergunta) · 25: 80 pts (grande final).</p>`
      group.forEach(q => {
        if (q.ord===21) html += `<div class="pq-confronto">Rodada final — eliminação progressiva (21 a 25)</div>`
        const [dl,dc] = difGroup(q.ord)
        const left = `<span class="pq-badge b-pts">#${q.ord} · ${q.points} pts</span>`
        html += card(q, dl, dc, left)
      })
      html += `</div>`

      if (extra.length) {
        html += `<div class="pq-sec"><h3>Extras (reserva) — ${extra.length} perguntas</h3>
          <p class="muted" style="font-size:.82rem">Não entram no jogo. Reserva para eventuais substituições.</p>`
        extra.forEach(q => {
          const left = `<span class="pq-badge b-pts">extra #${q.ord}</span>`
          html += card(q, 'reserva', 'b-media', left)
        })
        html += `</div>`
      }

      document.getElementById('content').innerHTML = html
    }).catch(e => {
      document.getElementById('content').innerHTML = `<div class="card"><p class="muted">Não foi possível ler o arquivo de perguntas. Abra esta página por um servidor (Live Server), não pelo arquivo direto.</p></div>`
    })
  </script>
</body>
</html>
