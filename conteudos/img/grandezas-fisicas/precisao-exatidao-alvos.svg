<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280">
  <rect width="640" height="280" fill="#f9fafb" rx="10"/>

  <!-- Title -->
  <text x="320" y="22" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Precisão vs. Exatidão — Alvos de Tiro</text>

  <!-- Legend header (exatidão = nearness to true value; precisão = repeatability) -->
  <text x="320" y="38" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Exatidão = quão próximo do valor verdadeiro (centro) ·  Precisão = quão agrupadas estão as medições</text>

  <!-- ========================= TARGET 1: Alta precisão + Alta exatidão ========================= -->
  <!-- Center x=83 -->
  <text x="83" y="58" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">Alta exatidão</text>
  <text x="83" y="70" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">Alta precisão</text>
  <!-- Outer ring -->
  <circle cx="83" cy="155" r="50" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="83" cy="155" r="35" fill="#fef9c3" stroke="#fde047" stroke-width="1.5"/>
  <circle cx="83" cy="155" r="20" fill="#fef3c7" stroke="#facc15" stroke-width="2"/>
  <circle cx="83" cy="155" r="8"  fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <!-- Shots: clustered near center -->
  <circle cx="80" cy="152" r="4" fill="#15803d" opacity="0.9"/>
  <circle cx="86" cy="158" r="4" fill="#15803d" opacity="0.9"/>
  <circle cx="82" cy="160" r="4" fill="#15803d" opacity="0.9"/>
  <circle cx="78" cy="157" r="4" fill="#15803d" opacity="0.9"/>
  <circle cx="85" cy="151" r="4" fill="#15803d" opacity="0.9"/>
  <!-- Tag -->
  <rect x="33" y="218" width="100" height="22" fill="#dcfce7" rx="5" stroke="#86efac" stroke-width="1"/>
  <text x="83" y="232" font-family="Arial,sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="bold">✓ Ideal!</text>

  <!-- ========================= TARGET 2: Alta precisão, Baixa exatidão ========================= -->
  <text x="243" y="58" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">Baixa exatidão</text>
  <text x="243" y="70" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Alta precisão</text>
  <circle cx="243" cy="155" r="50" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="243" cy="155" r="35" fill="#fef9c3" stroke="#fde047" stroke-width="1.5"/>
  <circle cx="243" cy="155" r="20" fill="#fef3c7" stroke="#facc15" stroke-width="2"/>
  <circle cx="243" cy="155" r="8"  fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <!-- Shots: clustered but OFF-CENTER (top-right area) -->
  <circle cx="265" cy="130" r="4" fill="#2f5bea" opacity="0.9"/>
  <circle cx="269" cy="136" r="4" fill="#2f5bea" opacity="0.9"/>
  <circle cx="263" cy="126" r="4" fill="#2f5bea" opacity="0.9"/>
  <circle cx="272" cy="131" r="4" fill="#2f5bea" opacity="0.9"/>
  <circle cx="267" cy="140" r="4" fill="#2f5bea" opacity="0.9"/>
  <!-- Tag -->
  <rect x="193" y="218" width="100" height="22" fill="#dbeafe" rx="5" stroke="#93c5fd" stroke-width="1"/>
  <text x="243" y="232" font-family="Arial,sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle">Erro sistemático</text>

  <!-- ========================= TARGET 3: Baixa precisão, Alta exatidão ========================= -->
  <text x="403" y="58" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">Alta exatidão</text>
  <text x="403" y="70" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">Baixa precisão</text>
  <circle cx="403" cy="155" r="50" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="403" cy="155" r="35" fill="#fef9c3" stroke="#fde047" stroke-width="1.5"/>
  <circle cx="403" cy="155" r="20" fill="#fef3c7" stroke="#facc15" stroke-width="2"/>
  <circle cx="403" cy="155" r="8"  fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <!-- Shots: spread around center (in general vicinity) -->
  <circle cx="395" cy="140" r="4" fill="#9ca3af" opacity="0.9"/>
  <circle cx="420" cy="162" r="4" fill="#9ca3af" opacity="0.9"/>
  <circle cx="388" cy="165" r="4" fill="#9ca3af" opacity="0.9"/>
  <circle cx="415" cy="138" r="4" fill="#9ca3af" opacity="0.9"/>
  <circle cx="397" cy="175" r="4" fill="#9ca3af" opacity="0.9"/>
  <!-- Tag -->
  <rect x="353" y="218" width="100" height="22" fill="#fef3c7" rx="5" stroke="#fde047" stroke-width="1"/>
  <text x="403" y="232" font-family="Arial,sans-serif" font-size="10" fill="#92400e" text-anchor="middle">Erro aleatório</text>

  <!-- ========================= TARGET 4: Baixa precisão + Baixa exatidão ========================= -->
  <text x="563" y="58" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">Baixa exatidão</text>
  <text x="563" y="70" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">Baixa precisão</text>
  <circle cx="563" cy="155" r="50" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="563" cy="155" r="35" fill="#fef9c3" stroke="#fde047" stroke-width="1.5"/>
  <circle cx="563" cy="155" r="20" fill="#fef3c7" stroke="#facc15" stroke-width="2"/>
  <circle cx="563" cy="155" r="8"  fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <!-- Shots: scattered, off-center -->
  <circle cx="548" cy="125" r="4" fill="#ef4444" opacity="0.9"/>
  <circle cx="582" cy="138" r="4" fill="#ef4444" opacity="0.9"/>
  <circle cx="535" cy="162" r="4" fill="#ef4444" opacity="0.9"/>
  <circle cx="580" cy="175" r="4" fill="#ef4444" opacity="0.9"/>
  <circle cx="552" cy="177" r="4" fill="#ef4444" opacity="0.9"/>
  <!-- Tag -->
  <rect x="513" y="218" width="100" height="22" fill="#fee2e2" rx="5" stroke="#fca5a5" stroke-width="1"/>
  <text x="563" y="232" font-family="Arial,sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">Erro total</text>

  <!-- Summary at bottom -->
  <rect x="80" y="248" width="480" height="26" fill="#f1f5f9" rx="5"/>
  <text x="320" y="261" font-family="Arial,sans-serif" font-size="10" fill="#475569" text-anchor="middle">Na Física queremos sempre alta exatidão E alta precisão. Erros sistemáticos e aleatórios devem ser minimizados.</text>
  <text x="320" y="272" font-family="Arial,sans-serif" font-size="10" fill="#475569" text-anchor="middle">Algarismos significativos e incerteza de medição descrevem quantitativamente esses conceitos.</text>
</svg>
