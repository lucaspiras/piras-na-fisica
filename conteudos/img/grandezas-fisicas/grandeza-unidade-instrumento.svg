<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230">
  <rect width="640" height="230" fill="#f9fafb" rx="10"/>

  <!-- Title -->
  <text x="320" y="22" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Grandeza, Unidade e Instrumento de Medida</text>

  <!-- Header row -->
  <rect x="20"  y="35" width="155" height="30" fill="#1e2a78" rx="5 5 0 0"/>
  <rect x="183" y="35" width="155" height="30" fill="#1e2a78" rx="5 5 0 0"/>
  <rect x="346" y="35" width="155" height="30" fill="#1e2a78" rx="5 5 0 0"/>
  <rect x="509" y="35" width="113" height="30" fill="#1e2a78" rx="5 5 0 0"/>
  <text x="97"  y="55" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">GRANDEZA</text>
  <text x="260" y="55" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">UNIDADE (SI)</text>
  <text x="423" y="55" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">INSTRUMENTO</text>
  <text x="565" y="55" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">SÍMBOLO</text>

  <!-- ROW 1: Comprimento -->
  <rect x="20"  y="65" width="155" height="38" fill="#dbeafe" rx="0"/>
  <rect x="183" y="65" width="155" height="38" fill="#eff6ff" rx="0"/>
  <rect x="346" y="65" width="155" height="38" fill="#dbeafe" rx="0"/>
  <rect x="509" y="65" width="113" height="38" fill="#eff6ff" rx="0"/>
  <text x="97"  y="80" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">📏 Comprimento</text>
  <text x="97"  y="93" font-family="Arial,sans-serif" font-size="10" fill="#2563eb" text-anchor="middle">distância entre pontos</text>
  <text x="260" y="87" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">metro  (m)</text>
  <text x="423" y="80" font-family="Arial,sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle">régua, trena</text>
  <text x="423" y="93" font-family="Arial,sans-serif" font-size="10" fill="#2563eb" text-anchor="middle">paquímetro, laser</text>
  <text x="565" y="87" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#1d4ed8" text-anchor="middle">m</text>

  <!-- ROW 2: Massa -->
  <rect x="20"  y="103" width="155" height="38" fill="#dcfce7" rx="0"/>
  <rect x="183" y="103" width="155" height="38" fill="#f0fdf4" rx="0"/>
  <rect x="346" y="103" width="155" height="38" fill="#dcfce7" rx="0"/>
  <rect x="509" y="103" width="113" height="38" fill="#f0fdf4" rx="0"/>
  <text x="97"  y="118" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">⚖️ Massa</text>
  <text x="97"  y="131" font-family="Arial,sans-serif" font-size="10" fill="#16a34a" text-anchor="middle">quantidade de matéria</text>
  <text x="260" y="125" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#15803d" text-anchor="middle">quilograma  (kg)</text>
  <text x="423" y="118" font-family="Arial,sans-serif" font-size="12" fill="#15803d" text-anchor="middle">balança de precisão</text>
  <text x="423" y="131" font-family="Arial,sans-serif" font-size="10" fill="#16a34a" text-anchor="middle">balança analítica</text>
  <text x="565" y="125" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#15803d" text-anchor="middle">kg</text>

  <!-- ROW 3: Temperatura -->
  <rect x="20"  y="141" width="155" height="38" fill="#fef3c7" rx="0"/>
  <rect x="183" y="141" width="155" height="38" fill="#fffbeb" rx="0"/>
  <rect x="346" y="141" width="155" height="38" fill="#fef3c7" rx="0"/>
  <rect x="509" y="141" width="113" height="38" fill="#fffbeb" rx="0"/>
  <text x="97"  y="156" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle">🌡️ Temperatura</text>
  <text x="97"  y="169" font-family="Arial,sans-serif" font-size="10" fill="#a16207" text-anchor="middle">agitação molecular</text>
  <text x="260" y="163" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#92400e" text-anchor="middle">kelvin  (K)</text>
  <text x="423" y="156" font-family="Arial,sans-serif" font-size="12" fill="#92400e" text-anchor="middle">termômetro</text>
  <text x="423" y="169" font-family="Arial,sans-serif" font-size="10" fill="#a16207" text-anchor="middle">termistor, termopar</text>
  <text x="565" y="163" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#92400e" text-anchor="middle">K</text>

  <!-- ROW 4: Tempo -->
  <rect x="20"  y="179" width="155" height="38" fill="#ede9fe" rx="0 0 5 5"/>
  <rect x="183" y="179" width="155" height="38" fill="#f5f3ff" rx="0 0 5 5"/>
  <rect x="346" y="179" width="155" height="38" fill="#ede9fe" rx="0 0 5 5"/>
  <rect x="509" y="179" width="113" height="38" fill="#f5f3ff" rx="0 0 5 5"/>
  <text x="97"  y="194" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#5b21b6" text-anchor="middle">⏱️ Tempo</text>
  <text x="97"  y="207" font-family="Arial,sans-serif" font-size="10" fill="#6d28d9" text-anchor="middle">duração de eventos</text>
  <text x="260" y="201" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#5b21b6" text-anchor="middle">segundo  (s)</text>
  <text x="423" y="194" font-family="Arial,sans-serif" font-size="12" fill="#5b21b6" text-anchor="middle">cronômetro</text>
  <text x="423" y="207" font-family="Arial,sans-serif" font-size="10" fill="#7c3aed" text-anchor="middle">relógio atômico</text>
  <text x="565" y="201" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#5b21b6" text-anchor="middle">s</text>

  <!-- Grid borders -->
  <rect x="20" y="35" width="602" height="182" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="5"/>
  <line x1="183" y1="35" x2="183" y2="217" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="346" y1="35" x2="346" y2="217" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="509" y1="35" x2="509" y2="217" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="20" y1="103" x2="622" y2="103" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="20" y1="141" x2="622" y2="141" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="20" y1="179" x2="622" y2="179" stroke="#e2e8f0" stroke-width="1"/>
</svg>
