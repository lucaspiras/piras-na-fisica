<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <rect width="640" height="300" fill="#f9fafb" rx="10"/>

  <!-- Title -->
  <text x="320" y="22" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Ciclo do Método Científico</text>

  <!-- Center label -->
  <circle cx="320" cy="152" r="35" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="320" y="148" font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="bold">Método</text>
  <text x="320" y="162" font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="middle">Científico</text>

  <!-- Arrow defs for curved arrows -->
  <defs>
    <marker id="aCurve" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Curved connecting arrows between nodes (clockwise) -->
  <!-- 1→2: right to top-right (0° to 60°) -->
  <path d="M 432,132 A 120,120 0 0,0 388,48" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#aCurve)"/>
  <!-- 2→3: top-right to top-left (60° to 120°) -->
  <path d="M 358,38 A 120,120 0 0,0 265,38" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#aCurve)"/>
  <!-- 3→4: top-left to left (120° to 180°) -->
  <path d="M 223,53 A 120,120 0 0,0 206,131" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#aCurve)"/>
  <!-- 4→5: left to bottom-left (180° to 240°) -->
  <path d="M 207,172 A 120,120 0 0,0 250,247" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#aCurve)"/>
  <!-- 5→6: bottom-left to bottom-right (240° to 300°) -->
  <path d="M 284,263 A 120,120 0 0,0 370,263" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#aCurve)"/>
  <!-- 6→1: bottom-right to right (300° to 360°) — cycle! -->
  <path d="M 414,246 A 120,120 0 0,0 435,171" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#aCurve)"/>

  <!-- Step boxes (6 at 60° intervals, radius=110) -->

  <!-- 1: Observação (right, 0°): center (430, 152) -->
  <rect x="415" y="126" width="110" height="52" fill="#dbeafe" rx="8" stroke="#2f5bea" stroke-width="2"/>
  <text x="470" y="143" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">🔍 1. Observação</text>
  <text x="470" y="156" font-family="Arial,sans-serif" font-size="10" fill="#1e40af" text-anchor="middle">Perceber um</text>
  <text x="470" y="168" font-family="Arial,sans-serif" font-size="10" fill="#1e40af" text-anchor="middle">fenômeno</text>

  <!-- 2: Pergunta (top-right, 60°): center (378, 55) -->
  <rect x="323" y="29" width="108" height="52" fill="#fef9c3" rx="8" stroke="#ca8a04" stroke-width="2"/>
  <text x="377" y="46" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#713f12" text-anchor="middle">❓ 2. Pergunta</text>
  <text x="377" y="59" font-family="Arial,sans-serif" font-size="10" fill="#92400e" text-anchor="middle">Formular a</text>
  <text x="377" y="71" font-family="Arial,sans-serif" font-size="10" fill="#92400e" text-anchor="middle">questão central</text>

  <!-- 3: Hipótese (top-left, 120°): center (262, 55) -->
  <rect x="209" y="29" width="108" height="52" fill="#dcfce7" rx="8" stroke="#16a34a" stroke-width="2"/>
  <text x="263" y="46" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">💡 3. Hipótese</text>
  <text x="263" y="59" font-family="Arial,sans-serif" font-size="10" fill="#166534" text-anchor="middle">Propor uma</text>
  <text x="263" y="71" font-family="Arial,sans-serif" font-size="10" fill="#166534" text-anchor="middle">explicação</text>

  <!-- 4: Experimento (left, 180°): center (152, 152) -->
  <rect x="100" y="126" width="108" height="52" fill="#ede9fe" rx="8" stroke="#7c3aed" stroke-width="2"/>
  <text x="154" y="143" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#5b21b6" text-anchor="middle">⚗️ 4. Experimento</text>
  <text x="154" y="156" font-family="Arial,sans-serif" font-size="10" fill="#6d28d9" text-anchor="middle">Testar a</text>
  <text x="154" y="168" font-family="Arial,sans-serif" font-size="10" fill="#6d28d9" text-anchor="middle">hipótese</text>

  <!-- 5: Análise (bottom-left, 240°): center (262, 248) -->
  <rect x="209" y="222" width="108" height="52" fill="#ffedd5" rx="8" stroke="#ea580c" stroke-width="2"/>
  <text x="263" y="239" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#9a3412" text-anchor="middle">📊 5. Análise</text>
  <text x="263" y="252" font-family="Arial,sans-serif" font-size="10" fill="#c2410c" text-anchor="middle">Interpretar os</text>
  <text x="263" y="264" font-family="Arial,sans-serif" font-size="10" fill="#c2410c" text-anchor="middle">dados</text>

  <!-- 6: Conclusão (bottom-right, 300°): center (378, 248) -->
  <rect x="323" y="222" width="108" height="52" fill="#fee2e2" rx="8" stroke="#dc2626" stroke-width="2"/>
  <text x="377" y="239" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">✅ 6. Conclusão</text>
  <text x="377" y="252" font-family="Arial,sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle">Confirmar ou</text>
  <text x="377" y="264" font-family="Arial,sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle">refutar hipótese</text>

  <!-- Central note -->
  <text x="320" y="290" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle" font-style="italic">A ciência é um ciclo: conclusões geram novas observações e perguntas</text>
</svg>
