<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230">
  <rect width="640" height="230" fill="#f9fafb" rx="10"/>

  <!-- Title -->
  <text x="320" y="22" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Escala Logarítmica — Notação Científica no Universo</text>

  <!-- Range: 10⁻¹⁵ to 10²⁶ (41 OOM), scale=570/41=13.9px/OOM, x0=35 -->
  <!-- Scale bar -->
  <rect x="35" y="105" width="575" height="8" fill="#e2e8f0" rx="4"/>

  <!-- Cold gradient for sub-scales, warm for super-scales (colored bands) -->
  <rect x="35"  y="105" width="208" height="8" fill="#bfdbfe" opacity="0.8" rx="4 0 0 4"/>
  <rect x="243" y="105" width="14"  height="8" fill="#f97316" opacity="0.9"/>
  <rect x="257" y="105" width="353" height="8" fill="#fed7aa" opacity="0.8" rx="0 4 4 0"/>

  <!-- Objects (position = 35 + (exp+15)*13.9) -->

  <!-- 10⁻¹⁵: núcleo — x=35 -->
  <circle cx="35" cy="109" r="4" fill="#7c3aed"/>
  <line x1="35" y1="100" x2="35" y2="73" stroke="#7c3aed" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="35" y="68" font-family="Arial,sans-serif" font-size="9" fill="#7c3aed" text-anchor="middle" font-weight="bold">núcleo</text>
  <text x="35" y="58" font-family="Arial,sans-serif" font-size="9" fill="#7c3aed" text-anchor="middle">10⁻¹⁵m</text>

  <!-- 10⁻¹⁰: átomo — x=35+5*13.9=104.5≈105 -->
  <circle cx="105" cy="109" r="4" fill="#2f5bea"/>
  <line x1="105" y1="113" x2="105" y2="140" stroke="#2f5bea" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="105" y="152" font-family="Arial,sans-serif" font-size="9" fill="#2f5bea" text-anchor="middle" font-weight="bold">átomo</text>
  <text x="105" y="162" font-family="Arial,sans-serif" font-size="9" fill="#2f5bea" text-anchor="middle">10⁻¹⁰m</text>

  <!-- 10⁻⁶: bactéria — x=35+9*13.9=160.1≈160 -->
  <circle cx="160" cy="109" r="4" fill="#0891b2"/>
  <line x1="160" y1="100" x2="160" y2="73" stroke="#0891b2" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="160" y="68" font-family="Arial,sans-serif" font-size="9" fill="#0891b2" text-anchor="middle" font-weight="bold">bactéria</text>
  <text x="160" y="58" font-family="Arial,sans-serif" font-size="9" fill="#0891b2" text-anchor="middle">10⁻⁶m</text>

  <!-- 10⁻²: formiga — x=35+13*13.9=215.7≈216 -->
  <circle cx="216" cy="109" r="4" fill="#16a34a"/>
  <line x1="216" y1="113" x2="216" y2="140" stroke="#16a34a" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="216" y="152" font-family="Arial,sans-serif" font-size="9" fill="#16a34a" text-anchor="middle" font-weight="bold">formiga</text>
  <text x="216" y="162" font-family="Arial,sans-serif" font-size="9" fill="#16a34a" text-anchor="middle">10⁻²m</text>

  <!-- 10⁰: humano — x=35+15*13.9=243.5≈244 — HIGHLIGHTED -->
  <circle cx="244" cy="109" r="8" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <line x1="244" y1="98" x2="244" y2="62" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="194" y="38" width="100" height="26" fill="#fff7ed" rx="4" stroke="#f97316" stroke-width="1.5"/>
  <text x="244" y="52" font-family="Arial,sans-serif" font-size="10" fill="#c2410c" text-anchor="middle" font-weight="bold">🧍 humano</text>
  <text x="244" y="63" font-family="Arial,sans-serif" font-size="10" fill="#ea580c" text-anchor="middle">10⁰ m = 1 m</text>

  <!-- 10⁷: Terra — x=35+22*13.9=340.8≈341 -->
  <circle cx="341" cy="109" r="4" fill="#d97706"/>
  <line x1="341" y1="113" x2="341" y2="140" stroke="#d97706" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="341" y="152" font-family="Arial,sans-serif" font-size="9" fill="#d97706" text-anchor="middle" font-weight="bold">🌍 Terra</text>
  <text x="341" y="162" font-family="Arial,sans-serif" font-size="9" fill="#d97706" text-anchor="middle">10⁷m</text>

  <!-- 10¹¹: Sol-Terra — x=35+26*13.9=396.4≈396 -->
  <circle cx="396" cy="109" r="4" fill="#ea580c"/>
  <line x1="396" y1="100" x2="396" y2="73" stroke="#ea580c" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="396" y="68" font-family="Arial,sans-serif" font-size="9" fill="#ea580c" text-anchor="middle" font-weight="bold">Terra-Sol</text>
  <text x="396" y="58" font-family="Arial,sans-serif" font-size="9" fill="#ea580c" text-anchor="middle">10¹¹m</text>

  <!-- 10¹⁶: ano-luz — x=35+31*13.9=466.9≈467 -->
  <circle cx="467" cy="109" r="4" fill="#dc2626"/>
  <line x1="467" y1="113" x2="467" y2="140" stroke="#dc2626" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="467" y="152" font-family="Arial,sans-serif" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="bold">ano-luz</text>
  <text x="467" y="162" font-family="Arial,sans-serif" font-size="9" fill="#dc2626" text-anchor="middle">10¹⁶m</text>

  <!-- 10²¶: universo — x=35+41*13.9=605.9≈606 -->
  <circle cx="606" cy="109" r="4" fill="#7c3aed"/>
  <line x1="606" y1="100" x2="606" y2="73" stroke="#7c3aed" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="606" y="68" font-family="Arial,sans-serif" font-size="9" fill="#7c3aed" text-anchor="middle" font-weight="bold">🌌 universo</text>
  <text x="606" y="58" font-family="Arial,sans-serif" font-size="9" fill="#7c3aed" text-anchor="middle">10²⁶m</text>

  <!-- Exponent scale below -->
  <text x="35"  y="182" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">−15</text>
  <text x="105" y="182" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">−10</text>
  <text x="160" y="182" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">−6</text>
  <text x="244" y="182" font-family="Arial,sans-serif" font-size="9" fill="#c2410c" text-anchor="middle" font-weight="bold">0</text>
  <text x="341" y="182" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">7</text>
  <text x="467" y="182" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">16</text>
  <text x="606" y="182" font-family="Arial,sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">26</text>
  <text x="320" y="194" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">expoente de 10 (metros)</text>

  <!-- Note box -->
  <rect x="30" y="202" width="580" height="22" fill="#f1f5f9" rx="5"/>
  <text x="320" y="216" font-family="Arial,sans-serif" font-size="10" fill="#475569" text-anchor="middle">Do núcleo atômico ao universo observável: 41 ordens de grandeza. O ser humano fica a 15 passos do limite inferior!</text>
</svg>
