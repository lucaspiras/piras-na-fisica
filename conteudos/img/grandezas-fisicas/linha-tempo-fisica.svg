<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" height="210">
  <rect width="640" height="210" fill="#f9fafb" rx="10"/>

  <!-- Title -->
  <text x="320" y="22" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Linha do Tempo — Grandes Marcos da Física</text>

  <!-- Timeline: 1600 to 2020, scale = 580/420 = 1.381 px/year, x0=30 -->
  <!-- Timeline bar -->
  <rect x="30" y="108" width="582" height="4" fill="#cbd5e1" rx="2"/>

  <!-- Arrow defs -->
  <defs>
    <marker id="aTime" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0,8 2.5,0 5" fill="#94a3b8"/>
    </marker>
  </defs>
  <line x1="600" y1="110" x2="620" y2="110" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#aTime)"/>

  <!-- Year labels at 1600, 1700, 1800, 1900, 2000 -->
  <text x="30"  y="126" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">1600</text>
  <text x="168" y="126" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">1700</text>
  <text x="306" y="126" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">1800</text>
  <text x="444" y="126" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">1900</text>
  <text x="582" y="126" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">2000</text>
  <!-- Tick marks -->
  <line x1="168" y1="106" x2="168" y2="114" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="306" y1="106" x2="306" y2="114" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="444" y1="106" x2="444" y2="114" stroke="#cbd5e1" stroke-width="1"/>

  <!-- EVENT 1: Galileu 1609 — x=30+(9*1.381)=42 -->
  <circle cx="42" cy="110" r="7" fill="#2f5bea" stroke="#1e40af" stroke-width="2"/>
  <line x1="42" y1="102" x2="42" y2="68" stroke="#2f5bea" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="5" y="38" width="88" height="34" fill="#dbeafe" rx="5" stroke="#2f5bea" stroke-width="1"/>
  <text x="49" y="52" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Galileu</text>
  <text x="49" y="63" font-family="Arial,sans-serif" font-size="10" fill="#1e40af" text-anchor="middle">1609 — Mecânica,</text>
  <text x="49" y="74" font-family="Arial,sans-serif" font-size="9" fill="#1e40af" text-anchor="middle">método científico</text>

  <!-- EVENT 2: Newton 1687 — x=30+(87*1.381)=150 -->
  <circle cx="150" cy="110" r="7" fill="#16a34a" stroke="#14532d" stroke-width="2"/>
  <line x1="150" y1="118" x2="150" y2="155" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="108" y="153" width="88" height="34" fill="#dcfce7" rx="5" stroke="#16a34a" stroke-width="1"/>
  <text x="152" y="167" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#15803d" text-anchor="middle">Newton</text>
  <text x="152" y="178" font-family="Arial,sans-serif" font-size="10" fill="#166534" text-anchor="middle">1687 — Principia,</text>
  <text x="152" y="189" font-family="Arial,sans-serif" font-size="9" fill="#166534" text-anchor="middle">gravitação universal</text>

  <!-- EVENT 3: Maxwell 1865 — x=30+(265*1.381)=396 -->
  <circle cx="396" cy="110" r="7" fill="#d97706" stroke="#92400e" stroke-width="2"/>
  <line x1="396" y1="102" x2="396" y2="68" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="354" y="36" width="92" height="34" fill="#fef3c7" rx="5" stroke="#d97706" stroke-width="1"/>
  <text x="400" y="50" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#92400e" text-anchor="middle">Maxwell</text>
  <text x="400" y="61" font-family="Arial,sans-serif" font-size="10" fill="#a16207" text-anchor="middle">1865 — Eqs. EM,</text>
  <text x="400" y="72" font-family="Arial,sans-serif" font-size="9" fill="#a16207" text-anchor="middle">luz como onda EM</text>

  <!-- EVENT 4: Einstein 1905 — x=30+(305*1.381)=451 -->
  <circle cx="451" cy="110" r="7" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
  <line x1="451" y1="118" x2="451" y2="155" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="410" y="153" width="88" height="34" fill="#fee2e2" rx="5" stroke="#dc2626" stroke-width="1"/>
  <text x="454" y="167" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#991b1b" text-anchor="middle">Einstein</text>
  <text x="454" y="178" font-family="Arial,sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle">1905 — Rel. esp.,</text>
  <text x="454" y="189" font-family="Arial,sans-serif" font-size="9" fill="#b91c1c" text-anchor="middle">E = mc²</text>

  <!-- EVENT 5: Bohr 1913 — x=30+(313*1.381)=462 -->
  <!-- Stagger: put above since close to Einstein -->
  <circle cx="462" cy="110" r="6" fill="#7c3aed" stroke="#4c1d95" stroke-width="2"/>
  <line x1="462" y1="102" x2="462" y2="35" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="462" y="18" width="90" height="20" fill="#ede9fe" rx="4" stroke="#7c3aed" stroke-width="1"/>
  <text x="507" y="32" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#5b21b6" text-anchor="middle">Bohr 1913 — modelo atômico</text>

  <!-- EVENT 6: Higgs 2012 — x=30+(412*1.381)=599 -->
  <circle cx="599" cy="110" r="7" fill="#0891b2" stroke="#164e63" stroke-width="2"/>
  <line x1="599" y1="118" x2="599" y2="155" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="549" y="153" width="88" height="34" fill="#cffafe" rx="5" stroke="#0891b2" stroke-width="1"/>
  <text x="593" y="167" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#0e7490" text-anchor="middle">Bóson Higgs</text>
  <text x="593" y="178" font-family="Arial,sans-serif" font-size="10" fill="#155e75" text-anchor="middle">2012 — CERN,</text>
  <text x="593" y="189" font-family="Arial,sans-serif" font-size="9" fill="#155e75" text-anchor="middle">física de partículas</text>
</svg>
