<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 285" width="640" height="285">
  <rect width="640" height="285" fill="#f9fafb" rx="10"/>

  <!-- Title -->
  <text x="320" y="22" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">As 7 Unidades-Base do Sistema Internacional (SI)</text>

  <!-- Center hexagon label -->
  <circle cx="320" cy="155" r="42" fill="#1e2a78" stroke="#2f5bea" stroke-width="2"/>
  <text x="320" y="149" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">Sistema</text>
  <text x="320" y="163" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#facc15" text-anchor="middle">SI</text>
  <text x="320" y="176" font-family="Arial,sans-serif" font-size="9" fill="#93c5fd" text-anchor="middle">7 unidades-base</text>

  <!-- Lines from center to each unit (radius 105, then box at radius 130) -->
  <!-- 7 units at equal angles: 0°, 51.4°, 102.9°, 154.3°, 205.7°, 257.1°, 308.6° -->
  <!-- Approx: 0, 51, 103, 154, 206, 257, 309 degrees -->

  <!-- 1: metro (0°, right): center at (450, 155) -->
  <line x1="362" y1="155" x2="418" y2="155" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="418" y="130" width="108" height="50" fill="#dbeafe" rx="7" stroke="#2f5bea" stroke-width="2"/>
  <text x="472" y="148" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="middle">m</text>
  <text x="472" y="162" font-family="Arial,sans-serif" font-size="10" fill="#2563eb" text-anchor="middle">metro</text>
  <text x="472" y="174" font-family="Arial,sans-serif" font-size="9" fill="#3b82f6" text-anchor="middle">comprimento</text>

  <!-- 2: quilograma (51°): cos51=0.629, sin51=0.777; center at (320+105*0.629, 155-105*0.777)=(386,73) -->
  <line x1="356" y1="121" x2="378" y2="85" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="333" y="43" width="108" height="50" fill="#dcfce7" rx="7" stroke="#16a34a" stroke-width="2"/>
  <text x="387" y="61" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#15803d" text-anchor="middle">kg</text>
  <text x="387" y="76" font-family="Arial,sans-serif" font-size="10" fill="#16a34a" text-anchor="middle">quilograma</text>
  <text x="387" y="88" font-family="Arial,sans-serif" font-size="9" fill="#16a34a" text-anchor="middle">massa</text>

  <!-- 3: segundo (103°): cos103=-0.225, sin103=0.974; center at (320-23.6, 155-102.3)=(296,53) -->
  <line x1="289" y1="114" x2="276" y2="76" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="222" y="43" width="108" height="50" fill="#ede9fe" rx="7" stroke="#7c3aed" stroke-width="2"/>
  <text x="276" y="61" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#5b21b6" text-anchor="middle">s</text>
  <text x="276" y="76" font-family="Arial,sans-serif" font-size="10" fill="#6d28d9" text-anchor="middle">segundo</text>
  <text x="276" y="88" font-family="Arial,sans-serif" font-size="9" fill="#7c3aed" text-anchor="middle">tempo</text>

  <!-- 4: ampere (154°): cos154=-0.899, sin154=0.438; center at (320-94.4, 155-46)=(226,109) -->
  <line x1="279" y1="145" x2="242" y2="126" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="114" y="100" width="108" height="50" fill="#fef3c7" rx="7" stroke="#d97706" stroke-width="2"/>
  <text x="168" y="118" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#92400e" text-anchor="middle">A</text>
  <text x="168" y="132" font-family="Arial,sans-serif" font-size="10" fill="#a16207" text-anchor="middle">ampere</text>
  <text x="168" y="144" font-family="Arial,sans-serif" font-size="9" fill="#b45309" text-anchor="middle">corrente elétrica</text>

  <!-- 5: kelvin (206°): cos206=-0.899, sin206=-0.438; center at (226, 201) -->
  <line x1="279" y1="165" x2="242" y2="184" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="114" y="175" width="108" height="50" fill="#fee2e2" rx="7" stroke="#dc2626" stroke-width="2"/>
  <text x="168" y="193" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#dc2626" text-anchor="middle">K</text>
  <text x="168" y="207" font-family="Arial,sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle">kelvin</text>
  <text x="168" y="219" font-family="Arial,sans-serif" font-size="9" fill="#dc2626" text-anchor="middle">temperatura</text>

  <!-- 6: mol (257°): cos257=-0.225, sin257=-0.974; center at (296, 257) -->
  <line x1="289" y1="196" x2="276" y2="234" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="222" y="232" width="108" height="50" fill="#cffafe" rx="7" stroke="#0891b2" stroke-width="2"/>
  <text x="276" y="250" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#0e7490" text-anchor="middle">mol</text>
  <text x="276" y="264" font-family="Arial,sans-serif" font-size="10" fill="#0891b2" text-anchor="middle">mol</text>
  <text x="276" y="276" font-family="Arial,sans-serif" font-size="9" fill="#0891b2" text-anchor="middle">quant. de substância</text>

  <!-- 7: candela (309°): cos309=0.629, sin309=-0.777; center at (386, 237) -->
  <line x1="356" y1="189" x2="378" y2="225" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="333" y="222" width="108" height="50" fill="#fef9c3" rx="7" stroke="#ca8a04" stroke-width="2"/>
  <text x="387" y="241" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#713f12" text-anchor="middle">cd</text>
  <text x="387" y="255" font-family="Arial,sans-serif" font-size="10" fill="#a16207" text-anchor="middle">candela</text>
  <text x="387" y="267" font-family="Arial,sans-serif" font-size="9" fill="#ca8a04" text-anchor="middle">intensidade luminosa</text>
</svg>
