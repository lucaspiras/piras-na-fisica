<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260">
  <rect width="640" height="260" fill="#f9fafb" rx="10"/>

  <!-- Title -->
  <text x="320" y="22" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Grandezas Escalares vs. Grandezas Vetoriais</text>

  <!-- Divider -->
  <line x1="320" y1="35" x2="320" y2="250" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ===== LEFT: Escalares ===== -->
  <rect x="10" y="35" width="300" height="28" fill="#1e2a78" rx="6 6 0 0"/>
  <text x="160" y="53" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">ESCALARES</text>

  <rect x="10" y="63" width="300" height="183" fill="#f8faff" rx="0 0 8 8" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Scalar: temperature -->
  <rect x="22" y="73" width="276" height="42" fill="#fff7ed" rx="6" stroke="#fed7aa" stroke-width="1"/>
  <text x="55" y="90" font-family="Arial,sans-serif" font-size="22">🌡️</text>
  <text x="80" y="89" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#92400e">Temperatura</text>
  <text x="80" y="104" font-family="Arial,sans-serif" font-size="11" fill="#a16207">37°C → apenas um número (magnitude)</text>

  <!-- Scalar: mass -->
  <rect x="22" y="119" width="276" height="42" fill="#f0fdf4" rx="6" stroke="#bbf7d0" stroke-width="1"/>
  <text x="55" y="136" font-family="Arial,sans-serif" font-size="22">⚖️</text>
  <text x="80" y="135" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#15803d">Massa</text>
  <text x="80" y="150" font-family="Arial,sans-serif" font-size="11" fill="#16a34a">70 kg → apenas quantidade, sem direção</text>

  <!-- Scalar: time -->
  <rect x="22" y="165" width="276" height="42" fill="#f5f3ff" rx="6" stroke="#ddd6fe" stroke-width="1"/>
  <text x="55" y="182" font-family="Arial,sans-serif" font-size="22">⏱️</text>
  <text x="80" y="181" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#5b21b6">Tempo / Energia / Volume</text>
  <text x="80" y="196" font-family="Arial,sans-serif" font-size="11" fill="#7c3aed">3 horas, 500 J, 2 litros → sem direção</text>

  <!-- Scalar tag -->
  <rect x="22" y="213" width="276" height="26" fill="#e0e7ff" rx="5"/>
  <text x="160" y="230" font-family="Arial,sans-serif" font-size="11" fill="#3730a3" text-anchor="middle" font-weight="bold">Definido por: um número + unidade</text>

  <!-- ===== RIGHT: Vetoriais ===== -->
  <rect x="330" y="35" width="300" height="28" fill="#1e2a78" rx="6 6 0 0"/>
  <text x="480" y="53" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#facc15" text-anchor="middle">VETORIAIS</text>

  <rect x="330" y="63" width="300" height="183" fill="#fff8f0" rx="0 0 8 8" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Arrow defs -->
  <defs>
    <marker id="aVec" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0,8 2.5,0 5" fill="#dc2626"/>
    </marker>
    <marker id="aVec2" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0,8 2.5,0 5" fill="#2f5bea"/>
    </marker>
    <marker id="aVec3" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0,8 2.5,0 5" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Vector: force -->
  <rect x="342" y="73" width="276" height="42" fill="#fee2e2" rx="6" stroke="#fca5a5" stroke-width="1"/>
  <line x1="365" y1="94" x2="415" y2="94" stroke="#dc2626" stroke-width="2.5" marker-end="url(#aVec)"/>
  <text x="430" y="88" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#991b1b">Força</text>
  <text x="430" y="102" font-family="Arial,sans-serif" font-size="10" fill="#b91c1c">10 N para a direita → direção importa!</text>

  <!-- Vector: velocity -->
  <rect x="342" y="119" width="276" height="42" fill="#dbeafe" rx="6" stroke="#93c5fd" stroke-width="1"/>
  <line x1="365" y1="135" x2="400" y2="118" stroke="#2f5bea" stroke-width="2.5" marker-end="url(#aVec2)"/>
  <text x="430" y="132" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1e40af">Velocidade</text>
  <text x="430" y="147" font-family="Arial,sans-serif" font-size="10" fill="#1d4ed8">60 km/h para norte → módulo + direção</text>

  <!-- Vector: weight -->
  <rect x="342" y="165" width="276" height="42" fill="#dcfce7" rx="6" stroke="#86efac" stroke-width="1"/>
  <line x1="380" y1="172" x2="380" y2="200" stroke="#16a34a" stroke-width="2.5" marker-end="url(#aVec3)"/>
  <text x="400" y="181" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#15803d">Peso / Deslocamento</text>
  <text x="400" y="196" font-family="Arial,sans-serif" font-size="10" fill="#16a34a">sempre aponta para baixo (campo grav.)</text>

  <!-- Vector tag -->
  <rect x="342" y="213" width="276" height="26" fill="#fef3c7" rx="5"/>
  <text x="480" y="230" font-family="Arial,sans-serif" font-size="11" fill="#713f12" text-anchor="middle" font-weight="bold">Definido por: número + unidade + direção + sentido</text>
</svg>
