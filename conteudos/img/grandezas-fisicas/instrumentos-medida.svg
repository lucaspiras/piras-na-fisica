<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280">
  <rect width="640" height="280" fill="#f9fafb" rx="10"/>

  <!-- Title -->
  <text x="320" y="22" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Instrumentos de Medida Comuns em Física</text>

  <!-- Grid: 3 columns × 2 rows -->
  <!-- Col positions: 10, 220, 430 | Row positions: 35, 155 -->

  <!-- === RÉGUA === -->
  <rect x="10" y="35" width="200" height="110" fill="#dbeafe" rx="8" stroke="#2f5bea" stroke-width="1.5"/>
  <text x="110" y="52" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">📏 Régua</text>
  <!-- Ruler drawing -->
  <rect x="25" y="60" width="170" height="18" fill="#fbbf24" stroke="#d97706" stroke-width="1" rx="2"/>
  <line x1="25" y1="78" x2="195" y2="78" stroke="#92400e" stroke-width="0.5"/>
  <!-- Tick marks -->
  <line x1="30"  y1="78" x2="30"  y2="68" stroke="#92400e" stroke-width="1"/>
  <line x1="47"  y1="78" x2="47"  y2="72" stroke="#92400e" stroke-width="0.8"/>
  <line x1="64"  y1="78" x2="64"  y2="68" stroke="#92400e" stroke-width="1"/>
  <line x1="81"  y1="78" x2="81"  y2="72" stroke="#92400e" stroke-width="0.8"/>
  <line x1="98"  y1="78" x2="98"  y2="68" stroke="#92400e" stroke-width="1"/>
  <line x1="115" y1="78" x2="115" y2="72" stroke="#92400e" stroke-width="0.8"/>
  <line x1="132" y1="78" x2="132" y2="68" stroke="#92400e" stroke-width="1"/>
  <line x1="149" y1="78" x2="149" y2="72" stroke="#92400e" stroke-width="0.8"/>
  <line x1="166" y1="78" x2="166" y2="68" stroke="#92400e" stroke-width="1"/>
  <line x1="183" y1="78" x2="183" y2="72" stroke="#92400e" stroke-width="0.8"/>
  <text x="110" y="104" font-family="Arial,sans-serif" font-size="11" fill="#1e40af" text-anchor="middle">Grandeza: comprimento</text>
  <text x="110" y="117" font-family="Arial,sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle">Precisão: ~1 mm</text>
  <text x="110" y="130" font-family="Arial,sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle">Unidade: metro (m)</text>

  <!-- === BALANÇA === -->
  <rect x="220" y="35" width="200" height="110" fill="#dcfce7" rx="8" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="52" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">⚖️ Balança</text>
  <!-- Balance drawing -->
  <line x1="320" y1="62" x2="320" y2="82" stroke="#374151" stroke-width="2"/>
  <line x1="260" y1="72" x2="380" y2="72" stroke="#374151" stroke-width="2"/>
  <rect x="245" y="80" width="30" height="14" fill="#94a3b8" rx="2"/>
  <rect x="365" y="80" width="30" height="14" fill="#94a3b8" rx="2"/>
  <text x="260" y="90" font-family="Arial,sans-serif" font-size="9" fill="#475569" text-anchor="middle">obj</text>
  <text x="380" y="90" font-family="Arial,sans-serif" font-size="9" fill="#475569" text-anchor="middle">ref</text>
  <text x="320" y="104" font-family="Arial,sans-serif" font-size="11" fill="#166534" text-anchor="middle">Grandeza: massa</text>
  <text x="320" y="117" font-family="Arial,sans-serif" font-size="10" fill="#16a34a" text-anchor="middle">Precisão: 0,001 g (analítica)</text>
  <text x="320" y="130" font-family="Arial,sans-serif" font-size="10" fill="#16a34a" text-anchor="middle">Unidade: quilograma (kg)</text>

  <!-- === TERMÔMETRO === -->
  <rect x="430" y="35" width="200" height="110" fill="#fef3c7" rx="8" stroke="#d97706" stroke-width="1.5"/>
  <text x="530" y="52" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#92400e" text-anchor="middle">🌡️ Termômetro</text>
  <!-- Thermometer drawing -->
  <rect x="515" y="58" width="12" height="34" fill="#e5e7eb" rx="6" stroke="#9ca3af" stroke-width="1"/>
  <rect x="517" y="74" width="8"  height="18" fill="#ef4444" rx="3"/>
  <circle cx="521" cy="96" r="8" fill="#ef4444" stroke="#dc2626" stroke-width="1"/>
  <text x="538" y="75" font-family="Arial,sans-serif" font-size="10" fill="#92400e">37°C</text>
  <text x="530" y="104" font-family="Arial,sans-serif" font-size="11" fill="#92400e" text-anchor="middle">Grandeza: temperatura</text>
  <text x="530" y="117" font-family="Arial,sans-serif" font-size="10" fill="#a16207" text-anchor="middle">Precisão: ~0,1 °C</text>
  <text x="530" y="130" font-family="Arial,sans-serif" font-size="10" fill="#a16207" text-anchor="middle">Unidade: kelvin / °C</text>

  <!-- === CRONÔMETRO === -->
  <rect x="10" y="155" width="200" height="110" fill="#ede9fe" rx="8" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="110" y="172" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#5b21b6" text-anchor="middle">⏱️ Cronômetro</text>
  <!-- Stopwatch face -->
  <circle cx="110" cy="210" r="22" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <line x1="110" y1="210" x2="110" y2="193" stroke="#374151" stroke-width="2"/>
  <line x1="110" y1="210" x2="122" y2="204" stroke="#374151" stroke-width="1.5"/>
  <circle cx="110" cy="210" r="3" fill="#374151"/>
  <text x="110" y="244" font-family="Arial,sans-serif" font-size="11" fill="#5b21b6" text-anchor="middle">Grandeza: tempo</text>
  <text x="110" y="257" font-family="Arial,sans-serif" font-size="10" fill="#7c3aed" text-anchor="middle">Precisão: ~0,01 s (digital)</text>

  <!-- === PAQUÍMETRO === -->
  <rect x="220" y="155" width="200" height="110" fill="#cffafe" rx="8" stroke="#0891b2" stroke-width="1.5"/>
  <text x="320" y="172" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#0e7490" text-anchor="middle">🔧 Paquímetro</text>
  <!-- Caliper sketch -->
  <rect x="245" y="185" width="145" height="10" fill="#94a3b8" rx="1" stroke="#64748b" stroke-width="1"/>
  <rect x="245" y="185" width="8"  height="20" fill="#64748b" rx="1"/>
  <rect x="320" y="185" width="8"  height="20" fill="#64748b" rx="1"/>
  <text x="284" y="215" font-family="Arial,sans-serif" font-size="9" fill="#0e7490" text-anchor="middle">|←  d  →|</text>
  <text x="320" y="232" font-family="Arial,sans-serif" font-size="11" fill="#0e7490" text-anchor="middle">Grandeza: comprimento</text>
  <text x="320" y="245" font-family="Arial,sans-serif" font-size="10" fill="#0891b2" text-anchor="middle">Precisão: 0,02 mm</text>
  <text x="320" y="258" font-family="Arial,sans-serif" font-size="10" fill="#0891b2" text-anchor="middle">Unidade: milímetro (mm)</text>

  <!-- === MULTÍMETRO === -->
  <rect x="430" y="155" width="200" height="110" fill="#ffedd5" rx="8" stroke="#ea580c" stroke-width="1.5"/>
  <text x="530" y="172" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#9a3412" text-anchor="middle">🔌 Multímetro</text>
  <!-- Digital display -->
  <rect x="480" y="180" width="100" height="28" fill="#1f2937" rx="4"/>
  <text x="530" y="200" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#22c55e" text-anchor="middle" font-family="Courier New, monospace">12.4 V</text>
  <text x="530" y="224" font-family="Arial,sans-serif" font-size="11" fill="#9a3412" text-anchor="middle">Grandeza: tensão/corr./res.</text>
  <text x="530" y="237" font-family="Arial,sans-serif" font-size="10" fill="#ea580c" text-anchor="middle">V, A, Ω — Precisão: ~1%</text>
  <text x="530" y="250" font-family="Arial,sans-serif" font-size="10" fill="#ea580c" text-anchor="middle">Unidade: volt, ampere, ohm</text>
</svg>
