<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330">
  <rect width="640" height="330" fill="#f9fafb" rx="10"/>

  <!-- Title -->
  <text x="320" y="22" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Gráfico S×t — Movimento Retilíneo Uniforme</text>

  <!-- Graph area: left=75, right=570, top=38, bottom=280 -->
  <!-- Grid lines (light) -->
  <!-- Horizontal grids at y=76(s=60), y=117(s=40), y=157(s=20), y=198(s=0), y=239(s=-20), y=280(s=-40) -->
  <line x1="75" y1="76"  x2="570" y2="76"  stroke="#e2e8f0" stroke-width="1"/>
  <line x1="75" y1="117" x2="570" y2="117" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="75" y1="157" x2="570" y2="157" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="75" y1="198" x2="570" y2="198" stroke="#e5e7eb" stroke-width="1.5"/>
  <line x1="75" y1="239" x2="570" y2="239" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Vertical grids at t=2,4,6,8 -->
  <line x1="199" y1="38" x2="199" y2="280" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="323" y1="38" x2="323" y2="280" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="447" y1="38" x2="447" y2="280" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="570" y1="38" x2="570" y2="280" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Axes -->
  <defs>
    <marker id="axA" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,9 3,0 6" fill="#475569"/>
    </marker>
  </defs>
  <!-- Y axis -->
  <line x1="75" y1="280" x2="75" y2="32" stroke="#475569" stroke-width="2" marker-end="url(#axA)"/>
  <!-- X axis at s=0 (y=198) -->
  <line x1="75" y1="198" x2="578" y2="198" stroke="#475569" stroke-width="2" marker-end="url(#axA)"/>

  <!-- Y-axis ticks and labels -->
  <line x1="70" y1="76"  x2="80" y2="76"  stroke="#64748b" stroke-width="1.5"/>
  <text x="64" y="80"  font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="end">60</text>
  <line x1="70" y1="117" x2="80" y2="117" stroke="#64748b" stroke-width="1.5"/>
  <text x="64" y="121" font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="end">40</text>
  <line x1="70" y1="157" x2="80" y2="157" stroke="#64748b" stroke-width="1.5"/>
  <text x="64" y="161" font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="end">20</text>
  <text x="64" y="202" font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="end">0</text>
  <line x1="70" y1="239" x2="80" y2="239" stroke="#64748b" stroke-width="1.5"/>
  <text x="64" y="243" font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="end">−20</text>

  <!-- X-axis ticks and labels -->
  <line x1="199" y1="193" x2="199" y2="203" stroke="#64748b" stroke-width="1.5"/>
  <text x="199" y="216" font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="middle">2</text>
  <line x1="323" y1="193" x2="323" y2="203" stroke="#64748b" stroke-width="1.5"/>
  <text x="323" y="216" font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="middle">4</text>
  <line x1="447" y1="193" x2="447" y2="203" stroke="#64748b" stroke-width="1.5"/>
  <text x="447" y="216" font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="middle">6</text>
  <line x1="570" y1="193" x2="570" y2="203" stroke="#64748b" stroke-width="1.5"/>
  <text x="570" y="216" font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="middle">8</text>

  <!-- Axis labels -->
  <text x="590" y="202" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#475569">t (s)</text>
  <text x="60"  y="30"  font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#475569">s (m)</text>

  <!-- LINE 1: v > 0 (blue) — starts s₀=-20m (y=239), ends s=44m (y=108) at t=8 -->
  <!-- y = 198 - s*2.042; s=-20→y=239; s=44→y=108 -->
  <line x1="75" y1="239" x2="570" y2="108" stroke="#2f5bea" stroke-width="2.5"/>
  <!-- v>0 label -->
  <text x="575" y="105" font-family="Arial,sans-serif" font-size="12" fill="#2f5bea" font-weight="bold">v &gt; 0</text>

  <!-- LINE 2: v = 0 (green, dashed) — horizontal at s=25m (y=147) -->
  <line x1="75" y1="147" x2="570" y2="147" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="8,4"/>
  <!-- v=0 label -->
  <text x="575" y="151" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" font-weight="bold">v = 0</text>

  <!-- LINE 3: v < 0 (red) — starts s₀=56m (y=84), ends s=0 (y=198) at t=8 -->
  <!-- s = 56 - 7t; y=198-s*2.042; at t=0: s=56→y=84; at t=8: s=0→y=198 -->
  <line x1="75" y1="84" x2="570" y2="198" stroke="#dc2626" stroke-width="2.5"/>
  <!-- v<0 label -->
  <text x="575" y="195" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" font-weight="bold">v &lt; 0</text>

  <!-- Legend (bottom) -->
  <rect x="75" y="290" width="495" height="32" fill="#fff" rx="5" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Blue -->
  <line x1="95" y1="306" x2="122" y2="306" stroke="#2f5bea" stroke-width="2.5"/>
  <text x="127" y="310" font-family="Arial,sans-serif" font-size="11" fill="#2f5bea">v &gt; 0 (afastando, sentido +)</text>
  <!-- Green -->
  <line x1="290" y1="306" x2="317" y2="306" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="322" y="310" font-family="Arial,sans-serif" font-size="11" fill="#16a34a">v = 0 (em repouso)</text>
  <!-- Red -->
  <line x1="460" y1="306" x2="487" y2="306" stroke="#dc2626" stroke-width="2.5"/>
  <text x="492" y="310" font-family="Arial,sans-serif" font-size="11" fill="#dc2626">v &lt; 0 (sentido −)</text>

  <!-- Incl. note -->
  <text x="320" y="232" font-family="Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle" font-style="italic">inclinação = velocidade</text>
</svg>
