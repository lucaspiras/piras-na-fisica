<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <rect width="640" height="300" fill="#f9fafb" rx="10"/>

  <!-- Title -->
  <text x="320" y="22" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Lançamento Oblíquo — Diferentes Ângulos (v₀ = 30 m/s)</text>

  <!-- Ground -->
  <line x1="30" y1="265" x2="617" y2="265" stroke="#374151" stroke-width="2"/>
  <!-- Ground hatch -->
  <line x1="35"  y1="265" x2="27"  y2="275" stroke="#9ca3af" stroke-width="1"/>
  <line x1="65"  y1="265" x2="57"  y2="275" stroke="#9ca3af" stroke-width="1"/>
  <line x1="95"  y1="265" x2="87"  y2="275" stroke="#9ca3af" stroke-width="1"/>
  <line x1="125" y1="265" x2="117" y2="275" stroke="#9ca3af" stroke-width="1"/>
  <line x1="155" y1="265" x2="147" y2="275" stroke="#9ca3af" stroke-width="1"/>
  <line x1="185" y1="265" x2="177" y2="275" stroke="#9ca3af" stroke-width="1"/>
  <line x1="215" y1="265" x2="207" y2="275" stroke="#9ca3af" stroke-width="1"/>
  <line x1="245" y1="265" x2="237" y2="275" stroke="#9ca3af" stroke-width="1"/>
  <line x1="275" y1="265" x2="267" y2="275" stroke="#9ca3af" stroke-width="1"/>
  <line x1="305" y1="265" x2="297" y2="275" stroke="#9ca3af" stroke-width="1"/>
  <line x1="335" y1="265" x2="327" y2="275" stroke="#9ca3af" stroke-width="1"/>
  <line x1="365" y1="265" x2="357" y2="275" stroke="#9ca3af" stroke-width="1"/>
  <line x1="395" y1="265" x2="387" y2="275" stroke="#9ca3af" stroke-width="1"/>
  <line x1="425" y1="265" x2="417" y2="275" stroke="#9ca3af" stroke-width="1"/>
  <line x1="455" y1="265" x2="447" y2="275" stroke="#9ca3af" stroke-width="1"/>
  <line x1="485" y1="265" x2="477" y2="275" stroke="#9ca3af" stroke-width="1"/>
  <line x1="515" y1="265" x2="507" y2="275" stroke="#9ca3af" stroke-width="1"/>
  <line x1="545" y1="265" x2="537" y2="275" stroke="#9ca3af" stroke-width="1"/>
  <line x1="575" y1="265" x2="567" y2="275" stroke="#9ca3af" stroke-width="1"/>
  <line x1="605" y1="265" x2="597" y2="275" stroke="#9ca3af" stroke-width="1"/>

  <!-- Launch point -->
  <circle cx="30" cy="265" r="5" fill="#374151"/>

  <!-- Parabolas using quadratic bezier: Q cx cy, end_x end_y
       Scale: x=0→30px, x=90m→610px → 1m = 6.444px
              y=0→265px, y=46m→265-200px=65px → 1m = 4.348px

       Control point formula: Ctrl = 2*Apex - (Start+End)/2
  -->

  <!-- 15° — Range=45m, Hmax=3m (very flat) — light gray -->
  <!-- Apex: x=22.5m→175px, y=3m→252px; End: 45m→320px -->
  <!-- Ctrl: (2*175-175, 2*252-262.5) = (175, 241.5) -->
  <path d="M30,265 Q175,241 320,265" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="175" y="238" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">15°</text>

  <!-- 75° — Range=45m, Hmax=42m (very tall) — matches 15° range -->
  <!-- Apex: x=22.5m→175px, y=42m→82.5px; End: 45m→320px -->
  <!-- Ctrl: (2*175-(30+320)/2, 2*82.5-(265+265)/2) = (2*175-175, 2*82.5-265) = (175, -100) -->
  <path d="M30,265 Q175,-100 320,265" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6,3"/>
  <text x="72" y="135" font-family="Arial,sans-serif" font-size="10" fill="#64748b">75°</text>

  <!-- 30° — Range=77.9m, Hmax=11.25m — orange -->
  <!-- Apex: x=38.95m→281px, y=11.25m→216px; End: 77.9m→532px -->
  <!-- Ctrl: (2*281-(30+532)/2, 2*216-(265+265)/2) = (2*281-281, 2*216-265) = (281, 167) -->
  <path d="M30,265 Q281,167 532,265" fill="none" stroke="#f97316" stroke-width="2.2"/>
  <text x="281" y="162" font-family="Arial,sans-serif" font-size="10" fill="#f97316" text-anchor="middle">30°</text>

  <!-- 60° — Range=77.9m, Hmax=33.75m (same range as 30°) — orange dashed -->
  <!-- Apex: x=38.95m→281px, y=33.75m→118px; End: 77.9m→532px -->
  <!-- Ctrl: (2*281-281, 2*118-265) = (281, -29) -->
  <path d="M30,265 Q281,-29 532,265" fill="none" stroke="#f97316" stroke-width="2.2" stroke-dasharray="6,3"/>
  <text x="120" y="108" font-family="Arial,sans-serif" font-size="10" fill="#f97316">60°</text>

  <!-- 45° — Range=90m (MAX), Hmax=22.5m — blue, thicker -->
  <!-- Apex: x=45m→320px, y=22.5m→167px; End: 90m→610px -->
  <!-- Ctrl: (2*320-(30+610)/2, 2*167-(265+265)/2) = (2*320-320, 2*167-265) = (320, 69) -->
  <path d="M30,265 Q320,69 610,265" fill="none" stroke="#2f5bea" stroke-width="3"/>
  <text x="328" y="62" font-family="Arial,sans-serif" font-size="11" fill="#2f5bea" font-weight="bold">45° — alcance máximo!</text>

  <!-- Landing markers -->
  <!-- 15° and 75° land at x=320 -->
  <circle cx="320" cy="265" r="4" fill="#64748b"/>
  <!-- 30° and 60° land at x=532 -->
  <circle cx="532" cy="265" r="4" fill="#f97316"/>
  <!-- 45° lands at x=610 -->
  <circle cx="610" cy="265" r="5" fill="#2f5bea"/>

  <!-- Range arrows at bottom -->
  <line x1="30" y1="286" x2="320" y2="286" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="30"  y1="282" x2="30"  y2="290" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="320" y1="282" x2="320" y2="290" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="175" y="297" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">R = 45 m  (15° = 75°)</text>

  <line x1="30" y1="285" x2="532" y2="285" stroke="#f97316" stroke-width="0.5" opacity="0.3"/>
  <text x="320" y="252" font-family="Arial,sans-serif" font-size="10" fill="#f97316" text-anchor="middle">R = 78 m  (30° = 60°)</text>

  <!-- Complementary angle note -->
  <rect x="390" y="38" width="245" height="30" fill="#dbeafe" rx="5" stroke="#93c5fd" stroke-width="1"/>
  <text x="512" y="52" font-family="Arial,sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="bold">Ângulos complementares (θ e 90°−θ)</text>
  <text x="512" y="63" font-family="Arial,sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle">têm o mesmo alcance horizontal</text>
</svg>
