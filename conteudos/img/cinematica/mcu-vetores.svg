<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 295" width="640" height="295">
  <rect width="640" height="295" fill="#f9fafb" rx="10"/>

  <!-- Title -->
  <text x="320" y="22" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Movimento Circular Uniforme — Vetores Velocidade e Aceleração</text>

  <!-- Arrow defs -->
  <defs>
    <marker id="aVel" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2f5bea"/>
    </marker>
    <marker id="aAcc" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#dc2626"/>
    </marker>
    <marker id="aRad" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0,8 2.5,0 5" fill="#94a3b8"/>
    </marker>
    <!-- Arc arrow for rotation direction -->
    <marker id="aArc" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0,8 2.5,0 5" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Center of orbit -->
  <circle cx="230" cy="160" r="4" fill="#64748b"/>
  <text x="240" y="175" font-family="Arial,sans-serif" font-size="11" fill="#64748b">Centro</text>

  <!-- Orbit circle (radius = 110px) -->
  <circle cx="230" cy="160" r="110" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- CCW rotation arrow arc -->
  <path d="M 310,75 A 80,80 0 0,1 148,102" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#aArc)"/>
  <text x="330" y="65" font-family="Arial,sans-serif" font-size="10" fill="#64748b" font-style="italic">sentido anti-horário</text>

  <!-- ===== BALL AT RIGHT (0°): position (340, 160) ===== -->
  <!-- radius: from center(230,160) to ball(340,160) — horizontal right -->
  <!-- v: tangent (CCW at right = upward) -->
  <!-- a_c: toward center (leftward) -->
  <circle cx="340" cy="160" r="10" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <!-- Radius line (dashed) -->
  <line x1="234" y1="160" x2="330" y2="160" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- r label -->
  <text x="282" y="153" font-family="Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">r</text>
  <!-- v vector (upward) -->
  <line x1="340" y1="149" x2="340" y2="95" stroke="#2f5bea" stroke-width="3" marker-end="url(#aVel)"/>
  <text x="357" y="118" font-family="Arial,sans-serif" font-size="13" fill="#2f5bea" font-weight="bold">v</text>
  <text x="357" y="131" font-family="Arial,sans-serif" font-size="10" fill="#2f5bea">(tangencial)</text>
  <!-- a_c vector (leftward toward center) -->
  <line x1="329" y1="160" x2="286" y2="160" stroke="#dc2626" stroke-width="3" marker-end="url(#aAcc)"/>
  <text x="304" y="180" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" font-weight="bold">aₓ</text>
  <text x="284" y="190" font-family="Arial,sans-serif" font-size="10" fill="#dc2626">(centrípeta)</text>

  <!-- ===== BALL AT TOP (90°): position (230, 50) ===== -->
  <circle cx="230" cy="50" r="9" fill="#f97316" stroke="#c2410c" stroke-width="1.5" opacity="0.85"/>
  <line x1="230" y1="54" x2="230" y2="147" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <!-- v vector (rightward at top) -->
  <line x1="239" y1="50" x2="278" y2="50" stroke="#2f5bea" stroke-width="2.5" marker-end="url(#aVel)" opacity="0.8"/>
  <!-- a_c vector (downward at top) -->
  <line x1="230" y1="59" x2="230" y2="88" stroke="#dc2626" stroke-width="2.5" marker-end="url(#aAcc)" opacity="0.8"/>

  <!-- ===== BALL AT LEFT (180°): position (120, 160) ===== -->
  <circle cx="120" cy="160" r="9" fill="#f97316" stroke="#c2410c" stroke-width="1.5" opacity="0.85"/>
  <line x1="124" y1="160" x2="226" y2="160" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <!-- v vector (downward at left) -->
  <line x1="120" y1="169" x2="120" y2="208" stroke="#2f5bea" stroke-width="2.5" marker-end="url(#aVel)" opacity="0.8"/>
  <!-- a_c vector (rightward at left) -->
  <line x1="130" y1="160" x2="172" y2="160" stroke="#dc2626" stroke-width="2.5" marker-end="url(#aAcc)" opacity="0.8"/>

  <!-- ===== BALL AT BOTTOM (270°): position (230, 270) ===== -->
  <circle cx="230" cy="270" r="9" fill="#f97316" stroke="#c2410c" stroke-width="1.5" opacity="0.85"/>
  <line x1="230" y1="173" x2="230" y2="261" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <!-- v vector (leftward at bottom) -->
  <line x1="221" y1="270" x2="182" y2="270" stroke="#2f5bea" stroke-width="2.5" marker-end="url(#aVel)" opacity="0.8"/>
  <!-- a_c vector (upward at bottom) -->
  <line x1="230" y1="261" x2="230" y2="232" stroke="#dc2626" stroke-width="2.5" marker-end="url(#aAcc)" opacity="0.8"/>

  <!-- Key observation: v ⊥ r -->
  <rect x="30" y="243" width="200" height="28" fill="#dbeafe" rx="5" stroke="#93c5fd" stroke-width="1"/>
  <text x="130" y="257" font-family="Arial,sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="bold">v ⊥ r  (sempre tangencial)</text>
  <text x="130" y="268" font-family="Arial,sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle">perpendicular ao raio</text>

  <rect x="30" y="276" width="200" height="14" fill="#fee2e2" rx="3" stroke="#fca5a5" stroke-width="1"/>
  <text x="130" y="287" font-family="Arial,sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="bold">aₓ sempre aponta para o centro</text>

  <!-- RIGHT PANEL: Formulas -->
  <rect x="390" y="38" width="235" height="240" fill="#fff" rx="8" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="507" y="58" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Grandezas do MCU</text>
  <line x1="398" y1="63" x2="617" y2="63" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Period -->
  <text x="405" y="81" font-family="Arial,sans-serif" font-size="11" fill="#374151" font-weight="bold">Período T (s)</text>
  <text x="405" y="95" font-family="Arial,sans-serif" font-size="11" fill="#475569">T = tempo de 1 volta completa</text>

  <!-- Frequency -->
  <text x="405" y="115" font-family="Arial,sans-serif" font-size="11" fill="#374151" font-weight="bold">Frequência f (Hz)</text>
  <text x="405" y="129" font-family="Arial,sans-serif" font-size="11" fill="#475569">f = 1/T  (voltas por segundo)</text>

  <!-- Speed -->
  <text x="405" y="149" font-family="Arial,sans-serif" font-size="11" fill="#2f5bea" font-weight="bold">Velocidade v (m/s)</text>
  <rect x="405" y="155" width="210" height="26" fill="#dbeafe" rx="3" opacity="0.5"/>
  <text x="510" y="172" font-family="Arial,sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle">v = 2πr/T = 2πrf</text>

  <!-- Centripetal acceleration -->
  <text x="405" y="201" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" font-weight="bold">Aceleração centrípeta (m/s²)</text>
  <rect x="405" y="207" width="210" height="26" fill="#fee2e2" rx="3" opacity="0.5"/>
  <text x="510" y="224" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">aₓ = v²/r = ω²r = 4π²rf²</text>

  <!-- Angular velocity -->
  <text x="405" y="250" font-family="Arial,sans-serif" font-size="11" fill="#374151" font-weight="bold">Velocidade angular ω (rad/s)</text>
  <text x="405" y="264" font-family="Arial,sans-serif" font-size="11" fill="#475569">ω = 2π/T = 2πf  →  v = ωr</text>
</svg>
