<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 195" width="640" height="195">
  <rect width="640" height="195" fill="#f9fafb" rx="10"/>

  <!-- Title -->
  <text x="320" y="24" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Posição em uma Dimensão — Eixo de Posições</text>

  <!-- Axis arrow -->
  <defs>
    <marker id="aAxis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#475569"/>
    </marker>
    <marker id="aAxisL" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0,0 3.5,10 7" fill="#94a3b8"/>
    </marker>
  </defs>
  <line x1="30" y1="92" x2="614" y2="92" stroke="#475569" stroke-width="2.2" marker-end="url(#aAxis)"/>

  <!-- Tick marks: positions -5 to +5, scale = 54px/unit, origin at x=320 -->
  <!-- -5 -->
  <line x1="50"  y1="85" x2="50"  y2="99" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="50"  y="114" font-family="Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="middle">−5</text>
  <!-- -4 -->
  <line x1="104" y1="88" x2="104" y2="96" stroke="#cbd5e1" stroke-width="1"/>
  <text x="104" y="114" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">−4</text>
  <!-- -3 -->
  <line x1="158" y1="85" x2="158" y2="99" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="158" y="114" font-family="Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="middle">−3</text>
  <!-- -1 -->
  <line x1="266" y1="88" x2="266" y2="96" stroke="#cbd5e1" stroke-width="1"/>
  <text x="266" y="114" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">−1</text>
  <!-- 0 origin -->
  <line x1="320" y1="80" x2="320" y2="104" stroke="#475569" stroke-width="2"/>
  <text x="320" y="118" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">0</text>
  <!-- dashed line from "Origem" label to axis -->
  <line x1="320" y1="55" x2="320" y2="79" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="320" y="50" font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-style="italic">Origem (O)</text>
  <!-- +1 -->
  <line x1="374" y1="88" x2="374" y2="96" stroke="#cbd5e1" stroke-width="1"/>
  <text x="374" y="114" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">+1</text>
  <!-- +2 -->
  <line x1="428" y1="85" x2="428" y2="99" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="428" y="114" font-family="Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="middle">+2</text>
  <!-- +4 -->
  <line x1="536" y1="85" x2="536" y2="99" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="536" y="114" font-family="Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="middle">+4</text>
  <!-- +5 -->
  <line x1="590" y1="85" x2="590" y2="99" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="590" y="114" font-family="Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="middle">+5</text>

  <!-- Unit label -->
  <text x="617" y="95" font-family="Arial,sans-serif" font-size="12" fill="#475569">m</text>

  <!-- POINT B at s = -2 m  (x = 320 - 2*54 = 212) — orange/red -->
  <circle cx="212" cy="92" r="11" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <text x="212" y="97" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">B</text>
  <!-- Label above -->
  <text x="212" y="72" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#c2410c" text-anchor="middle">s = −2 m</text>
  <line x1="212" y1="75" x2="212" y2="80" stroke="#c2410c" stroke-width="1.5"/>

  <!-- POINT A at s = +3 m  (x = 320 + 3*54 = 482) — blue -->
  <circle cx="482" cy="92" r="11" fill="#2f5bea" stroke="#1e40af" stroke-width="2"/>
  <text x="482" y="97" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">A</text>
  <!-- Label above -->
  <text x="482" y="72" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">s = +3 m</text>
  <line x1="482" y1="75" x2="482" y2="80" stroke="#1e40af" stroke-width="1.5"/>

  <!-- "sentido +" label -->
  <text x="595" y="80" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">sentido +</text>

  <!-- Legend at bottom -->
  <text x="320" y="155" font-family="Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">s &gt; 0 → à direita da origem  |  s &lt; 0 → à esquerda da origem  |  s = 0 → na origem</text>

  <!-- negative region shading (subtle) -->
  <rect x="30" y="86" width="290" height="12" fill="#fef3c7" opacity="0.5" rx="2"/>
  <rect x="320" y="86" width="284" height="12" fill="#dbeafe" opacity="0.5" rx="2"/>

  <!-- Region labels -->
  <text x="175" y="178" font-family="Arial,sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-style="italic">s &lt; 0</text>
  <text x="462" y="178" font-family="Arial,sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-style="italic">s &gt; 0</text>
</svg>
