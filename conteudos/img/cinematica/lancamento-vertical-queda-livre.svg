<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280">
  <rect width="640" height="280" fill="#f9fafb" rx="10"/>

  <!-- Title -->
  <text x="320" y="22" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Queda Livre — Independência da Massa</text>

  <!-- Divider -->
  <line x1="320" y1="38" x2="320" y2="250" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ====== LEFT: In air (different speeds) ====== -->
  <text x="160" y="45" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">No ar</text>

  <!-- Air label (blue atmosphere hint) -->
  <rect x="30" y="53" width="260" height="190" fill="#eff6ff" rx="6" opacity="0.6"/>
  <text x="270" y="70" font-family="Arial,sans-serif" font-size="11" fill="#3b82f6" text-anchor="end" font-style="italic">resistência do ar</text>

  <!-- Ground line (left) -->
  <line x1="30" y1="244" x2="290" y2="244" stroke="#6b7280" stroke-width="2"/>
  <!-- Ground hatch -->
  <line x1="35" y1="244" x2="25" y2="254" stroke="#9ca3af" stroke-width="1"/>
  <line x1="60" y1="244" x2="50" y2="254" stroke="#9ca3af" stroke-width="1"/>
  <line x1="85" y1="244" x2="75" y2="254" stroke="#9ca3af" stroke-width="1"/>
  <line x1="110" y1="244" x2="100" y2="254" stroke="#9ca3af" stroke-width="1"/>
  <line x1="135" y1="244" x2="125" y2="254" stroke="#9ca3af" stroke-width="1"/>
  <line x1="160" y1="244" x2="150" y2="254" stroke="#9ca3af" stroke-width="1"/>
  <line x1="185" y1="244" x2="175" y2="254" stroke="#9ca3af" stroke-width="1"/>
  <line x1="210" y1="244" x2="200" y2="254" stroke="#9ca3af" stroke-width="1"/>
  <line x1="235" y1="244" x2="225" y2="254" stroke="#9ca3af" stroke-width="1"/>
  <line x1="260" y1="244" x2="250" y2="254" stroke="#9ca3af" stroke-width="1"/>
  <line x1="285" y1="244" x2="275" y2="254" stroke="#9ca3af" stroke-width="1"/>

  <!-- Feather in air (slow fall — small arrow) -->
  <!-- Feather shape (stylized) at x=110, y=75 -->
  <ellipse cx="110" cy="80" rx="8" ry="18" fill="#fcd34d" stroke="#d97706" stroke-width="1.5" transform="rotate(-20, 110, 80)"/>
  <line x1="110" y1="70" x2="110" y2="100" stroke="#92400e" stroke-width="1"/>
  <text x="110" y="68" font-family="Arial,sans-serif" font-size="9" fill="#92400e" text-anchor="middle">pena</text>
  <!-- Small arrow (slow) -->
  <defs>
    <marker id="aD" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#dc2626"/>
    </marker>
    <marker id="aD2" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#dc2626"/>
    </marker>
  </defs>
  <line x1="110" y1="106" x2="110" y2="128" stroke="#dc2626" stroke-width="2" marker-end="url(#aD)"/>
  <text x="120" y="120" font-family="Arial,sans-serif" font-size="9" fill="#dc2626">v (lenta)</text>

  <!-- Stone in air (fast fall — large arrow) -->
  <circle cx="210" cy="82" r="14" fill="#64748b" stroke="#374151" stroke-width="1.5"/>
  <text x="210" y="87" font-family="Arial,sans-serif" font-size="9" fill="#fff" text-anchor="middle" font-weight="bold">pedra</text>
  <!-- Large arrow (fast) -->
  <line x1="210" y1="100" x2="210" y2="155" stroke="#dc2626" stroke-width="2.5" marker-end="url(#aD2)"/>
  <text x="220" y="130" font-family="Arial,sans-serif" font-size="9" fill="#dc2626">v (rápida)</text>

  <!-- "Chegam em tempos diferentes" label -->
  <rect x="45" y="200" width="235" height="36" fill="#fee2e2" rx="5" stroke="#fca5a5" stroke-width="1"/>
  <text x="162" y="215" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold">Chegam em momentos</text>
  <text x="162" y="230" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold">diferentes ao solo</text>

  <!-- ====== RIGHT: In vacuum (same speed) ====== -->
  <text x="480" y="45" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">No vácuo</text>

  <!-- Vacuum container -->
  <rect x="340" y="53" width="270" height="190" fill="#f0fdf4" rx="6" opacity="0.8" stroke="#86efac" stroke-width="1"/>
  <text x="592" y="70" font-family="Arial,sans-serif" font-size="11" fill="#16a34a" text-anchor="end" font-style="italic">sem resistência</text>

  <!-- Ground line (right) -->
  <line x1="340" y1="244" x2="608" y2="244" stroke="#6b7280" stroke-width="2"/>
  <line x1="345" y1="244" x2="335" y2="254" stroke="#9ca3af" stroke-width="1"/>
  <line x1="370" y1="244" x2="360" y2="254" stroke="#9ca3af" stroke-width="1"/>
  <line x1="395" y1="244" x2="385" y2="254" stroke="#9ca3af" stroke-width="1"/>
  <line x1="420" y1="244" x2="410" y2="254" stroke="#9ca3af" stroke-width="1"/>
  <line x1="445" y1="244" x2="435" y2="254" stroke="#9ca3af" stroke-width="1"/>
  <line x1="470" y1="244" x2="460" y2="254" stroke="#9ca3af" stroke-width="1"/>
  <line x1="495" y1="244" x2="485" y2="254" stroke="#9ca3af" stroke-width="1"/>
  <line x1="520" y1="244" x2="510" y2="254" stroke="#9ca3af" stroke-width="1"/>
  <line x1="545" y1="244" x2="535" y2="254" stroke="#9ca3af" stroke-width="1"/>
  <line x1="570" y1="244" x2="560" y2="254" stroke="#9ca3af" stroke-width="1"/>
  <line x1="595" y1="244" x2="585" y2="254" stroke="#9ca3af" stroke-width="1"/>

  <!-- Defs for vacuum arrows -->
  <defs>
    <marker id="aE" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#2f5bea"/>
    </marker>
  </defs>

  <!-- Feather in vacuum (same arrow as stone) -->
  <ellipse cx="420" cy="80" rx="8" ry="18" fill="#fcd34d" stroke="#d97706" stroke-width="1.5" transform="rotate(-20, 420, 80)"/>
  <line x1="420" y1="70" x2="420" y2="100" stroke="#92400e" stroke-width="1"/>
  <text x="420" y="68" font-family="Arial,sans-serif" font-size="9" fill="#92400e" text-anchor="middle">pena</text>
  <!-- Equal arrow -->
  <line x1="420" y1="106" x2="420" y2="155" stroke="#2f5bea" stroke-width="2.5" marker-end="url(#aE)"/>

  <!-- Stone in vacuum (same arrow) -->
  <circle cx="540" cy="82" r="14" fill="#64748b" stroke="#374151" stroke-width="1.5"/>
  <text x="540" y="87" font-family="Arial,sans-serif" font-size="9" fill="#fff" text-anchor="middle" font-weight="bold">pedra</text>
  <!-- Equal arrow -->
  <line x1="540" y1="100" x2="540" y2="149" stroke="#2f5bea" stroke-width="2.5" marker-end="url(#aE)"/>

  <!-- "=" sign between arrows -->
  <text x="480" y="135" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#16a34a" text-anchor="middle">=</text>

  <!-- "Chegam juntas!" label -->
  <rect x="355" y="200" width="240" height="36" fill="#dcfce7" rx="5" stroke="#86efac" stroke-width="1"/>
  <text x="475" y="215" font-family="Arial,sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="bold">Chegam juntas ao solo</text>
  <text x="475" y="230" font-family="Arial,sans-serif" font-size="10" fill="#166534" text-anchor="middle">a = g ≈ 9,8 m/s² para todos</text>

  <!-- Bottom formula -->
  <rect x="160" y="258" width="320" height="18" fill="#f1f5f9" rx="4"/>
  <text x="320" y="271" font-family="Arial,sans-serif" font-size="10" fill="#475569" text-anchor="middle">Queda livre: y = ½gt²   |   v = gt   |   g ≈ 9,8 m/s²</text>
</svg>
