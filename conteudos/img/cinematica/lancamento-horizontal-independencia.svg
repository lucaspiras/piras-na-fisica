<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <rect width="640" height="300" fill="#f9fafb" rx="10"/>

  <!-- Title -->
  <text x="320" y="22" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Independência dos Movimentos Horizontal e Vertical</text>

  <!-- Divider -->
  <line x1="320" y1="35" x2="320" y2="280" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ===== LEFT: Ball dropped from rest ===== -->
  <text x="160" y="42" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Bola em queda livre</text>
  <text x="160" y="54" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">(largada do repouso)</text>

  <!-- Drop point -->
  <circle cx="160" cy="70" r="8" fill="#64748b" stroke="#374151" stroke-width="2"/>
  <text x="175" y="73" font-family="Arial,sans-serif" font-size="10" fill="#374151">v₀ = 0</text>

  <!-- Arrow defs -->
  <defs>
    <marker id="aDrop" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#64748b"/>
    </marker>
    <marker id="aLaunch" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#2f5bea"/>
    </marker>
    <marker id="aVert" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#dc2626"/>
    </marker>
    <marker id="aVert2" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Time instants for dropped ball (vertical only) -->
  <!-- t1: y=105, t2: y=152, t3: y=211, t4 (ground): y=270 -->
  <!-- Vertical spacing increases (quadratic) -->

  <!-- t=0 (top) — already shown -->

  <!-- t=1 -->
  <circle cx="160" cy="107" r="8" fill="#94a3b8" stroke="#64748b" stroke-width="1.5" opacity="0.85"/>
  <line x1="160" y1="116" x2="160" y2="132" stroke="#dc2626" stroke-width="2" marker-end="url(#aVert)"/>

  <!-- t=2 -->
  <circle cx="160" cy="155" r="8" fill="#94a3b8" stroke="#64748b" stroke-width="1.5" opacity="0.85"/>
  <line x1="160" y1="164" x2="160" y2="188" stroke="#dc2626" stroke-width="2.5" marker-end="url(#aVert)"/>

  <!-- t=3 -->
  <circle cx="160" cy="215" r="8" fill="#94a3b8" stroke="#64748b" stroke-width="1.5" opacity="0.85"/>
  <line x1="160" y1="224" x2="160" y2="256" stroke="#dc2626" stroke-width="3" marker-end="url(#aVert)"/>

  <!-- Ground (left) -->
  <line x1="30" y1="272" x2="295" y2="272" stroke="#374151" stroke-width="2"/>
  <line x1="35"  y1="272" x2="27"  y2="282" stroke="#9ca3af" stroke-width="1"/>
  <line x1="60"  y1="272" x2="52"  y2="282" stroke="#9ca3af" stroke-width="1"/>
  <line x1="85"  y1="272" x2="77"  y2="282" stroke="#9ca3af" stroke-width="1"/>
  <line x1="110" y1="272" x2="102" y2="282" stroke="#9ca3af" stroke-width="1"/>
  <line x1="135" y1="272" x2="127" y2="282" stroke="#9ca3af" stroke-width="1"/>
  <line x1="160" y1="272" x2="152" y2="282" stroke="#9ca3af" stroke-width="1"/>
  <line x1="185" y1="272" x2="177" y2="282" stroke="#9ca3af" stroke-width="1"/>
  <line x1="210" y1="272" x2="202" y2="282" stroke="#9ca3af" stroke-width="1"/>
  <line x1="235" y1="272" x2="227" y2="282" stroke="#9ca3af" stroke-width="1"/>
  <line x1="260" y1="272" x2="252" y2="282" stroke="#9ca3af" stroke-width="1"/>
  <line x1="285" y1="272" x2="277" y2="282" stroke="#9ca3af" stroke-width="1"/>

  <!-- Ball on ground (left) -->
  <circle cx="160" cy="265" r="8" fill="#374151" stroke="#1f2937" stroke-width="2"/>

  <!-- Time labels (left) -->
  <text x="88" y="73"  font-family="Arial,sans-serif" font-size="10" fill="#475569" text-anchor="end">t = 0</text>
  <text x="88" y="110" font-family="Arial,sans-serif" font-size="10" fill="#475569" text-anchor="end">t = 1</text>
  <text x="88" y="158" font-family="Arial,sans-serif" font-size="10" fill="#475569" text-anchor="end">t = 2</text>
  <text x="88" y="218" font-family="Arial,sans-serif" font-size="10" fill="#475569" text-anchor="end">t = 3</text>
  <text x="88" y="267" font-family="Arial,sans-serif" font-size="10" fill="#475569" text-anchor="end" font-weight="bold">t = 4</text>
  <!-- Dashed horizontal lines for time reference -->
  <line x1="90" y1="70"  x2="295" y2="70"  stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="90" y1="107" x2="295" y2="107" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="90" y1="155" x2="295" y2="155" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="90" y1="215" x2="295" y2="215" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ===== RIGHT: Ball launched horizontally ===== -->
  <text x="480" y="42" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Lançamento horizontal</text>
  <text x="480" y="54" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">(v₀ horizontal)</text>

  <!-- Launch point -->
  <circle cx="340" cy="70" r="8" fill="#2f5bea" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="348" y1="70" x2="383" y2="70" stroke="#2f5bea" stroke-width="2.5" marker-end="url(#aLaunch)"/>
  <text x="365" y="63" font-family="Arial,sans-serif" font-size="10" fill="#2f5bea" text-anchor="middle" font-weight="bold">v₀ →</text>

  <!-- Positions at same times — same vertical heights as left panel! -->
  <!-- Ball at t=1: x=380, y=107 -->
  <circle cx="395" cy="107" r="8" fill="#60a5fa" stroke="#2563eb" stroke-width="1.5" opacity="0.85"/>
  <!-- Blue horizontal arrow + red vertical arrow -->
  <line x1="403" y1="107" x2="428" y2="107" stroke="#2f5bea" stroke-width="2"/>
  <line x1="395" y1="116" x2="395" y2="132" stroke="#dc2626" stroke-width="2" marker-end="url(#aVert2)"/>

  <!-- Ball at t=2: x=450, y=155 -->
  <circle cx="465" cy="155" r="8" fill="#60a5fa" stroke="#2563eb" stroke-width="1.5" opacity="0.85"/>
  <line x1="473" y1="155" x2="498" y2="155" stroke="#2f5bea" stroke-width="2"/>
  <line x1="465" y1="164" x2="465" y2="188" stroke="#dc2626" stroke-width="2.5" marker-end="url(#aVert2)"/>

  <!-- Ball at t=3: x=520, y=215 -->
  <circle cx="535" cy="215" r="8" fill="#60a5fa" stroke="#2563eb" stroke-width="1.5" opacity="0.85"/>
  <line x1="543" y1="215" x2="568" y2="215" stroke="#2f5bea" stroke-width="2"/>
  <line x1="535" y1="224" x2="535" y2="256" stroke="#dc2626" stroke-width="3" marker-end="url(#aVert2)"/>

  <!-- Ball at landing: x=600, y=265 -->
  <circle cx="600" cy="265" r="8" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="2"/>

  <!-- Parabolic path (dashed) -->
  <path d="M 340,70 Q 470,155 600,265" fill="none" stroke="#2f5bea" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.7"/>

  <!-- Ground (right) -->
  <line x1="325" y1="272" x2="622" y2="272" stroke="#374151" stroke-width="2"/>
  <line x1="330"  y1="272" x2="322"  y2="282" stroke="#9ca3af" stroke-width="1"/>
  <line x1="355"  y1="272" x2="347"  y2="282" stroke="#9ca3af" stroke-width="1"/>
  <line x1="380"  y1="272" x2="372"  y2="282" stroke="#9ca3af" stroke-width="1"/>
  <line x1="405"  y1="272" x2="397"  y2="282" stroke="#9ca3af" stroke-width="1"/>
  <line x1="430"  y1="272" x2="422"  y2="282" stroke="#9ca3af" stroke-width="1"/>
  <line x1="455"  y1="272" x2="447"  y2="282" stroke="#9ca3af" stroke-width="1"/>
  <line x1="480"  y1="272" x2="472"  y2="282" stroke="#9ca3af" stroke-width="1"/>
  <line x1="505"  y1="272" x2="497"  y2="282" stroke="#9ca3af" stroke-width="1"/>
  <line x1="530"  y1="272" x2="522"  y2="282" stroke="#9ca3af" stroke-width="1"/>
  <line x1="555"  y1="272" x2="547"  y2="282" stroke="#9ca3af" stroke-width="1"/>
  <line x1="580"  y1="272" x2="572"  y2="282" stroke="#9ca3af" stroke-width="1"/>
  <line x1="605"  y1="272" x2="597"  y2="282" stroke="#9ca3af" stroke-width="1"/>

  <!-- KEY OBSERVATION: same height at each time -->
  <text x="320" y="292" font-family="Arial,sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="bold">Ambas as bolas atingem o mesmo nível vertical para cada instante t — o movimento vertical é independente do horizontal</text>
</svg>
