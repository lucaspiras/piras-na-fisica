<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" height="310">
  <rect width="640" height="310" fill="#f9fafb" rx="10"/>

  <!-- Title -->
  <text x="320" y="22" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Gráficos do MRUV (a &gt; 0, v₀ &gt; 0)</text>

  <!-- Axes arrows -->
  <defs>
    <marker id="axD" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0,8 2.5,0 5" fill="#475569"/>
    </marker>
  </defs>

  <!-- ====== PANEL 1: S×t (parabola) — x: 35–230, y: 45–255 ====== -->
  <text x="132" y="40" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">S × t</text>
  <text x="132" y="54" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">(parábola)</text>
  <!-- Grid -->
  <rect x="35" y="63" width="195" height="192" fill="#fff" stroke="#e2e8f0" stroke-width="1" rx="3"/>
  <!-- Axes -->
  <line x1="55" y1="255" x2="55"  y2="58" stroke="#475569" stroke-width="1.8" marker-end="url(#axD)"/>
  <line x1="55" y1="240" x2="233" y2="240" stroke="#475569" stroke-width="1.8" marker-end="url(#axD)"/>
  <!-- Axis labels -->
  <text x="238" y="244" font-family="Arial,sans-serif" font-size="11" fill="#475569">t</text>
  <text x="42"  y="57"  font-family="Arial,sans-serif" font-size="11" fill="#475569">s</text>
  <!-- Parabola: s = v₀t + ½at² with v₀>0 a>0
       Using polyline from (55,240) to (230,70) through control points
       t: 0→8 map to x: 55→230  (scale 21.875 px/s)
       s: 0→64 map to y: 240→70 (scale 170/64=2.656 px/m)
       s=v₀t+½at² with v₀=4, a=2:
       t=0: s=0 → (55, 240)
       t=1: s=5 → (76.9, 226.7)
       t=2: s=12 → (98.8, 208.1)
       t=3: s=21 → (120.6, 184.2)
       t=4: s=32 → (142.5, 155)
       t=5: s=45 → (164.4, 120.4)
       t=6: s=60 → (186.3, 80.6)
       t=7: s=77 exceeds → cap t=6 -->
  <polyline points="55,240 77,227 99,208 121,184 143,155 164,121 186,81"
            fill="none" stroke="#2f5bea" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Curvature label -->
  <text x="165" y="100" font-family="Arial,sans-serif" font-size="9" fill="#2f5bea" text-anchor="middle" font-style="italic">cresce</text>
  <text x="165" y="110" font-family="Arial,sans-serif" font-size="9" fill="#2f5bea" text-anchor="middle" font-style="italic">acelerando</text>

  <!-- ====== PANEL 2: v×t (reta) — x: 230–430, y: 45–255 ====== -->
  <text x="335" y="40" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">v × t</text>
  <text x="335" y="54" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">(reta inclinada)</text>
  <!-- Grid -->
  <rect x="235" y="63" width="195" height="192" fill="#fff" stroke="#e2e8f0" stroke-width="1" rx="3"/>
  <!-- Axes -->
  <line x1="255" y1="255" x2="255" y2="58" stroke="#475569" stroke-width="1.8" marker-end="url(#axD)"/>
  <line x1="255" y1="240" x2="433" y2="240" stroke="#475569" stroke-width="1.8" marker-end="url(#axD)"/>
  <!-- Axis labels -->
  <text x="438" y="244" font-family="Arial,sans-serif" font-size="11" fill="#475569">t</text>
  <text x="242" y="57"  font-family="Arial,sans-serif" font-size="11" fill="#475569">v</text>
  <!-- v=0 line (dashed) -->
  <line x1="255" y1="240" x2="430" y2="240" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Line v = v₀ + at (v₀=4, a=2):
       t: 0→6 → x: 255→430 (scale 29.17 px/s)
       v: 4→16 → y: 240→70 (scale 170/16=10.625 px/(m/s))
       v₀=4: y=240-4*10.625=240-42.5=197.5≈198
       v(6)=16: y=240-16*10.625=240-170=70 -->
  <line x1="255" y1="198" x2="430" y2="70" stroke="#16a34a" stroke-width="2.5"/>
  <!-- v₀ label on y-axis -->
  <line x1="250" y1="198" x2="260" y2="198" stroke="#64748b" stroke-width="1.5"/>
  <text x="244" y="202" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="end">v₀</text>
  <!-- slope label -->
  <text x="380" y="115" font-family="Arial,sans-serif" font-size="9" fill="#16a34a" text-anchor="middle" font-style="italic">inclinação = a</text>
  <!-- Shaded area = displacement -->
  <polygon points="255,198 255,240 430,240 430,70" fill="#bbf7d0" opacity="0.4"/>
  <text x="355" y="215" font-family="Arial,sans-serif" font-size="9" fill="#166534" text-anchor="middle">área = Δs</text>

  <!-- ====== PANEL 3: a×t (reta horizontal) — x: 430–620, y: 45–255 ====== -->
  <text x="530" y="40" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">a × t</text>
  <text x="530" y="54" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">(constante)</text>
  <!-- Grid -->
  <rect x="435" y="63" width="190" height="192" fill="#fff" stroke="#e2e8f0" stroke-width="1" rx="3"/>
  <!-- Axes -->
  <line x1="455" y1="255" x2="455" y2="58" stroke="#475569" stroke-width="1.8" marker-end="url(#axD)"/>
  <line x1="455" y1="195" x2="628" y2="195" stroke="#475569" stroke-width="1.8" marker-end="url(#axD)"/>
  <!-- Axis labels -->
  <text x="630" y="199" font-family="Arial,sans-serif" font-size="11" fill="#475569">t</text>
  <text x="442" y="57"  font-family="Arial,sans-serif" font-size="11" fill="#475569">a</text>
  <!-- Zero line -->
  <text x="444" y="199" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="end">0</text>
  <!-- Horizontal line at a=constant (y=130) -->
  <!-- a > 0, shown above x-axis at y=130 -->
  <line x1="455" y1="130" x2="625" y2="130" stroke="#dc2626" stroke-width="2.5"/>
  <!-- a label -->
  <line x1="450" y1="130" x2="460" y2="130" stroke="#64748b" stroke-width="1.5"/>
  <text x="444" y="134" font-family="Arial,sans-serif" font-size="10" fill="#dc2626" text-anchor="end" font-weight="bold">a</text>
  <!-- "constante" label -->
  <text x="545" y="118" font-family="Arial,sans-serif" font-size="9" fill="#dc2626" text-anchor="middle" font-style="italic">a = constante</text>
  <!-- Shading area under the horizontal line -->
  <rect x="455" y="130" width="170" height="65" fill="#fee2e2" opacity="0.4"/>

  <!-- Summary at bottom -->
  <rect x="35" y="268" width="570" height="36" fill="#f1f5f9" rx="5" stroke="#e2e8f0" stroke-width="1"/>
  <text x="320" y="281" font-family="Arial,sans-serif" font-size="10" fill="#475569" text-anchor="middle">s = s₀ + v₀t + ½at²   |   v = v₀ + at   |   v² = v₀² + 2aΔs</text>
  <text x="320" y="296" font-family="Arial,sans-serif" font-size="10" fill="#475569" text-anchor="middle">s×t: parábola  •  v×t: reta (inclinação = a)  •  a×t: reta horizontal (a constante)</text>
</svg>
