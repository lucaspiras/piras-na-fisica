<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280">
  <rect width="640" height="280" fill="#f9fafb" rx="10"/>

  <!-- Title -->
  <text x="320" y="22" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Decomposição da Velocidade Inicial (Lançamento Oblíquo)</text>

  <!-- Arrow defs -->
  <defs>
    <marker id="aV0" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#16a34a"/>
    </marker>
    <marker id="aVx" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2f5bea"/>
    </marker>
    <marker id="aVy" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Origin point -->
  <circle cx="160" cy="215" r="5" fill="#374151"/>

  <!-- Ground line -->
  <line x1="80" y1="215" x2="480" y2="215" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Hatch -->
  <line x1="85"  y1="215" x2="77"  y2="225" stroke="#d1d5db" stroke-width="1"/>
  <line x1="110" y1="215" x2="102" y2="225" stroke="#d1d5db" stroke-width="1"/>
  <line x1="135" y1="215" x2="127" y2="225" stroke="#d1d5db" stroke-width="1"/>
  <line x1="160" y1="215" x2="152" y2="225" stroke="#d1d5db" stroke-width="1"/>
  <line x1="185" y1="215" x2="177" y2="225" stroke="#d1d5db" stroke-width="1"/>
  <line x1="210" y1="215" x2="202" y2="225" stroke="#d1d5db" stroke-width="1"/>
  <line x1="235" y1="215" x2="227" y2="225" stroke="#d1d5db" stroke-width="1"/>
  <line x1="260" y1="215" x2="252" y2="225" stroke="#d1d5db" stroke-width="1"/>
  <line x1="285" y1="215" x2="277" y2="225" stroke="#d1d5db" stroke-width="1"/>
  <line x1="310" y1="215" x2="302" y2="225" stroke="#d1d5db" stroke-width="1"/>
  <line x1="335" y1="215" x2="327" y2="225" stroke="#d1d5db" stroke-width="1"/>
  <line x1="360" y1="215" x2="352" y2="225" stroke="#d1d5db" stroke-width="1"/>
  <line x1="385" y1="215" x2="377" y2="225" stroke="#d1d5db" stroke-width="1"/>
  <line x1="410" y1="215" x2="402" y2="225" stroke="#d1d5db" stroke-width="1"/>
  <line x1="435" y1="215" x2="427" y2="225" stroke="#d1d5db" stroke-width="1"/>
  <line x1="460" y1="215" x2="452" y2="225" stroke="#d1d5db" stroke-width="1"/>

  <!-- θ = 40° illustration -->
  <!-- cos40° ≈ 0.766, sin40° ≈ 0.643 -->
  <!-- v₀ length = 200px -->
  <!-- v₀ endpoint: (160+200*0.766, 215-200*0.643) = (160+153, 215-129) = (313, 86) -->

  <!-- Horizontal component vₓ: from (160, 215) to (313, 215) -->
  <line x1="160" y1="215" x2="312" y2="215" stroke="#2f5bea" stroke-width="3" marker-end="url(#aVx)"/>

  <!-- Vertical component vᵧ: from (313, 215) to (313, 87) -->
  <line x1="313" y1="215" x2="313" y2="88" stroke="#dc2626" stroke-width="3" marker-end="url(#aVy)"/>

  <!-- Dashed projection lines -->
  <line x1="160" y1="87" x2="313" y2="87" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="313" y1="87" x2="313" y2="215" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- v₀ main vector: from (160, 215) to (313, 87) -->
  <line x1="160" y1="215" x2="308" y2="89" stroke="#16a34a" stroke-width="3.5" marker-end="url(#aV0)"/>

  <!-- Right angle marker at (313, 215) -->
  <rect x="303" y="205" width="10" height="10" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Angle arc (θ) -->
  <path d="M 210,215 A 50,50 0 0,0 198,175" fill="none" stroke="#374151" stroke-width="1.5"/>
  <text x="222" y="198" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#374151">θ</text>

  <!-- Labels -->
  <!-- v₀ label (on the diagonal) -->
  <text x="225" y="140" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#16a34a" transform="rotate(-40, 225, 140)">v₀</text>

  <!-- vₓ label (below horizontal arrow) -->
  <text x="236" y="243" font-family="Arial,sans-serif" font-size="14" fill="#2f5bea" font-weight="bold" text-anchor="middle">vₓ = v₀ cos θ</text>

  <!-- vᵧ label (right of vertical arrow) -->
  <text x="340" y="158" font-family="Arial,sans-serif" font-size="14" fill="#dc2626" font-weight="bold">vᵧ = v₀ sen θ</text>

  <!-- Formula boxes on right side -->
  <rect x="440" y="60" width="185" height="180" fill="#fff" rx="8" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="532" y="82" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Equações do Movimento</text>
  <line x1="448" y1="88" x2="617" y2="88" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Horizontal movement -->
  <rect x="448" y="93" width="170" height="56" fill="#dbeafe" rx="4" opacity="0.6"/>
  <text x="533" y="107" font-family="Arial,sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="bold">Horizontal (MRU)</text>
  <text x="533" y="121" font-family="Arial,sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle">x = v₀ cos θ · t</text>
  <text x="533" y="136" font-family="Arial,sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle">vₓ = v₀ cos θ  (const.)</text>

  <!-- Vertical movement -->
  <rect x="448" y="154" width="170" height="56" fill="#fee2e2" rx="4" opacity="0.6"/>
  <text x="533" y="168" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold">Vertical (MRUV)</text>
  <text x="533" y="182" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">y = v₀ sen θ · t − ½gt²</text>
  <text x="533" y="197" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">vᵧ = v₀ sen θ − g·t</text>

  <!-- Pythagorean relation at bottom -->
  <text x="533" y="226" font-family="Arial,sans-serif" font-size="11" fill="#374151" text-anchor="middle">v₀² = vₓ² + vᵧ²</text>

  <!-- Vector magnitude label -->
  <rect x="100" y="38" width="310" height="20" fill="#f0fdf4" rx="4" stroke="#86efac" stroke-width="1"/>
  <text x="255" y="52" font-family="Arial,sans-serif" font-size="11" fill="#15803d" text-anchor="middle">|v₀| = velocidade escalar inicial (mesma em todas as direções)</text>
</svg>
