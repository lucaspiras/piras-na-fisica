<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 295" width="640" height="295">
  <rect width="640" height="295" fill="#f9fafb" rx="10"/>

  <!-- Title -->
  <text x="320" y="22" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Lançamento Horizontal de uma Elevação</text>

  <!-- Sky background -->
  <rect x="0" y="35" width="640" height="220" fill="#f0f9ff" rx="0" opacity="0.5"/>

  <!-- Ground -->
  <rect x="0" y="256" width="640" height="40" fill="#d1fae5"/>
  <line x1="0" y1="256" x2="640" y2="256" stroke="#16a34a" stroke-width="1.5"/>

  <!-- Cliff -->
  <rect x="0" y="100" width="130" height="156" fill="#d1d5db" stroke="#9ca3af" stroke-width="1"/>
  <rect x="0" y="95"  width="135" height="10"  fill="#9ca3af"/>

  <!-- Arrow defs -->
  <defs>
    <marker id="aHx" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0,8 2.5,0 5" fill="#2f5bea"/>
    </marker>
    <marker id="aHy" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0,8 2.5,0 5" fill="#dc2626"/>
    </marker>
    <marker id="aHv" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0,8 2.5,0 5" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Ball launch point -->
  <circle cx="135" cy="100" r="9" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <!-- Initial horizontal velocity -->
  <line x1="144" y1="100" x2="200" y2="100" stroke="#2f5bea" stroke-width="2.5" marker-end="url(#aHx)"/>
  <text x="172" y="90" font-family="Arial,sans-serif" font-size="11" fill="#2f5bea" font-weight="bold" text-anchor="middle">v₀ →</text>

  <!-- Parabolic trajectory (quadratic bezier) -->
  <path d="M 135,100 Q 390,130 580,256" fill="none" stroke="#f97316" stroke-width="2.5" stroke-dasharray="7,4"/>

  <!-- Ball at t1 (mid-flight) -->
  <!-- Approx at (310, 155) -->
  <circle cx="310" cy="158" r="7" fill="#f97316" stroke="#c2410c" stroke-width="1.5" opacity="0.85"/>
  <!-- Horizontal component -->
  <line x1="318" y1="158" x2="358" y2="158" stroke="#2f5bea" stroke-width="2" marker-end="url(#aHx)"/>
  <!-- Vertical component -->
  <line x1="310" y1="166" x2="310" y2="196" stroke="#dc2626" stroke-width="2" marker-end="url(#aHy)"/>
  <!-- Resultant velocity -->
  <line x1="318" y1="165" x2="358" y2="195" stroke="#16a34a" stroke-width="2" marker-end="url(#aHv)"/>

  <!-- Labels at t1 -->
  <text x="380" y="156" font-family="Arial,sans-serif" font-size="10" fill="#2f5bea">vₓ = v₀</text>
  <text x="324" y="192" font-family="Arial,sans-serif" font-size="10" fill="#dc2626">vᵧ = gt</text>

  <!-- Ball at landing -->
  <circle cx="580" cy="256" r="9" fill="#f97316" stroke="#c2410c" stroke-width="2"/>

  <!-- Dimension arrows -->
  <!-- Horizontal range (x) -->
  <line x1="135" y1="270" x2="580" y2="270" stroke="#475569" stroke-width="1.5"/>
  <line x1="135" y1="265" x2="135" y2="275" stroke="#475569" stroke-width="1.5"/>
  <line x1="580" y1="265" x2="580" y2="275" stroke="#475569" stroke-width="1.5"/>
  <text x="357" y="284" font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="bold">x = v₀ · t</text>

  <!-- Height (y) -->
  <line x1="612" y1="100" x2="612" y2="256" stroke="#475569" stroke-width="1.5"/>
  <line x1="607" y1="100" x2="617" y2="100" stroke="#475569" stroke-width="1.5"/>
  <line x1="607" y1="256" x2="617" y2="256" stroke="#475569" stroke-width="1.5"/>
  <text x="628" y="183" font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="middle">y</text>
  <text x="628" y="196" font-family="Arial,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">½gt²</text>

  <!-- Coordinate system -->
  <text x="148" y="85" font-family="Arial,sans-serif" font-size="10" fill="#64748b">lançamento</text>
  <!-- x axis reference -->
  <text x="35" y="115" font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="middle">H</text>
  <line x1="35" y1="100" x2="35" y2="254" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="29" y1="100" x2="41" y2="100" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="29" y1="254" x2="41" y2="254" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Equation boxes -->
  <rect x="0" y="38" width="130" height="52" fill="#f1f5f9" rx="4" opacity="0.9"/>
  <text x="65" y="53" font-family="Arial,sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="bold">Equações</text>
  <text x="65" y="67" font-family="Arial,sans-serif" font-size="10" fill="#2f5bea" text-anchor="middle">x = v₀ · t</text>
  <text x="65" y="80" font-family="Arial,sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">y = ½g · t²</text>
</svg>
