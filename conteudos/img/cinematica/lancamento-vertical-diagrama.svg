<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" height="310">
  <rect width="640" height="310" fill="#f9fafb" rx="10"/>

  <!-- Title -->
  <text x="320" y="22" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Lançamento Vertical para Cima</text>

  <!-- DIVIDER -->
  <line x1="330" y1="35" x2="330" y2="300" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ===== LEFT PANEL: Trajectory diagram ===== -->
  <text x="165" y="40" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Trajetória</text>

  <!-- Ground line -->
  <line x1="30" y1="270" x2="320" y2="270" stroke="#374151" stroke-width="2"/>
  <!-- Hatch -->
  <line x1="40"  y1="270" x2="32"  y2="280" stroke="#9ca3af" stroke-width="1"/>
  <line x1="65"  y1="270" x2="57"  y2="280" stroke="#9ca3af" stroke-width="1"/>
  <line x1="90"  y1="270" x2="82"  y2="280" stroke="#9ca3af" stroke-width="1"/>
  <line x1="115" y1="270" x2="107" y2="280" stroke="#9ca3af" stroke-width="1"/>
  <line x1="140" y1="270" x2="132" y2="280" stroke="#9ca3af" stroke-width="1"/>
  <line x1="165" y1="270" x2="157" y2="280" stroke="#9ca3af" stroke-width="1"/>
  <line x1="190" y1="270" x2="182" y2="280" stroke="#9ca3af" stroke-width="1"/>
  <line x1="215" y1="270" x2="207" y2="280" stroke="#9ca3af" stroke-width="1"/>
  <line x1="240" y1="270" x2="232" y2="280" stroke="#9ca3af" stroke-width="1"/>
  <line x1="265" y1="270" x2="257" y2="280" stroke="#9ca3af" stroke-width="1"/>
  <line x1="290" y1="270" x2="282" y2="280" stroke="#9ca3af" stroke-width="1"/>
  <line x1="315" y1="270" x2="307" y2="280" stroke="#9ca3af" stroke-width="1"/>

  <!-- Vertical trajectory path (dashed line) -->
  <line x1="165" y1="55" x2="165" y2="268" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="aUp" markerWidth="8" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <polygon points="0 5,4 0,8 5" fill="#2f5bea"/>
    </marker>
    <marker id="aDn" markerWidth="8" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <polygon points="0 0,4 5,8 0" fill="#dc2626"/>
    </marker>
    <marker id="aG" markerWidth="8" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <polygon points="0 0,4 5,8 0" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Ball at launch position (bottom) — big upward arrow v₀ -->
  <circle cx="165" cy="260" r="9" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <line x1="165" y1="250" x2="165" y2="205" stroke="#2f5bea" stroke-width="3" marker-end="url(#aUp)"/>
  <text x="180" y="232" font-family="Arial,sans-serif" font-size="11" fill="#2f5bea" font-weight="bold">v₀ ↑</text>

  <!-- Ball at mid-ascent — medium upward arrow -->
  <circle cx="165" cy="200" r="8" fill="#f97316" stroke="#c2410c" stroke-width="1.5" opacity="0.85"/>
  <line x1="165" y1="191" x2="165" y2="163" stroke="#2f5bea" stroke-width="2.5" marker-end="url(#aUp)"/>
  <text x="180" y="180" font-family="Arial,sans-serif" font-size="10" fill="#2f5bea">v ↑</text>

  <!-- Ball at apex — v = 0 -->
  <circle cx="165" cy="58" r="9" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
  <text x="185" y="58" font-family="Arial,sans-serif" font-size="11" fill="#16a34a" font-weight="bold">v = 0</text>
  <text x="185" y="70" font-family="Arial,sans-serif" font-size="10" fill="#16a34a">(ponto mais alto)</text>

  <!-- Gravity acceleration arrow at apex -->
  <line x1="145" y1="62" x2="145" y2="90" stroke="#64748b" stroke-width="2" marker-end="url(#aG)"/>
  <text x="128" y="80" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="end">g ↓</text>

  <!-- Ball at mid-descent — medium downward arrow -->
  <circle cx="165" cy="135" r="8" fill="#f97316" stroke="#c2410c" stroke-width="1.5" opacity="0.85"/>
  <line x1="165" y1="144" x2="165" y2="172" stroke="#dc2626" stroke-width="2.5" marker-end="url(#aDn)"/>
  <text x="180" y="163" font-family="Arial,sans-serif" font-size="10" fill="#dc2626">v ↓</text>

  <!-- Height H label -->
  <line x1="50" y1="58"  x2="50" y2="262" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="44" y1="58"  x2="56" y2="58"  stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="44" y1="262" x2="56" y2="262" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="35" y="165" font-family="Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="middle">H</text>
  <text x="35" y="178" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">máx</text>

  <!-- ===== RIGHT PANEL: v×t graph ===== -->
  <text x="485" y="40" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Gráfico v × t</text>

  <!-- Graph area: x=345–620, y=55–270 -->
  <!-- t: 0–2T; v: from +v₀ to −v₀ -->
  <!-- Origin at (345, 162) — v=0 in the middle -->
  <!-- V=v₀ at t=0 (y=55); V=-v₀ at t=2T (y=270) -->

  <!-- Grid -->
  <rect x="345" y="55" width="275" height="215" fill="#fff" rx="3" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Axes -->
  <defs>
    <marker id="axE" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0,8 2.5,0 5" fill="#475569"/>
    </marker>
  </defs>
  <!-- Y axis -->
  <line x1="375" y1="270" x2="375" y2="50" stroke="#475569" stroke-width="1.8" marker-end="url(#axE)"/>
  <!-- X axis (v=0 line) at y=162 -->
  <line x1="375" y1="162" x2="623" y2="162" stroke="#475569" stroke-width="1.8" marker-end="url(#axE)"/>
  <!-- Axis labels -->
  <text x="630" y="165" font-family="Arial,sans-serif" font-size="11" fill="#475569">t</text>
  <text x="362" y="47"  font-family="Arial,sans-serif" font-size="11" fill="#475569">v</text>

  <!-- v=0 label -->
  <text x="364" y="165" font-family="Arial,sans-serif" font-size="10" fill="#475569" text-anchor="end">0</text>
  <!-- v₀ label at top -->
  <line x1="370" y1="75" x2="380" y2="75" stroke="#64748b" stroke-width="1.5"/>
  <text x="364" y="78" font-family="Arial,sans-serif" font-size="10" fill="#2f5bea" text-anchor="end">+v₀</text>
  <!-- -v₀ label at bottom -->
  <line x1="370" y1="250" x2="380" y2="250" stroke="#64748b" stroke-width="1.5"/>
  <text x="364" y="253" font-family="Arial,sans-serif" font-size="10" fill="#dc2626" text-anchor="end">−v₀</text>

  <!-- v×t line: starts at +v₀ (y=75 at x=375), passes through 0 at t=T, ends at -v₀ -->
  <!-- t=T is at x = 375 + (620-375)/2 = 375 + 122.5 = 498 (approx) -->
  <!-- Line from (375, 75) to (620, 250) — straight, negative slope (gravity) -->
  <line x1="375" y1="75" x2="620" y2="250" stroke="#2f5bea" stroke-width="2.5"/>

  <!-- t=T marking (where v=0, ball at apex) -->
  <circle cx="498" cy="162" r="5" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
  <line x1="498" y1="162" x2="498" y2="270" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="498" y="283" font-family="Arial,sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="bold">t = T</text>
  <text x="438" y="283" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">(subida)</text>
  <text x="562" y="283" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">(descida)</text>

  <!-- t=2T marking (ball returns) -->
  <text x="620" y="283" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">2T</text>

  <!-- Slope label = -g -->
  <text x="570" y="130" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-style="italic">inclinação = −g</text>

  <!-- Color bands -->
  <rect x="375" y="55"  width="123" height="107" fill="#dbeafe" opacity="0.3" rx="2"/>
  <rect x="498" y="162" width="122" height="88"  fill="#fee2e2" opacity="0.3" rx="2"/>

  <!-- Region labels -->
  <text x="437" y="115" font-family="Arial,sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle">v &gt; 0 (subindo)</text>
  <text x="559" y="210" font-family="Arial,sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">v &lt; 0 (descendo)</text>
</svg>
