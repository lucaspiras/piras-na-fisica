<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <rect width="640" height="300" fill="#f9fafb" rx="10"/>

  <!-- Title -->
  <text x="320" y="22" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Gráfico v×t — MRU (velocidade constante)</text>

  <!-- Graph area: left=75, right=560, top=40, bottom=255 -->
  <!-- Y range: 0 to 20 m/s; X range: 0 to 8s -->
  <!-- scale_y = 215/20 = 10.75 px/(m/s); scale_x = 485/8 = 60.625 px/s -->
  <!-- v=12 m/s: y = 255 - 12*10.75 = 255 - 129 = 126 -->

  <!-- Grid lines -->
  <line x1="75" y1="40"  x2="560" y2="40"  stroke="#e2e8f0" stroke-width="1"/>
  <line x1="75" y1="94"  x2="560" y2="94"  stroke="#e2e8f0" stroke-width="1"/>
  <line x1="75" y1="148" x2="560" y2="148" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="75" y1="202" x2="560" y2="202" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Vertical grids at t=2,4,6,8 -->
  <line x1="196" y1="40" x2="196" y2="255" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="317" y1="40" x2="317" y2="255" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="439" y1="40" x2="439" y2="255" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="560" y1="40" x2="560" y2="255" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Shaded area = displacement (from t=2 to t=6, v=12 m/s) -->
  <!-- x at t=2: 75+2*60.625=196.25≈196; x at t=6: 75+6*60.625=438.75≈439 -->
  <!-- v=12: y=126; v=0: y=255 -->
  <rect x="196" y="126" width="243" height="129" fill="#bfdbfe" opacity="0.6"/>
  <!-- Shading label -->
  <text x="317" y="200" font-family="Arial,sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle">Δs = v × Δt</text>
  <text x="317" y="215" font-family="Arial,sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle">= 12 × 4 = 48 m</text>
  <text x="317" y="232" font-family="Arial,sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-style="italic">(área = deslocamento)</text>

  <!-- Axes -->
  <defs>
    <marker id="axB" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,9 3,0 6" fill="#475569"/>
    </marker>
  </defs>
  <line x1="75" y1="255" x2="75"  y2="33" stroke="#475569" stroke-width="2" marker-end="url(#axB)"/>
  <line x1="75" y1="255" x2="568" y2="255" stroke="#475569" stroke-width="2" marker-end="url(#axB)"/>

  <!-- Y-axis labels -->
  <text x="64" y="44"  font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="end">20</text>
  <text x="64" y="98"  font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="end">15</text>
  <text x="64" y="152" font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="end">10</text>
  <text x="64" y="206" font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="end">5</text>
  <text x="64" y="259" font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="end">0</text>

  <!-- X-axis labels -->
  <text x="196" y="270" font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="middle">2</text>
  <text x="317" y="270" font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="middle">4</text>
  <text x="439" y="270" font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="middle">6</text>
  <text x="560" y="270" font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="middle">8</text>

  <!-- Axis labels -->
  <text x="580" y="259" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#475569">t (s)</text>
  <text x="62"  y="28"  font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#475569">v (m/s)</text>

  <!-- Horizontal line v=12 m/s (y=126) — blue -->
  <line x1="75" y1="126" x2="560" y2="126" stroke="#2f5bea" stroke-width="3"/>

  <!-- v=12 label on line -->
  <rect x="430" y="112" width="80" height="20" fill="#dbeafe" rx="4"/>
  <text x="470" y="126" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">v = 12 m/s</text>

  <!-- Bracket for t=2 to t=6 -->
  <line x1="196" y1="255" x2="196" y2="263" stroke="#64748b" stroke-width="1.5"/>
  <line x1="439" y1="255" x2="439" y2="263" stroke="#64748b" stroke-width="1.5"/>
  <line x1="196" y1="263" x2="439" y2="263" stroke="#64748b" stroke-width="1.5"/>
  <text x="317" y="278" font-family="Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Δt = 4 s</text>

  <!-- Note box -->
  <rect x="75" y="283" width="485" height="12" fill="#f1f5f9" rx="3"/>
  <text x="317" y="293" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">No MRU a velocidade é constante → gráfico v×t é uma reta horizontal → área abaixo = deslocamento</text>
</svg>
