<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270">
  <defs>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#16a34a"/>
    </marker>
    <marker id="ao" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#f97316"/>
    </marker>
  </defs>
  <rect width="640" height="270" fill="#f9fafb" rx="10"/>

  <!-- ===== LEFT PANEL: Situação Física ===== -->
  <text x="155" y="28" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Situação Física</text>

  <!-- Table top -->
  <rect x="40" y="162" width="250" height="18" fill="#92400e" rx="3"/>
  <!-- Table legs -->
  <rect x="55" y="180" width="18" height="65" fill="#78350f" rx="2"/>
  <rect x="257" y="180" width="18" height="65" fill="#78350f" rx="2"/>

  <!-- Book on table -->
  <rect x="95" y="112" width="140" height="50" fill="#dbeafe" stroke="#2f5bea" stroke-width="2" rx="4"/>
  <!-- Book lines (pages) -->
  <line x1="100" y1="120" x2="100" y2="155" stroke="#93c5fd" stroke-width="1"/>
  <line x1="108" y1="112" x2="108" y2="162" stroke="#93c5fd" stroke-width="1"/>
  <text x="165" y="143" font-family="Arial,sans-serif" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="bold">Livro</text>

  <!-- Small weight arrow down on book -->
  <text x="165" y="98" font-family="Arial,sans-serif" font-size="11" fill="#f97316" text-anchor="middle">↓ peso</text>

  <!-- ===== DIVIDER ===== -->
  <line x1="320" y1="40" x2="320" y2="245" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ===== RIGHT PANEL: Diagrama de Corpo Livre ===== -->
  <text x="480" y="28" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Diagrama de Corpo Livre</text>

  <!-- Block (abstract body) -->
  <rect x="400" y="120" width="110" height="60" fill="#dbeafe" stroke="#2f5bea" stroke-width="2" rx="4"/>
  <text x="455" y="156" font-family="Arial,sans-serif" font-size="12" fill="#1e40af" text-anchor="middle">livro</text>

  <!-- N arrow (up, green) — from top of block upward 80px -->
  <line x1="455" y1="120" x2="455" y2="42" stroke="#16a34a" stroke-width="2.8" marker-end="url(#ag)"/>
  <text x="475" y="80" font-family="Arial,sans-serif" font-size="14" fill="#16a34a" font-weight="bold">N</text>

  <!-- P arrow (down, orange) — from bottom of block downward 80px -->
  <line x1="455" y1="180" x2="455" y2="258" stroke="#f97316" stroke-width="2.8" marker-end="url(#ao)"/>
  <text x="472" y="228" font-family="Arial,sans-serif" font-size="14" fill="#f97316" font-weight="bold">P</text>

  <!-- Equal sign indicators (tick marks on arrows) -->
  <line x1="447" y1="100" x2="463" y2="100" stroke="#16a34a" stroke-width="2"/>
  <line x1="447" y1="96" x2="463" y2="96" stroke="#16a34a" stroke-width="2"/>
  <line x1="447" y1="200" x2="463" y2="200" stroke="#f97316" stroke-width="2"/>
  <line x1="447" y1="204" x2="463" y2="204" stroke="#f97316" stroke-width="2"/>

  <!-- Equilibrium note -->
  <rect x="335" y="237" width="280" height="24" fill="#dcfce7" rx="5" stroke="#bbf7d0" stroke-width="1"/>
  <text x="475" y="254" font-family="Arial,sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="bold">N = P → equilíbrio (a = 0)</text>
</svg>
