<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280">
  <defs>
    <marker id="ao" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#f97316"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#16a34a"/>
    </marker>
    <marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2f5bea"/>
    </marker>
  </defs>
  <rect width="640" height="280" fill="#f9fafb" rx="10"/>

  <text x="320" y="28" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Inércia — O Experimento da Toalha</text>

  <!-- ===== LEFT PANEL: Antes ===== -->
  <text x="155" y="56" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">Situação inicial</text>

  <!-- Table top -->
  <rect x="30" y="168" width="255" height="16" fill="#92400e" rx="3"/>
  <!-- Legs -->
  <rect x="45" y="184" width="15" height="55" fill="#78350f" rx="2"/>
  <rect x="255" y="184" width="15" height="55" fill="#78350f" rx="2"/>

  <!-- Tablecloth -->
  <rect x="30" y="130" width="255" height="38" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="2"/>
  <text x="158" y="155" font-family="Arial,sans-serif" font-size="10" fill="#92400e" text-anchor="middle">toalha</text>

  <!-- Plate (circle) on tablecloth -->
  <circle cx="115" cy="115" r="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="115" cy="115" r="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="115" y="148" font-family="Arial,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">prato</text>

  <!-- Cup on tablecloth -->
  <rect x="190" y="105" width="30" height="40" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5" rx="3"/>
  <rect x="188" y="105" width="34" height="6" fill="#93c5fd" rx="2"/>
  <text x="205" y="156" font-family="Arial,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">copo</text>

  <!-- Arrow indicating pull direction -->
  <line x1="280" y1="148" x2="305" y2="148" stroke="#dc2626" stroke-width="2" marker-end="url(#ao)"/>
  <text x="295" y="140" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">puxar</text>

  <!-- ===== DIVIDER ===== -->
  <line x1="320" y1="50" x2="320" y2="250" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ===== RIGHT PANEL: Depois ===== -->
  <text x="480" y="56" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">Toalha puxada rapidamente</text>

  <!-- Table top -->
  <rect x="345" y="168" width="255" height="16" fill="#92400e" rx="3"/>
  <!-- Legs -->
  <rect x="360" y="184" width="15" height="55" fill="#78350f" rx="2"/>
  <rect x="570" y="184" width="15" height="55" fill="#78350f" rx="2"/>

  <!-- Tablecloth being pulled out (dashed, partially out to right) -->
  <rect x="540" y="130" width="100" height="38" fill="#fef9c3" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,4" rx="2" opacity="0.7"/>
  <!-- Arrow showing tablecloth moving right fast -->
  <line x1="575" y1="149" x2="615" y2="149" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ao)"/>
  <text x="595" y="142" font-family="Arial,sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">rápido!</text>

  <!-- Plate (same position, stayed) -->
  <circle cx="430" cy="115" r="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="430" cy="115" r="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="430" y="148" font-family="Arial,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">prato</text>

  <!-- Cup (same position) -->
  <rect x="505" y="105" width="30" height="40" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5" rx="3"/>
  <rect x="503" y="105" width="34" height="6" fill="#93c5fd" rx="2"/>
  <text x="520" y="156" font-family="Arial,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">copo</text>

  <!-- "ficou!" arrows and labels -->
  <text x="430" y="96" font-family="Arial,sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="bold">✓ ficou!</text>
  <text x="520" y="96" font-family="Arial,sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="bold">✓ ficou!</text>

  <!-- Inertia note -->
  <rect x="330" y="230" width="295" height="34" fill="#dcfce7" rx="5" stroke="#bbf7d0" stroke-width="1"/>
  <text x="478" y="247" font-family="Arial,sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="bold">INÉRCIA: os objetos resistem</text>
  <text x="478" y="259" font-family="Arial,sans-serif" font-size="11" fill="#15803d" text-anchor="middle">à mudança de seu estado de repouso</text>
</svg>
