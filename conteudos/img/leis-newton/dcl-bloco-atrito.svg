<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280">
  <defs>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#16a34a"/>
    </marker>
    <marker id="ao" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#f97316"/>
    </marker>
    <marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2f5bea"/>
    </marker>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="640" height="280" fill="#f9fafb" rx="10"/>

  <text x="320" y="28" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Diagrama de Corpo Livre — Bloco com Atrito</text>

  <!-- Ground/surface line -->
  <line x1="50" y1="195" x2="590" y2="195" stroke="#475569" stroke-width="2.5"/>
  <!-- Hatch marks for ground -->
  <line x1="55" y1="195" x2="45" y2="210" stroke="#94a3b8" stroke-width="1"/>
  <line x1="75" y1="195" x2="65" y2="210" stroke="#94a3b8" stroke-width="1"/>
  <line x1="95" y1="195" x2="85" y2="210" stroke="#94a3b8" stroke-width="1"/>
  <line x1="115" y1="195" x2="105" y2="210" stroke="#94a3b8" stroke-width="1"/>
  <line x1="135" y1="195" x2="125" y2="210" stroke="#94a3b8" stroke-width="1"/>
  <line x1="155" y1="195" x2="145" y2="210" stroke="#94a3b8" stroke-width="1"/>
  <line x1="485" y1="195" x2="475" y2="210" stroke="#94a3b8" stroke-width="1"/>
  <line x1="505" y1="195" x2="495" y2="210" stroke="#94a3b8" stroke-width="1"/>
  <line x1="525" y1="195" x2="515" y2="210" stroke="#94a3b8" stroke-width="1"/>
  <line x1="545" y1="195" x2="535" y2="210" stroke="#94a3b8" stroke-width="1"/>
  <line x1="565" y1="195" x2="555" y2="210" stroke="#94a3b8" stroke-width="1"/>
  <line x1="585" y1="195" x2="575" y2="210" stroke="#94a3b8" stroke-width="1"/>

  <!-- Block -->
  <rect x="260" y="117" width="120" height="78" fill="#dbeafe" stroke="#2f5bea" stroke-width="2" rx="4"/>
  <text x="320" y="161" font-family="Arial,sans-serif" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="bold">bloco</text>

  <!-- P arrow (down, orange, 70px) — weight from bottom center -->
  <line x1="320" y1="195" x2="320" y2="263" stroke="#f97316" stroke-width="2.8" marker-end="url(#ao)"/>
  <text x="338" y="240" font-family="Arial,sans-serif" font-size="14" fill="#f97316" font-weight="bold">P</text>
  <text x="338" y="256" font-family="Arial,sans-serif" font-size="10" fill="#f97316">(peso)</text>

  <!-- N arrow (up, green, 70px) — normal from top center -->
  <line x1="320" y1="117" x2="320" y2="49" stroke="#16a34a" stroke-width="2.8" marker-end="url(#ag)"/>
  <text x="336" y="85" font-family="Arial,sans-serif" font-size="14" fill="#16a34a" font-weight="bold">N</text>
  <text x="336" y="101" font-family="Arial,sans-serif" font-size="10" fill="#16a34a">(normal)</text>

  <!-- Fa arrow (right, blue, 115px) — applied force from right face -->
  <line x1="380" y1="156" x2="493" y2="156" stroke="#2f5bea" stroke-width="2.8" marker-end="url(#ab)"/>
  <text x="445" y="147" font-family="Arial,sans-serif" font-size="13" fill="#2f5bea" text-anchor="middle" font-weight="bold">Fₐ</text>
  <text x="445" y="172" font-family="Arial,sans-serif" font-size="10" fill="#2f5bea" text-anchor="middle">(aplicada)</text>

  <!-- f arrow (left, red, 80px) — friction from left face -->
  <line x1="260" y1="156" x2="182" y2="156" stroke="#dc2626" stroke-width="2.8" marker-end="url(#ar)"/>
  <text x="217" y="147" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">f</text>
  <text x="217" y="172" font-family="Arial,sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">(atrito)</text>

  <!-- Note: Fnet = Fa - f -->
  <rect x="170" y="228" width="300" height="24" fill="#eff6ff" rx="5" stroke="#bfdbfe" stroke-width="1"/>
  <text x="320" y="245" font-family="Arial,sans-serif" font-size="12" fill="#1e40af" text-anchor="middle">F_resultante = Fₐ − f = m · a</text>
</svg>
