<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <rect width="640" height="300" fill="#f9fafb" rx="10"/>

  <text x="320" y="26" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Força de Atrito × Força Aplicada</text>

  <!-- Grid -->
  <!-- x from 80 to 580 (500px for 20N → 25px/N)
       y from 260 to 60 (200px for 14N → ~14.3px/N)
       f_e,max = 12N → x=380, y=260-171.4=88.6≈89
       f_c = 9N → y=260-128.6=131.4≈131 -->

  <line x1="80" y1="60" x2="580" y2="60" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="80" y1="89" x2="580" y2="89" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="80" y1="131" x2="580" y2="131" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="80" y1="185" x2="580" y2="185" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="80" y1="260" x2="580" y2="260" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="155" y1="55" x2="155" y2="265" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="255" y1="55" x2="255" y2="265" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="380" y1="55" x2="380" y2="265" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="455" y1="55" x2="455" y2="265" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="580" y1="55" x2="580" y2="265" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Background shading: static region -->
  <rect x="80" y="89" width="300" height="171" fill="#dbeafe" opacity="0.3"/>
  <!-- Kinetic region -->
  <rect x="380" y="131" width="200" height="129" fill="#fef3c7" opacity="0.4"/>

  <!-- Region labels -->
  <text x="220" y="255" font-family="Arial,sans-serif" font-size="12" fill="#3b82f6" text-anchor="middle" font-weight="bold">ATRITO ESTÁTICO</text>
  <text x="480" y="255" font-family="Arial,sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="bold">ATRITO CINÉTICO</text>

  <!-- Axes -->
  <line x1="80" y1="260" x2="592" y2="260" stroke="#475569" stroke-width="2"/>
  <line x1="80" y1="260" x2="80" y2="52" stroke="#475569" stroke-width="2"/>
  <!-- Arrow tips -->
  <polygon points="586,255 598,260 586,265" fill="#475569"/>
  <polygon points="75,56 80,44 85,56" fill="#475569"/>

  <!-- Axis labels -->
  <text x="340" y="285" font-family="Arial,sans-serif" font-size="13" fill="#475569" text-anchor="middle">Força Aplicada (N)</text>
  <text x="30" y="165" font-family="Arial,sans-serif" font-size="13" fill="#475569" text-anchor="middle" transform="rotate(-90,30,165)">Atrito (N)</text>

  <!-- X tick marks: 5, 12, 15, 20 N -->
  <line x1="205" y1="258" x2="205" y2="264" stroke="#475569" stroke-width="1.5"/>
  <text x="205" y="276" font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="middle">5</text>
  <line x1="380" y1="258" x2="380" y2="264" stroke="#475569" stroke-width="1.5"/>
  <text x="380" y="276" font-family="Arial,sans-serif" font-size="11" fill="#2f5bea" text-anchor="middle" font-weight="bold">12</text>
  <line x1="455" y1="258" x2="455" y2="264" stroke="#475569" stroke-width="1.5"/>
  <text x="455" y="276" font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="middle">15</text>
  <line x1="580" y1="258" x2="580" y2="264" stroke="#475569" stroke-width="1.5"/>
  <text x="580" y="276" font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="middle">20</text>
  <text x="80" y="276" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">0</text>

  <!-- Y tick marks: f_e,max = 12N (y=89), f_c = 9N (y=131) -->
  <line x1="78" y1="89" x2="84" y2="89" stroke="#475569" stroke-width="1.5"/>
  <text x="75" y="93" font-family="Arial,sans-serif" font-size="11" fill="#2f5bea" text-anchor="end" font-weight="bold">12</text>
  <line x1="78" y1="131" x2="84" y2="131" stroke="#475569" stroke-width="1.5"/>
  <text x="75" y="135" font-family="Arial,sans-serif" font-size="11" fill="#d97706" text-anchor="end" font-weight="bold">9</text>
  <line x1="78" y1="185" x2="84" y2="185" stroke="#475569" stroke-width="1.5"/>
  <text x="75" y="189" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">5</text>

  <!-- GRAPH:
       Static phase: diagonal from (80,260) to (380,89) [f_atrito = F_aplicada]
       Drop: vertical from (380,89) to (380,131)
       Kinetic: horizontal from (380,131) to (580,131) -->

  <!-- Static phase (blue line) -->
  <line x1="80" y1="260" x2="380" y2="89" stroke="#2f5bea" stroke-width="2.5"/>

  <!-- Vertical drop (dashed) -->
  <line x1="380" y1="89" x2="380" y2="131" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Kinetic phase (orange line) -->
  <line x1="380" y1="131" x2="580" y2="131" stroke="#d97706" stroke-width="2.5"/>

  <!-- Horizontal reference lines -->
  <line x1="80" y1="89" x2="380" y2="89" stroke="#2f5bea" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  <line x1="80" y1="131" x2="380" y2="131" stroke="#d97706" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- Labels on graph -->
  <text x="395" y="80" font-family="Arial,sans-serif" font-size="11" fill="#2f5bea" font-weight="bold">fₑ,máx = 12 N</text>
  <text x="395" y="126" font-family="Arial,sans-serif" font-size="11" fill="#d97706" font-weight="bold">fₓ = 9 N</text>

  <!-- Slope line label -->
  <text x="220" y="155" font-family="Arial,sans-serif" font-size="11" fill="#2f5bea">fₑ = F_ap</text>
  <text x="220" y="168" font-family="Arial,sans-serif" font-size="10" fill="#2f5bea">(inclinação 45°)</text>

  <!-- Note at bottom -->
  <text x="320" y="293" font-family="Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">fₑ,máx > fₓ → é mais fácil manter o movimento do que iniciá-lo</text>
</svg>
