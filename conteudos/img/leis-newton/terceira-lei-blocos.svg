<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270">
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2f5bea"/>
    </marker>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="640" height="270" fill="#f9fafb" rx="10"/>

  <text x="320" y="28" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Terceira Lei de Newton — Par Ação e Reação</text>

  <!-- Block A (blue) -->
  <rect x="90" y="105" width="130" height="80" fill="#dbeafe" stroke="#2f5bea" stroke-width="2.5" rx="5"/>
  <text x="155" y="148" font-family="Arial,sans-serif" font-size="20" fill="#1e40af" text-anchor="middle" font-weight="bold">A</text>
  <text x="155" y="167" font-family="Arial,sans-serif" font-size="11" fill="#3b82f6" text-anchor="middle">m₁ = 3 kg</text>

  <!-- Block B (orange) -->
  <rect x="420" y="105" width="130" height="80" fill="#fff7ed" stroke="#f97316" stroke-width="2.5" rx="5"/>
  <text x="485" y="148" font-family="Arial,sans-serif" font-size="20" fill="#c2410c" text-anchor="middle" font-weight="bold">B</text>
  <text x="485" y="167" font-family="Arial,sans-serif" font-size="11" fill="#f97316" text-anchor="middle">m₂ = 5 kg</text>

  <!-- Gap label -->
  <text x="320" y="152" font-family="Arial,sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">contato</text>

  <!-- F_AB arrow: from A to B (blue, right, at y=120) -->
  <line x1="220" y1="125" x2="418" y2="125" stroke="#2f5bea" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="320" y="118" font-family="Arial,sans-serif" font-size="12" fill="#2f5bea" text-anchor="middle" font-weight="bold">F₁₂ (A empurra B)</text>

  <!-- F_BA arrow: from B to A (red, left, at y=165) -->
  <line x1="420" y1="165" x2="222" y2="165" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="320" y="193" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold">F₂₁ (B empurra A)</text>

  <!-- Equal tick marks on arrows -->
  <line x1="316" y1="119" x2="316" y2="131" stroke="#2f5bea" stroke-width="2"/>
  <line x1="322" y1="119" x2="322" y2="131" stroke="#2f5bea" stroke-width="2"/>
  <line x1="316" y1="159" x2="316" y2="171" stroke="#dc2626" stroke-width="2"/>
  <line x1="322" y1="159" x2="322" y2="171" stroke="#dc2626" stroke-width="2"/>

  <!-- Key: same magnitude, opposite direction, different bodies -->
  <rect x="80" y="220" width="480" height="35" fill="#fef2f2" rx="8" stroke="#fecaca" stroke-width="1"/>
  <text x="320" y="236" font-family="Arial,sans-serif" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="bold">|F₁₂| = |F₂₁|  •  sentidos opostos  •  aplicadas em corpos DIFERENTES</text>
  <text x="320" y="250" font-family="Arial,sans-serif" font-size="11" fill="#991b1b" text-anchor="middle">Não se cancelam! Cada força age sobre um corpo distinto.</text>
</svg>
