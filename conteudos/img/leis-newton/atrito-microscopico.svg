<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280">
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2f5bea"/>
    </marker>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="640" height="280" fill="#f9fafb" rx="10"/>

  <text x="320" y="26" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Força de Atrito — Origem Microscópica</text>

  <!-- ===== LEFT PANEL: Microscopic view ===== -->
  <text x="155" y="52" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">Visão Microscópica</text>

  <!-- Magnifying glass circle -->
  <circle cx="155" cy="155" r="95" fill="white" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="155" cy="155" r="95" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,4"/>

  <!-- Upper jagged surface (block bottom) -->
  <polyline points="65,135 80,122 95,138 110,119 125,135 140,120 155,137 170,118 185,132 200,120 215,134 230,121 245,133"
    fill="none" stroke="#64748b" stroke-width="2.5"/>
  <!-- Fill the upper surface -->
  <polygon points="65,100 65,135 80,122 95,138 110,119 125,135 140,120 155,137 170,118 185,132 200,120 215,134 230,121 245,133 245,100"
    fill="#bfdbfe" opacity="0.7"/>

  <!-- Lower jagged surface (ground) -->
  <polyline points="65,163 80,178 95,162 110,177 125,161 140,177 155,163 170,178 185,165 200,179 215,164 230,180 245,165"
    fill="none" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Fill lower surface -->
  <polygon points="65,163 80,178 95,162 110,177 125,161 140,177 155,163 170,178 185,165 200,179 215,164 230,180 245,165 245,210 65,210"
    fill="#e2e8f0" opacity="0.7"/>

  <!-- Contact stress dots where peaks touch -->
  <circle cx="95" cy="138" r="3.5" fill="#f97316" opacity="0.9"/>
  <circle cx="125" cy="134" r="3.5" fill="#f97316" opacity="0.9"/>
  <circle cx="155" cy="137" r="3" fill="#f97316" opacity="0.9"/>
  <circle cx="185" cy="132" r="3.5" fill="#f97316" opacity="0.9"/>
  <circle cx="215" cy="134" r="3" fill="#f97316" opacity="0.9"/>

  <!-- Label -->
  <text x="155" y="228" font-family="Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">irregularidades em contato</text>
  <text x="155" y="240" font-family="Arial,sans-serif" font-size="10" fill="#f97316" text-anchor="middle">● pontos de adesão/interferência</text>

  <!-- ===== DIVIDER ===== -->
  <line x1="320" y1="45" x2="320" y2="265" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ===== RIGHT PANEL: Macro diagram ===== -->
  <text x="480" y="52" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">Diagrama Macroscópico</text>

  <!-- Ground -->
  <line x1="340" y1="200" x2="620" y2="200" stroke="#475569" stroke-width="2.5"/>
  <line x1="345" y1="200" x2="335" y2="214" stroke="#94a3b8" stroke-width="1"/>
  <line x1="365" y1="200" x2="355" y2="214" stroke="#94a3b8" stroke-width="1"/>
  <line x1="385" y1="200" x2="375" y2="214" stroke="#94a3b8" stroke-width="1"/>
  <line x1="555" y1="200" x2="545" y2="214" stroke="#94a3b8" stroke-width="1"/>
  <line x1="575" y1="200" x2="565" y2="214" stroke="#94a3b8" stroke-width="1"/>
  <line x1="595" y1="200" x2="585" y2="214" stroke="#94a3b8" stroke-width="1"/>
  <line x1="615" y1="200" x2="605" y2="214" stroke="#94a3b8" stroke-width="1"/>

  <!-- Block -->
  <rect x="400" y="130" width="140" height="70" fill="#dbeafe" stroke="#2f5bea" stroke-width="2" rx="4"/>
  <text x="470" y="170" font-family="Arial,sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="bold">bloco</text>

  <!-- Applied force → (blue, right) -->
  <line x1="540" y1="165" x2="608" y2="165" stroke="#2f5bea" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="578" y="158" font-family="Arial,sans-serif" font-size="12" fill="#2f5bea" font-weight="bold">Fₐ</text>

  <!-- Friction ← (red, left) -->
  <line x1="400" y1="165" x2="342" y2="165" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="364" y="158" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" font-weight="bold">f</text>

  <!-- Normal up -->
  <line x1="470" y1="130" x2="470" y2="82" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="462,83 470,68 478,83" fill="#16a34a"/>
  <text x="487" y="101" font-family="Arial,sans-serif" font-size="12" fill="#16a34a" font-weight="bold">N</text>

  <!-- Weight down -->
  <line x1="470" y1="200" x2="470" y2="244" stroke="#f97316" stroke-width="2.5"/>
  <polygon points="462,243 470,258 478,243" fill="#f97316"/>
  <text x="487" y="238" font-family="Arial,sans-serif" font-size="12" fill="#f97316" font-weight="bold">P</text>
</svg>
