<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" height="310">
  <defs>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#16a34a"/>
    </marker>
    <marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2f5bea"/>
    </marker>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#dc2626"/>
    </marker>
    <marker id="ao" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#f97316"/>
    </marker>
    <marker id="ax" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#475569"/>
    </marker>
  </defs>
  <rect width="640" height="310" fill="#f9fafb" rx="10"/>

  <text x="320" y="24" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Plano Inclinado — Decomposição de Forças</text>

  <!-- ===== INCLINED PLANE =====
       A=(100,260), B=(480,260), C=(100,40)
       θ at B = arctan(220/380) ≈ 30° -->

  <!-- Plane surface fill -->
  <polygon points="100,260 480,260 100,40" fill="#e2e8f0" stroke="none"/>
  <!-- Plane border -->
  <line x1="100" y1="40" x2="480" y2="260" stroke="#475569" stroke-width="2.5"/>
  <line x1="100" y1="260" x2="480" y2="260" stroke="#475569" stroke-width="2"/>
  <line x1="100" y1="40" x2="100" y2="260" stroke="#475569" stroke-width="2"/>

  <!-- Right angle at A -->
  <polyline points="100,245 115,245 115,260" fill="none" stroke="#64748b" stroke-width="1.5"/>

  <!-- θ angle arc at B(480,260) -->
  <!-- From horizontal-left to hypotenuse, 30° arc -->
  <path d="M 435,260 Q 437,248 441,238" fill="none" stroke="#475569" stroke-width="1.5"/>
  <text x="432" y="252" font-family="Arial,sans-serif" font-size="13" fill="#475569" font-weight="bold">θ</text>

  <!-- Surface texture lines -->
  <line x1="130" y1="260" x2="120" y2="274" stroke="#94a3b8" stroke-width="1"/>
  <line x1="160" y1="260" x2="150" y2="274" stroke="#94a3b8" stroke-width="1"/>
  <line x1="190" y1="260" x2="180" y2="274" stroke="#94a3b8" stroke-width="1"/>
  <line x1="220" y1="260" x2="210" y2="274" stroke="#94a3b8" stroke-width="1"/>
  <line x1="250" y1="260" x2="240" y2="274" stroke="#94a3b8" stroke-width="1"/>
  <line x1="280" y1="260" x2="270" y2="274" stroke="#94a3b8" stroke-width="1"/>
  <line x1="310" y1="260" x2="300" y2="274" stroke="#94a3b8" stroke-width="1"/>
  <line x1="340" y1="260" x2="330" y2="274" stroke="#94a3b8" stroke-width="1"/>
  <line x1="370" y1="260" x2="360" y2="274" stroke="#94a3b8" stroke-width="1"/>
  <line x1="400" y1="260" x2="390" y2="274" stroke="#94a3b8" stroke-width="1"/>
  <line x1="430" y1="260" x2="420" y2="274" stroke="#94a3b8" stroke-width="1"/>
  <line x1="460" y1="260" x2="450" y2="274" stroke="#94a3b8" stroke-width="1"/>

  <!-- ===== BLOCK on slope =====
       Center at 60% from C(100,40) to B(480,260):
       (100+0.6*380, 40+0.6*220) = (328, 172)
       Slope dir (down-slope): (0.866, 0.501)
       Normal outward: (0.501, -0.866) -->

  <!-- Block (rotated rectangle on slope) -->
  <!-- Block corners: center(328,172), half-size 30×22 -->
  <!-- Slope axis: ds=(0.866,0.501), dn=(0.501,-0.866) -->
  <!-- Corners: ±30 along slope, ±22 along normal -->
  <polygon points="
    302,171 350,173 354,149 306,147
  " fill="#dbeafe" stroke="#2f5bea" stroke-width="2" rx="0"/>
  <!-- Actually let me compute correctly:
    center = (328, 172)
    along slope: ds=(0.866,0.501), half=25px
    along normal: dn=(0.501,-0.866), half=15px
    BL = (328-25*0.866-15*0.501, 172-25*0.501+15*0.866) = (328-21.65-7.5, 172-12.5+13.0) = (299,173)
    BR = (328+25*0.866-15*0.501, 172+25*0.501+15*0.866) = (328+21.65-7.5, 172+12.5+13.0) = (342,198)
    TR = (328+25*0.866+15*0.501, 172+25*0.501-15*0.866) = (328+21.65+7.5, 172+12.5-13.0) = (357,172)
    TL = (328-25*0.866+15*0.501, 172-25*0.501-15*0.866) = (328-21.65+7.5, 172-12.5-13.0) = (314,147)
  -->
  <polygon points="299,173 342,198 357,172 314,147" fill="#dbeafe" stroke="#2f5bea" stroke-width="2"/>
  <text x="329" y="175" font-family="Arial,sans-serif" font-size="10" fill="#1e40af" text-anchor="middle">m</text>

  <!-- ===== FORCE VECTORS from block center (328, 172) ===== -->

  <!-- P (weight, green, straight down), length 95px -->
  <line x1="328" y1="172" x2="328" y2="265" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="344" y="230" font-family="Arial,sans-serif" font-size="13" fill="#16a34a" font-weight="bold">P</text>

  <!-- N (normal outward, red), dir=(0.501,-0.866), length 82px -->
  <!-- End: (328+0.501*82, 172-0.866*82) = (369, 101) -->
  <line x1="328" y1="172" x2="369" y2="101" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="382" y="115" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" font-weight="bold">N</text>

  <!-- Px (down-slope component of P, blue), dir=(0.866,0.501), length 48px -->
  <!-- End: (328+0.866*48, 172+0.501*48) = (370, 196) -->
  <line x1="328" y1="172" x2="370" y2="196" stroke="#2f5bea" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="358" y="212" font-family="Arial,sans-serif" font-size="11" fill="#2f5bea" font-weight="bold">Pₓ</text>
  <text x="358" y="224" font-family="Arial,sans-serif" font-size="10" fill="#2f5bea">= P·senθ</text>

  <!-- Py (perpendicular-into-surface component, orange), dir=(-0.501,0.866), length 82px -->
  <!-- End: (328-0.501*82, 172+0.866*82) = (287, 243) -->
  <line x1="328" y1="172" x2="287" y2="243" stroke="#f97316" stroke-width="2.5" marker-end="url(#ao)"/>
  <text x="270" y="242" font-family="Arial,sans-serif" font-size="11" fill="#f97316" font-weight="bold" text-anchor="end">Pᵧ</text>
  <text x="268" y="254" font-family="Arial,sans-serif" font-size="10" fill="#f97316" text-anchor="end">= P·cosθ</text>

  <!-- Dashed parallelogram lines -->
  <!-- From Px end (370,196) to P end (328,265) -->
  <line x1="370" y1="196" x2="328" y2="265" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- From Py end (287,243) to P end (328,265) -->
  <line x1="287" y1="243" x2="328" y2="265" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Coordinate axes x (down-slope) and y (outward normal) at block -->
  <!-- x-axis: (328,172) + 38*(0.866,0.501) = (361, 191) -->
  <line x1="328" y1="172" x2="361" y2="191" stroke="#475569" stroke-width="1.5" marker-end="url(#ax)"/>
  <text x="367" y="197" font-family="Arial,sans-serif" font-size="11" fill="#475569" font-weight="bold">x</text>
  <!-- y-axis: (328,172) + 38*(0.501,-0.866) = (347, 139) -->
  <line x1="328" y1="172" x2="347" y2="139" stroke="#475569" stroke-width="1.5" marker-end="url(#ax)"/>
  <text x="352" y="133" font-family="Arial,sans-serif" font-size="11" fill="#475569" font-weight="bold">y</text>

  <!-- ===== LEGEND (right side) ===== -->
  <rect x="495" y="55" width="135" height="190" fill="white" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>
  <text x="562" y="74" font-family="Arial,sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="bold">Legenda</text>
  <line x1="505" y1="78" x2="620" y2="78" stroke="#e2e8f0" stroke-width="1"/>

  <line x1="512" y1="98" x2="538" y2="98" stroke="#16a34a" stroke-width="2"/>
  <polygon points="534,94 544,98 534,102" fill="#16a34a"/>
  <text x="550" y="102" font-family="Arial,sans-serif" font-size="11" fill="#16a34a" font-weight="bold">P (peso)</text>

  <line x1="512" y1="124" x2="538" y2="124" stroke="#dc2626" stroke-width="2"/>
  <polygon points="534,120 544,124 534,128" fill="#dc2626"/>
  <text x="550" y="128" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" font-weight="bold">N (normal)</text>

  <line x1="512" y1="150" x2="538" y2="150" stroke="#2f5bea" stroke-width="2"/>
  <polygon points="534,146 544,150 534,154" fill="#2f5bea"/>
  <text x="550" y="154" font-family="Arial,sans-serif" font-size="11" fill="#2f5bea" font-weight="bold">Pₓ = Psenθ</text>

  <line x1="512" y1="176" x2="538" y2="176" stroke="#f97316" stroke-width="2"/>
  <polygon points="534,172 544,176 534,180" fill="#f97316"/>
  <text x="550" y="180" font-family="Arial,sans-serif" font-size="11" fill="#f97316" font-weight="bold">Pᵧ = Pcosθ</text>

  <text x="562" y="202" font-family="Arial,sans-serif" font-size="10" fill="#475569" text-anchor="middle">N = Pᵧ (equilíbrio ⊥)</text>
  <text x="562" y="218" font-family="Arial,sans-serif" font-size="10" fill="#475569" text-anchor="middle">F_res = Pₓ − f</text>
  <text x="562" y="234" font-family="Arial,sans-serif" font-size="10" fill="#475569" text-anchor="middle">(sem atrito: F_res = Pₓ)</text>
</svg>
