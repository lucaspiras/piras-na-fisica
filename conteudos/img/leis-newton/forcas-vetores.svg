<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280">
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2f5bea"/>
    </marker>
    <marker id="ao" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#f97316"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="640" height="280" fill="#f9fafb" rx="10"/>

  <!-- Title -->
  <text x="320" y="28" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Representação Vetorial de Forças</text>

  <!-- Point of application -->
  <circle cx="200" cy="190" r="6" fill="#475569"/>
  <text x="190" y="212" font-family="Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="middle">O</text>

  <!-- Vector 1: 20 N horizontal right (blue) -->
  <line x1="200" y1="190" x2="390" y2="190" stroke="#2f5bea" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="295" y="215" font-family="Arial,sans-serif" font-size="13" fill="#2f5bea" text-anchor="middle" font-weight="bold">F₁ = 20 N</text>

  <!-- Vector 2: 15 N at 45° up-right (orange) -->
  <!-- 15/20 × 190 = 142.5 px; dx=dy=100.8 -->
  <line x1="200" y1="190" x2="300" y2="90" stroke="#f97316" stroke-width="2.5" marker-end="url(#ao)"/>
  <text x="295" y="78" font-family="Arial,sans-serif" font-size="13" fill="#f97316" text-anchor="middle" font-weight="bold">F₂ = 15 N</text>

  <!-- Angle arc from 0° to 45° (radius 55) -->
  <!-- Start: (255, 190), End: (200+55cos45, 190-55sin45) = (239, 151) -->
  <path d="M 255,190 A 55,55 0 0 0 239,151" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="275" y="172" font-family="Arial,sans-serif" font-size="12" fill="#64748b">45°</text>

  <!-- Horizontal reference dashed line -->
  <line x1="200" y1="190" x2="390" y2="190" stroke="none"/>

  <!-- Divider -->
  <line x1="430" y1="50" x2="430" y2="250" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Info panel right -->
  <rect x="445" y="70" width="175" height="75" fill="#eff6ff" rx="8" stroke="#bfdbfe" stroke-width="1"/>
  <text x="532" y="93" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#2f5bea" text-anchor="middle">F₁ = 20 N</text>
  <text x="532" y="112" font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="middle">direção: horizontal</text>
  <text x="532" y="130" font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="middle">sentido: →</text>

  <rect x="445" y="160" width="175" height="75" fill="#fff7ed" rx="8" stroke="#fed7aa" stroke-width="1"/>
  <text x="532" y="183" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#f97316" text-anchor="middle">F₂ = 15 N</text>
  <text x="532" y="202" font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="middle">direção: 45° c/ horizontal</text>
  <text x="532" y="220" font-family="Arial,sans-serif" font-size="11" fill="#475569" text-anchor="middle">sentido: ↗</text>

  <!-- Note about vectors -->
  <text x="200" y="260" font-family="Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Cada vetor tem módulo, direção e sentido</text>
</svg>
