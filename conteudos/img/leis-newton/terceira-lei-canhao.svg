<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280">
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2f5bea"/>
    </marker>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="640" height="280" fill="#f9fafb" rx="10"/>

  <text x="320" y="26" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Terceira Lei — Canhão Disparando</text>

  <!-- Ground -->
  <line x1="30" y1="218" x2="610" y2="218" stroke="#94a3b8" stroke-width="2"/>

  <!-- Cannon body (trapezoid shape) -->
  <polygon points="80,170 80,215 230,215 230,175" fill="#64748b" stroke="#334155" stroke-width="2"/>
  <!-- Cannon barrel -->
  <rect x="180" y="178" width="110" height="28" fill="#475569" stroke="#334155" stroke-width="2" rx="3"/>
  <!-- Barrel mouth opening -->
  <rect x="285" y="175" width="10" height="34" fill="#94a3b8" rx="2"/>
  <!-- Cannon wheels -->
  <circle cx="110" cy="215" r="18" fill="#334155" stroke="#1e293b" stroke-width="2"/>
  <circle cx="110" cy="215" r="8" fill="#64748b"/>
  <circle cx="200" cy="215" r="18" fill="#334155" stroke="#1e293b" stroke-width="2"/>
  <circle cx="200" cy="215" r="8" fill="#64748b"/>

  <!-- Cannon label -->
  <text x="155" y="200" font-family="Arial,sans-serif" font-size="11" fill="#f8fafc" text-anchor="middle" font-weight="bold">CANHÃO</text>

  <!-- Bullet (small circle flying right) -->
  <circle cx="340" cy="191" r="10" fill="#f97316" stroke="#ea580c" stroke-width="1.5"/>
  <!-- Explosion flash -->
  <polygon points="295,183 310,177 305,190 318,185 308,196 298,191 296,200 288,191" fill="#fbbf24" opacity="0.9"/>

  <!-- F on bullet (blue arrow right, big) -->
  <line x1="350" y1="171" x2="550" y2="171" stroke="#2f5bea" stroke-width="3" marker-end="url(#ab)"/>
  <text x="450" y="163" font-family="Arial,sans-serif" font-size="12" fill="#2f5bea" text-anchor="middle" font-weight="bold">F = 1000 N (ação sobre a bala)</text>

  <!-- F on cannon recoil (red arrow left, same size to show equal magnitude) -->
  <line x1="135" y1="155" x2="50" y2="155" stroke="#dc2626" stroke-width="3" marker-end="url(#ar)"/>
  <text x="110" y="147" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="bold">F = 1000 N (reação no canhão)</text>

  <!-- Masses and accelerations -->
  <rect x="325" y="210" width="280" height="42" fill="#eff6ff" rx="6" stroke="#bfdbfe" stroke-width="1"/>
  <text x="465" y="226" font-family="Arial,sans-serif" font-size="12" fill="#2f5bea" text-anchor="middle" font-weight="bold">Bala: m = 0,1 kg → a = F/m = 10 000 m/s²</text>
  <text x="465" y="244" font-family="Arial,sans-serif" font-size="12" fill="#2f5bea" text-anchor="middle">Canhão: M = 100 kg → a = F/M = 10 m/s²</text>

  <rect x="30" y="245" width="280" height="24" fill="#fef2f2" rx="6" stroke="#fecaca" stroke-width="1"/>
  <text x="170" y="261" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">Mesma força → acelerações muito diferentes!</text>
</svg>
