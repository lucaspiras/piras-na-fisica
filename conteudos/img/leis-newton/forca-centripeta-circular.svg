<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290">
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2f5bea"/>
    </marker>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#dc2626"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="640" height="290" fill="#f9fafb" rx="10"/>

  <text x="320" y="25" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Força Centrípeta no Movimento Circular</text>

  <!-- Circle orbit (center 210, 155, radius 100) -->
  <circle cx="210" cy="155" r="100" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8,5"/>

  <!-- Center mark -->
  <circle cx="210" cy="155" r="5" fill="#475569"/>
  <text x="215" y="170" font-family="Arial,sans-serif" font-size="11" fill="#475569">O</text>

  <!-- ===== Ball 1 at TOP (210, 55) ===== -->
  <circle cx="210" cy="55" r="11" fill="#f97316" stroke="#ea580c" stroke-width="1.5"/>

  <!-- v1 → tangential (horizontal right) -->
  <line x1="221" y1="55" x2="285" y2="55" stroke="#2f5bea" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="258" y="46" font-family="Arial,sans-serif" font-size="12" fill="#2f5bea" font-weight="bold">v</text>

  <!-- Fc1 ↓ centripetal (downward toward center) -->
  <line x1="210" y1="66" x2="210" y2="115" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="222" y="95" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" font-weight="bold">Fc</text>

  <!-- Right angle mark at ball1 (210, 55): between v→ and Fc↓ -->
  <polyline points="210,66 220,66 220,55" fill="none" stroke="#475569" stroke-width="1.5"/>

  <!-- ===== Ball 2 at RIGHT (310, 155) ===== -->
  <circle cx="310" cy="155" r="11" fill="#f97316" stroke="#ea580c" stroke-width="1.5"/>

  <!-- v2 ↓ tangential (downward) -->
  <line x1="310" y1="166" x2="310" y2="230" stroke="#2f5bea" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="322" y="210" font-family="Arial,sans-serif" font-size="12" fill="#2f5bea" font-weight="bold">v</text>

  <!-- Fc2 ← centripetal (left toward center) -->
  <line x1="299" y1="155" x2="226" y2="155" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="262" y="147" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" font-weight="bold">Fc</text>

  <!-- Right angle mark at ball2 -->
  <polyline points="299,155 299,166 310,166" fill="none" stroke="#475569" stroke-width="1.5"/>

  <!-- Radius arrow from center to ball2 -->
  <line x1="210" y1="155" x2="298" y2="155" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="248" y="172" font-family="Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">r</text>

  <!-- ===== Ball 3 at BOTTOM (210, 255) ===== -->
  <circle cx="210" cy="255" r="11" fill="#f97316" stroke="#ea580c" stroke-width="1.5"/>

  <!-- v3 ← tangential (horizontal left) -->
  <line x1="199" y1="255" x2="135" y2="255" stroke="#2f5bea" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="162" y="270" font-family="Arial,sans-serif" font-size="12" fill="#2f5bea" font-weight="bold">v</text>

  <!-- Fc3 ↑ centripetal (upward toward center) -->
  <line x1="210" y1="244" x2="210" y2="195" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- ===== FORMULA PANEL (right side) ===== -->
  <rect x="355" y="50" width="270" height="195" fill="white" stroke="#e2e8f0" stroke-width="1.5" rx="10"/>
  <text x="490" y="73" font-family="Arial,sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="bold">Força Centrípeta</text>
  <line x1="365" y1="79" x2="615" y2="79" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Key properties -->
  <text x="370" y="100" font-family="Arial,sans-serif" font-size="12" fill="#dc2626" font-weight="bold">• Direção:</text>
  <text x="445" y="100" font-family="Arial,sans-serif" font-size="12" fill="#475569">sempre para o centro</text>

  <text x="370" y="120" font-family="Arial,sans-serif" font-size="12" fill="#2f5bea" font-weight="bold">• v:</text>
  <text x="393" y="120" font-family="Arial,sans-serif" font-size="12" fill="#475569">sempre tangente à órbita</text>

  <text x="370" y="140" font-family="Arial,sans-serif" font-size="12" fill="#475569" font-weight="bold">• v ⊥ Fc</text>
  <text x="420" y="140" font-family="Arial,sans-serif" font-size="12" fill="#475569">(sempre perpendiculares)</text>

  <line x1="365" y1="150" x2="615" y2="150" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Formulas -->
  <rect x="368" y="158" width="242" height="36" fill="#fef2f2" rx="6"/>
  <text x="489" y="172" font-family="Arial,sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="bold">Fc = m·v²/r = m·ω²·r</text>
  <text x="489" y="188" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">Fc aponta para o centro</text>

  <rect x="368" y="200" width="242" height="32" fill="#eff6ff" rx="6"/>
  <text x="489" y="215" font-family="Arial,sans-serif" font-size="13" fill="#2f5bea" text-anchor="middle" font-weight="bold">ac = v²/r = ω²·r</text>
  <text x="489" y="228" font-family="Arial,sans-serif" font-size="11" fill="#2f5bea" text-anchor="middle">aceleração centrípeta</text>

  <!-- Legend at bottom -->
  <text x="490" y="265" font-family="Arial,sans-serif" font-size="11" fill="#2f5bea" text-anchor="middle">→ v (velocidade tangencial)</text>
  <text x="490" y="280" font-family="Arial,sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">→ Fc (força centrípeta)</text>
</svg>
