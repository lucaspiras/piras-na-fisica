<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270">
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2f5bea"/>
    </marker>
    <marker id="ao" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#f97316"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#16a34a"/>
    </marker>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#dc2626"/>
    </marker>
    <marker id="ap" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#6a2fe8"/>
    </marker>
  </defs>
  <rect width="640" height="270" fill="#f9fafb" rx="10"/>

  <!-- ===== LEFT PANEL: Forças Colineares ===== -->
  <text x="160" y="28" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Forças Colineares</text>

  <!-- Box/block -->
  <rect x="105" y="95" width="90" height="65" fill="#dbeafe" stroke="#2f5bea" stroke-width="2" rx="4"/>
  <text x="150" y="133" font-family="Arial,sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="bold">bloco</text>

  <!-- F1 = 80 N → (orange, right) -->
  <line x1="195" y1="115" x2="285" y2="115" stroke="#f97316" stroke-width="2.5" marker-end="url(#ao)"/>
  <text x="240" y="107" font-family="Arial,sans-serif" font-size="12" fill="#f97316" text-anchor="middle" font-weight="bold">F₁ = 80 N</text>

  <!-- F2 = 30 N ← (blue, left) -->
  <line x1="105" y1="145" x2="62" y2="145" stroke="#2f5bea" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="83" y="137" font-family="Arial,sans-serif" font-size="12" fill="#2f5bea" text-anchor="middle" font-weight="bold">F₂ = 30 N</text>

  <!-- Resultante -->
  <line x1="105" y1="185" x2="175" y2="185" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
  <rect x="30" y="198" width="260" height="30" fill="#dcfce7" rx="5" stroke="#bbf7d0" stroke-width="1"/>
  <text x="160" y="218" font-family="Arial,sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="bold">R = 80 − 30 = 50 N →</text>

  <!-- Ground line -->
  <line x1="40" y1="160" x2="300" y2="160" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- ===== DIVIDER ===== -->
  <line x1="320" y1="40" x2="320" y2="240" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ===== RIGHT PANEL: Composição Vetorial ===== -->
  <text x="480" y="28" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Composição Vetorial</text>

  <!-- Origin point -->
  <circle cx="380" cy="200" r="5" fill="#475569"/>

  <!-- F1 = horizontal right (orange, 80 N → 80px) -->
  <line x1="380" y1="200" x2="458" y2="200" stroke="#f97316" stroke-width="2.5" marker-end="url(#ao)"/>
  <text x="419" y="220" font-family="Arial,sans-serif" font-size="12" fill="#f97316" text-anchor="middle" font-weight="bold">F₁</text>

  <!-- F2 = vertical up (blue, 60 N → 60px) -->
  <line x1="380" y1="200" x2="380" y2="142" stroke="#2f5bea" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="363" y="170" font-family="Arial,sans-serif" font-size="12" fill="#2f5bea" text-anchor="middle" font-weight="bold">F₂</text>

  <!-- Dashed parallelogram lines -->
  <line x1="458" y1="200" x2="458" y2="142" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="380" y1="142" x2="458" y2="142" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Resultante R (diagonal, purple) -->
  <line x1="380" y1="200" x2="455" y2="145" stroke="#6a2fe8" stroke-width="2.5" marker-end="url(#ap)"/>
  <text x="436" y="162" font-family="Arial,sans-serif" font-size="12" fill="#6a2fe8" text-anchor="start" font-weight="bold">R</text>

  <!-- Angle arc -->
  <!-- atan2(60,80) ≈ 37°. Arc from (430,200) sweeping CCW to on diagonal -->
  <path d="M 420,200 A 40,40 0 0 0 412,168" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="432" y="188" font-family="Arial,sans-serif" font-size="11" fill="#64748b">37°</text>

  <!-- Formula -->
  <rect x="335" y="230" width="290" height="26" fill="#f3e8ff" rx="5" stroke="#e9d5ff" stroke-width="1"/>
  <text x="480" y="248" font-family="Arial,sans-serif" font-size="12" fill="#6a2fe8" text-anchor="middle">|R| = √(F₁² + F₂²) = √(80² + 60²) = 100 N</text>
</svg>
