<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" style="max-width:100%;height:auto;" role="img" aria-label="Dois referenciais para energia potencial gravitacional: a variação ΔEpg é igual em ambos">

  <!-- Background -->
  <rect width="560" height="372" fill="#f0f9ff" rx="10"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#0c4a6e">
    O referencial h = 0 pode ser escolhido livremente
  </text>
  <text x="280" y="44" text-anchor="middle" font-family="monospace" font-size="11" fill="#0369a1">
    apenas a variação ΔEpg = m · g · Δh importa
  </text>

  <!-- Panel divider -->
  <line x1="280" y1="52" x2="280" y2="300" stroke="#bae6fd" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- ═══ LEFT PANEL — Referencial 1 ═══ -->
  <text x="140" y="66" text-anchor="middle" font-family="monospace" font-size="12" fill="#0369a1" font-weight="bold">Referencial 1</text>

  <!-- Axis -->
  <line x1="70" y1="278" x2="70" y2="78" stroke="#475569" stroke-width="1.5"/>
  <polygon points="70,74 66,84 74,84" fill="#475569"/>
  <text x="70" y="71" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#475569">h</text>

  <!-- Ground -->
  <line x1="80" y1="278" x2="258" y2="278" stroke="#64748b" stroke-width="2"/>
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="90"  y1="278" x2="80"  y2="290"/>
    <line x1="105" y1="278" x2="95"  y2="290"/>
    <line x1="120" y1="278" x2="110" y2="290"/>
    <line x1="135" y1="278" x2="125" y2="290"/>
    <line x1="150" y1="278" x2="140" y2="290"/>
    <line x1="165" y1="278" x2="155" y2="290"/>
    <line x1="180" y1="278" x2="170" y2="290"/>
    <line x1="195" y1="278" x2="185" y2="290"/>
    <line x1="210" y1="278" x2="200" y2="290"/>
    <line x1="225" y1="278" x2="215" y2="290"/>
    <line x1="240" y1="278" x2="230" y2="290"/>
    <line x1="255" y1="278" x2="245" y2="290"/>
  </g>

  <!-- h = 0 tick + label -->
  <line x1="66" y1="278" x2="74" y2="278" stroke="#475569" stroke-width="1.5"/>
  <text x="62" y="282" text-anchor="end" font-family="monospace" font-size="11" fill="#0f766e" font-weight="bold">0</text>

  <!-- h = 20 tick + dashed guideline + label -->
  <line x1="66" y1="95" x2="74" y2="95" stroke="#475569" stroke-width="1.5"/>
  <line x1="80" y1="95" x2="148" y2="95" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="62" y="99" text-anchor="end" font-family="monospace" font-size="11" fill="#0f766e" font-weight="bold">20</text>

  <!-- Stone (top) -->
  <circle cx="165" cy="95" r="16" fill="#0ea5e9"/>
  <text x="165" y="100" text-anchor="middle" font-family="monospace" font-size="11" fill="white" font-weight="bold">m</text>

  <!-- Fall path -->
  <line x1="165" y1="113" x2="165" y2="250" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,4"/>
  <polygon points="165,254 161,244 169,244" fill="#475569"/>

  <!-- Ghost stone (bottom) -->
  <circle cx="165" cy="266" r="12" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.65"/>

  <!-- Height bracket -->
  <line x1="222" y1="95" x2="222" y2="278" stroke="#0ea5e9" stroke-width="1.5"/>
  <polygon points="222,91 218,101 226,101" fill="#0ea5e9"/>
  <polygon points="222,282 218,272 226,272" fill="#0ea5e9"/>
  <text x="232" y="191" font-family="monospace" font-size="11" fill="#0369a1">h = 20 m</text>

  <!-- Epg values -->
  <text x="140" y="310" text-anchor="middle" font-family="monospace" font-size="10" fill="#0369a1">Epg(topo) = m·g·20</text>
  <text x="140" y="324" text-anchor="middle" font-family="monospace" font-size="10" fill="#0369a1">Epg(base) = m·g·0 = 0</text>

  <!-- ═══ RIGHT PANEL — Referencial 2 ═══ -->
  <text x="420" y="66" text-anchor="middle" font-family="monospace" font-size="12" fill="#0369a1" font-weight="bold">Referencial 2</text>

  <!-- Axis -->
  <line x1="350" y1="278" x2="350" y2="78" stroke="#475569" stroke-width="1.5"/>
  <polygon points="350,74 346,84 354,84" fill="#475569"/>
  <text x="350" y="71" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#475569">h</text>

  <!-- Ground -->
  <line x1="360" y1="278" x2="538" y2="278" stroke="#64748b" stroke-width="2"/>
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="370" y1="278" x2="360" y2="290"/>
    <line x1="385" y1="278" x2="375" y2="290"/>
    <line x1="400" y1="278" x2="390" y2="290"/>
    <line x1="415" y1="278" x2="405" y2="290"/>
    <line x1="430" y1="278" x2="420" y2="290"/>
    <line x1="445" y1="278" x2="435" y2="290"/>
    <line x1="460" y1="278" x2="450" y2="290"/>
    <line x1="475" y1="278" x2="465" y2="290"/>
    <line x1="490" y1="278" x2="480" y2="290"/>
    <line x1="505" y1="278" x2="495" y2="290"/>
    <line x1="520" y1="278" x2="510" y2="290"/>
    <line x1="535" y1="278" x2="525" y2="290"/>
  </g>

  <!-- h = 0 tick at stone level + dashed guideline + label -->
  <line x1="346" y1="95" x2="354" y2="95" stroke="#475569" stroke-width="1.5"/>
  <line x1="360" y1="95" x2="428" y2="95" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="342" y="99" text-anchor="end" font-family="monospace" font-size="11" fill="#0f766e" font-weight="bold">0</text>

  <!-- h = -20 tick at ground + label -->
  <line x1="346" y1="278" x2="354" y2="278" stroke="#475569" stroke-width="1.5"/>
  <text x="342" y="282" text-anchor="end" font-family="monospace" font-size="11" fill="#dc2626" font-weight="bold">&#8722;20</text>

  <!-- Stone (top) -->
  <circle cx="445" cy="95" r="16" fill="#0ea5e9"/>
  <text x="445" y="100" text-anchor="middle" font-family="monospace" font-size="11" fill="white" font-weight="bold">m</text>

  <!-- Fall path -->
  <line x1="445" y1="113" x2="445" y2="250" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,4"/>
  <polygon points="445,254 441,244 449,244" fill="#475569"/>

  <!-- Ghost stone (bottom) -->
  <circle cx="445" cy="266" r="12" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.65"/>

  <!-- Height bracket (red for negative) -->
  <line x1="492" y1="95" x2="492" y2="278" stroke="#dc2626" stroke-width="1.5"/>
  <polygon points="492,91 488,101 496,101" fill="#dc2626"/>
  <polygon points="492,282 488,272 496,272" fill="#dc2626"/>
  <text x="502" y="191" font-family="monospace" font-size="11" fill="#dc2626">h = &#8722;20 m</text>

  <!-- Epg values -->
  <text x="420" y="310" text-anchor="middle" font-family="monospace" font-size="10" fill="#0369a1">Epg(topo) = m·g·0 = 0</text>
  <text x="420" y="324" text-anchor="middle" font-family="monospace" font-size="10" fill="#dc2626">Epg(base) = m·g·(&#8722;20)</text>

  <!-- Footer: ΔEpg equal -->
  <rect x="90" y="336" width="380" height="22" rx="4" fill="#e0f2fe"/>
  <text x="280" y="351" text-anchor="middle" font-family="monospace" font-size="11" fill="#0c4a6e" font-weight="bold">
    &#916;Epg = &#8722;m&#183;g&#183;20  (igual nos dois referenciais)
  </text>

  <!-- Note about h direction -->
  <text x="280" y="368" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#64748b">
    h sempre cresce para cima; valores negativos indicam posi&#231;&#227;o abaixo do referencial
  </text>

</svg>
