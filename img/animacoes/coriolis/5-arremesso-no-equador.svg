        --cf-rot-esc:  #dbe4ee;
        --cf-ceu-alto: #0d1622;
        --cf-ceu-baix: #1d2a38;
        --cf-grama:    #2f4a2c;
        --cf-grama-2:  #263d24;
        --cf-capim:    #3f6b30;
        --cf-capim-2:  #345826;
        --cf-sol:      #d9a406;
        --cf-tronco:   #6b4526;
        --cf-tronco-l: #543619;
        --cf-folha:    #2f6b3b;
        --cf-folha-2:  #26592f;
        --cf-calcado:  #3d4657;
        --cf-calcado-b: #8b95a8;
        --cf-oceano:   #1b4a70;
        --cf-terra:    #3f7a45;
        --cf-terra-b:  #2c5c31;
        --cf-globo-b:  #0d2537;
        --cf-asfalto:  #343b44;
        --cf-onibus:   #c69a26;
        --cf-onibus-i: #2b3242;
        --cf-vidro:    #1f3b52;
        --cf-banco:    #47566b;
        --cf-roda-c:   #6b7480;
        --cf-poste:    #5a626c;
        --cf-elev:     #39424f;
        --cf-elev-i:   #232b36;
        --cf-balanca:  #6b7480;
        --cf-visor:    #24402a;
        --cf-acel:     #e8a13c;
      }
    }
    /* Sem o movimento a bola fica no início do caminho, mas o traço da
       trajetória é desenhado à parte e a figura continua se explicando. */
    @media (prefers-reduced-motion: reduce) {
      animateMotion { display: none; }
      animateTransform { display: none; }
    }
