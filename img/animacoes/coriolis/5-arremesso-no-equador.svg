      --cf-tinta:    #1e293b;
      --cf-calcado:  #2a3342;
      --cf-calcado-b: none;
      /* globo em projeção polar */
      --cf-oceano:   #2f74ac;
      --cf-terra:    #5aa05a;
      --cf-terra-b:  #3d7a3d;
      --cf-globo-b:  #16324a;
      /* ônibus em corte */
      --cf-asfalto:  #9aa1a9;
      --cf-onibus:   #f0c33c;
      --cf-onibus-i: #fbf3dd;
      --cf-vidro:    #bfe0f2;
      --cf-banco:    #7286a0;
      --cf-roda-c:   #9aa3af;
