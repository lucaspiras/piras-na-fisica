<?xml version="1.0" encoding="UTF-8"?>
<!-- Arremesso vertical no equador: a bola cai a oeste do ponto de lançamento.
     Autossuficiente: pode ser aberto direto no navegador, usado em <img src>,
     inserido em slide ou importado em editor vetorial.
     Fonte da geometria: conteudos/dinamica/aprofundamento/forcas-ficticias.html -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" width="720" height="580"
     role="img" aria-labelledby="cf-titulo-arremesso">
  <title id="cf-titulo-arremesso">Animação: numa paisagem equatorial com palmeiras, sol e capim, um menino de braços erguidos acaba de arremessar uma bola de futebol verticalmente para cima. Durante a subida a força de Coriolis empurra a bola para oeste e durante a descida para leste, e a bola cai no chão a oeste do ponto de onde saiu.</title>
  <style><![CDATA[
    svg {
      --cf-disco:  #e5e9f0;
      --cf-borda:  #64748b;
      --cf-raio:   rgba(100,116,139,.38);
      --cf-chao:   #cbd5e1;
      --cf-alvo:   #ea580c;
      --cf-bola:   #2563eb;
      --cf-guia:   #94a3b8;
      --cf-forca:  #7c3aed;
      --cf-baixa:  #dc2626;
