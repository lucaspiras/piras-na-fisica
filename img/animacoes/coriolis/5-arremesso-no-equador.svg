    .cf-camisa-2   { fill: #2f8f8a; }
    .cf-couro      { fill: #ffffff; stroke: var(--cf-tinta); stroke-width: 1; }
    .cf-gomo       { fill: var(--cf-tinta); }
    .cf-costura    { fill: none; stroke: var(--cf-tinta); stroke-width: 1; }

    /* Quem abrir o arquivo com o sistema no modo escuro vê a versão noturna,
       igual à do site. Embutido aqui porque o .svg carregado como imagem é um
       documento à parte e não enxerga o data-theme da página. */
    @media (prefers-color-scheme: dark) {
      svg {
        --cf-disco:  #1c2536;
