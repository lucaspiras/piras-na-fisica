<?xml version="1.0" encoding="UTF-8"?>
<!-- Peso aparente com o elevador sem aceleração: a balança marca os 70 kg de sempre.
     Autossuficiente: pode ser aberto direto no navegador, usado em <img src>,
     inserido em slide ou importado em editor vetorial.
     Fonte da geometria: conteudos/dinamica/aprofundamento/forcas-ficticias.html -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 340" width="400" height="680"
     role="img" aria-labelledby="cf-titulo-elev-zero">
  <title id="cf-titulo-elev-zero">Elevador parado ou em velocidade constante: a mulher está de pé sobre a balança, que marca 70 quilogramas, o peso normal dela.</title>
  <style><![CDATA[
    svg {
      --cf-disco:  #e5e9f0;
      --cf-borda:  #64748b;
      --cf-raio:   rgba(100,116,139,.38);
      --cf-chao:   #cbd5e1;
      --cf-alvo:   #ea580c;
      --cf-bola:   #2563eb;
      --cf-guia:   #94a3b8;
      --cf-forca:  #7c3aed;
      --cf-baixa:  #dc2626;
      --cf-rotulo: #475569;
      --cf-forte:  #1e293b;
      --cf-seta:   #64748b;
      --cf-fonte:  ui-monospace, 'Cascadia Mono', 'Segoe UI Mono', 'Roboto Mono', monospace;
      /* cenário do arremesso no equador */
      --cf-rot-esc:  #1f2b3a;
      --cf-ceu-alto: #a9d3ee;
      --cf-ceu-baix: #dceaf5;
      --cf-grama:    #8fbf6f;
      --cf-grama-2:  #79a95c;
      --cf-capim:    #4f8a3a;
      --cf-capim-2:  #3f7530;
      --cf-sol:      #f7cf3a;
      --cf-tronco:   #8a5a32;
      --cf-tronco-l: #6b4526;
      --cf-folha:    #3f8f4e;
      --cf-folha-2:  #327a41;
      --cf-tinta:    #1e293b;
      --cf-calcado:  #2a3342;
      --cf-calcado-b: none;
      /* globo em projeção polar */
      --cf-oceano:   #2f74ac;
      --cf-terra:    #5aa05a;
      --cf-terra-b:  #3d7a3d;
      --cf-globo-b:  #16324a;
      /* ônibus em corte */
      --cf-asfalto:  #9aa1a9;
      --cf-onibus:   #f0c33c;
      --cf-onibus-i: #fbf3dd;
      --cf-vidro:    #bfe0f2;
      --cf-banco:    #7286a0;
      --cf-roda-c:   #9aa3af;
      --cf-poste:    #7d8590;
      /* elevador e balança */
      --cf-elev:     #b9c3cf;
      --cf-elev-i:   #edf1f5;
      --cf-balanca:  #55606e;
      --cf-visor:    #dff2e0;
      --cf-acel:     #b45309;
    }
    .cf-disco   { fill: var(--cf-disco); }
    .cf-borda   { fill: none; stroke: var(--cf-borda); stroke-width: 1.6; }
    .cf-raio    { stroke: var(--cf-raio); stroke-width: 1.1; }
    .cf-chao    { fill: var(--cf-chao); }
    .cf-chao-l  { stroke: var(--cf-borda); stroke-width: 1.5; }
    .cf-alvo    { fill: var(--cf-alvo); }
    .cf-alvo-a  { fill: none; stroke: var(--cf-alvo); stroke-width: 1.8; stroke-dasharray: 3 3; }
    .cf-bola    { fill: var(--cf-bola); }
    .cf-traco   { fill: none; stroke: var(--cf-bola); stroke-width: 2.2; stroke-linecap: round; }
    .cf-guia    { fill: none; stroke: var(--cf-guia); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .cf-forca   { fill: none; stroke: var(--cf-forca); stroke-width: 2.2; stroke-linecap: round; }
    .cf-forca-p { fill: var(--cf-forca); }
    .cf-baixa   { fill: var(--cf-baixa); }
    .cf-seta    { fill: var(--cf-seta); }
    .cf-seta-l  { fill: none; stroke: var(--cf-seta); stroke-width: 1.8; }
    .cf-rotulo  { fill: var(--cf-rotulo); font-size: 11px; font-family: var(--cf-fonte); }
    .cf-forte   { fill: var(--cf-forte); font-size: 12px; font-weight: 700; font-family: var(--cf-fonte); }
    .cf-mono    { font-family: var(--cf-fonte); }

    .cf-rotulo-esc { fill: var(--cf-rot-esc); font-size: 11px; font-family: var(--cf-fonte); }
    .cf-ceu-alto   { stop-color: var(--cf-ceu-alto); }
    .cf-ceu-baixo  { stop-color: var(--cf-ceu-baix); }
    .cf-grama      { fill: var(--cf-grama); }
    .cf-grama-2    { fill: var(--cf-grama-2); }
    .cf-capim      { fill: none; stroke: var(--cf-capim); stroke-width: 1.8; stroke-linecap: round; }
    .cf-capim-2    { fill: none; stroke: var(--cf-capim-2); stroke-width: 1.8; stroke-linecap: round; }
    .cf-sol        { fill: var(--cf-sol); }
    .cf-sol-raio   { fill: none; stroke: var(--cf-sol); stroke-width: 2.6; stroke-linecap: round; }
    .cf-tronco     { fill: var(--cf-tronco); }
    .cf-tronco-l   { fill: none; stroke: var(--cf-tronco-l); stroke-width: 1.3; stroke-linecap: round; }
    .cf-folha      { fill: var(--cf-folha); }
    .cf-folha-2    { fill: var(--cf-folha-2); }
    .cf-coco       { fill: var(--cf-tronco-l); }
    .cf-pele       { fill: #f6cb96; }
    .cf-membro     { fill: none; stroke: #f6cb96; stroke-width: 7.5; stroke-linecap: round; }
    .cf-camisa     { fill: #e0563f; }
    .cf-cabelo     { fill: #4a3728; }
    .cf-olho       { fill: #ffffff; stroke: #2a3342; stroke-width: 1; }
    .cf-pupila     { fill: var(--cf-tinta); }
    .cf-traco-f    { fill: none; stroke: #2a3342; stroke-width: 1.5; stroke-linecap: round; }
    .cf-calcado    { fill: var(--cf-calcado); stroke: var(--cf-calcado-b); stroke-width: 1.4; }
    .cf-oceano     { fill: var(--cf-oceano); }
    .cf-terra      { fill: var(--cf-terra); stroke: var(--cf-terra-b); stroke-width: 1; stroke-linejoin: round; }
    .cf-globo-b    { fill: none; stroke: var(--cf-globo-b); stroke-width: 2; }
    .cf-paralelo   { fill: none; stroke: rgba(255,255,255,.42); stroke-width: 1; stroke-dasharray: 4 4; }
    .cf-meridiano  { stroke: rgba(255,255,255,.26); stroke-width: 1; }
    .cf-projetil   { fill: #fff8e1; stroke: var(--cf-globo-b); stroke-width: 1.2; }
    .cf-reta       { fill: none; stroke: #ffffff; stroke-width: 2.4; stroke-linecap: round; }
    .cf-rastro     { fill: none; stroke: #ef4444; stroke-width: 2.6; stroke-linecap: round; }
    .cf-rot-claro  { fill: #ffffff; font-size: 10.5px; font-family: var(--cf-fonte); }
    .cf-asfalto    { fill: var(--cf-asfalto); }
    .cf-onibus     { fill: var(--cf-onibus); }
    .cf-onibus-i   { fill: var(--cf-onibus-i); }
    .cf-onibus-b   { fill: none; stroke: #2a3342; stroke-width: 2; stroke-linejoin: round; }
    .cf-vidro      { fill: var(--cf-vidro); }
    .cf-banco      { fill: var(--cf-banco); }
    .cf-roda       { fill: #2a3342; }
    .cf-roda-c     { fill: var(--cf-roda-c); }
    .cf-poste      { fill: var(--cf-poste); }
    .cf-barra      { fill: none; stroke: #b9803a; stroke-width: 2.4; stroke-linecap: round; }
    .cf-elevador   { fill: var(--cf-elev); }
    .cf-elevador-i { fill: var(--cf-elev-i); }
    .cf-cabo       { fill: none; stroke: var(--cf-poste); stroke-width: 3; }
    .cf-balanca    { fill: var(--cf-balanca); }
    .cf-visor      { fill: var(--cf-visor); }
    .cf-leitura    { fill: var(--cf-rot-esc); font-size: 30px; font-weight: 700; font-family: var(--cf-fonte); }
    .cf-acel       { fill: none; stroke: var(--cf-acel); stroke-width: 3.5; stroke-linecap: round; }
    .cf-acel-p     { fill: var(--cf-acel); }
    .cf-camisa-2   { fill: #2f8f8a; }
    .cf-couro      { fill: #ffffff; stroke: var(--cf-tinta); stroke-width: 1; }
    .cf-gomo       { fill: var(--cf-tinta); }
    .cf-costura    { fill: none; stroke: var(--cf-tinta); stroke-width: 1; }

    /* Quem abrir o arquivo com o sistema no modo escuro vê a versão noturna,
       igual à do site. Embutido aqui porque o .svg carregado como imagem é um
       documento à parte e não enxerga o data-theme da página. */
    @media (prefers-color-scheme: dark) {
      svg {
        --cf-disco:  #1c2536;
        --cf-borda:  #94a3b8;
        --cf-raio:   rgba(148,163,184,.32);
        --cf-chao:   #263244;
        --cf-alvo:   #fb923c;
        --cf-bola:   #60a5fa;
        --cf-guia:   #64748b;
        --cf-forca:  #a78bfa;
        --cf-baixa:  #f87171;
        --cf-rotulo: #cbd5e1;
        --cf-forte:  #e2e8f0;
        --cf-seta:   #94a3b8;
        --cf-rot-esc:  #dbe4ee;
        --cf-ceu-alto: #0d1622;
        --cf-ceu-baix: #1d2a38;
        --cf-grama:    #2f4a2c;
        --cf-grama-2:  #263d24;
        --cf-capim:    #3f6b30;
        --cf-capim-2:  #345826;
        --cf-sol:      #d9a406;
        --cf-tronco:   #6b4526;
        --cf-tronco-l: #543619;
        --cf-folha:    #2f6b3b;
        --cf-folha-2:  #26592f;
        --cf-calcado:  #3d4657;
        --cf-calcado-b: #8b95a8;
        --cf-oceano:   #1b4a70;
        --cf-terra:    #3f7a45;
        --cf-terra-b:  #2c5c31;
        --cf-globo-b:  #0d2537;
        --cf-asfalto:  #343b44;
        --cf-onibus:   #c69a26;
        --cf-onibus-i: #2b3242;
        --cf-vidro:    #1f3b52;
        --cf-banco:    #47566b;
        --cf-roda-c:   #6b7480;
        --cf-poste:    #5a626c;
        --cf-elev:     #39424f;
        --cf-elev-i:   #232b36;
        --cf-balanca:  #6b7480;
        --cf-visor:    #24402a;
        --cf-acel:     #e8a13c;
      }
    }
    /* Sem o movimento a bola fica no início do caminho, mas o traço da
       trajetória é desenhado à parte e a figura continua se explicando. */
    @media (prefers-reduced-motion: reduce) {
      animateMotion { display: none; }
      animateTransform { display: none; }
    }
  ]]></style>
  <text class="cf-forte cf-mono" x="100" y="16" text-anchor="middle">a = 0</text>
  <path class="cf-cabo" d="M100,24 L100,46"/>
  <rect class="cf-elevador" x="20" y="46" width="160" height="224" rx="8"/>
  <rect class="cf-elevador-i" x="27" y="53" width="146" height="210" rx="5"/>

  <g transform="translate(100,249) scale(1.5)">
  <path class="cf-membro" d="M-5,-18 L-6,-4"/>
  <path class="cf-membro" d="M5,-18 L6,-4"/>
  <ellipse class="cf-calcado" cx="-7" cy="-2.5" rx="6" ry="3.2"/>
  <ellipse class="cf-calcado" cx="7" cy="-2.5" rx="6" ry="3.2"/>
  <path class="cf-camisa-2" d="M-11,-37 q11,-4 22,0 l2,22 q-13,4 -26,0 Z"/>
  <path class="cf-membro" d="M-10,-34 L-17,-13"/>
  <path class="cf-membro" d="M10,-34 L17,-13"/>
  <circle class="cf-pele" cx="-17" cy="-13" r="4.6"/>
  <circle class="cf-pele" cx="17" cy="-13" r="4.6"/>
  <rect class="cf-pele" x="-3.5" y="-44" width="7" height="8" rx="2"/>
  <ellipse class="cf-cabelo" cx="0" cy="-59" rx="20" ry="22"/>
  <rect class="cf-cabelo" x="-21" y="-62" width="9" height="34" rx="4.5"/>
  <rect class="cf-cabelo" x="12" y="-62" width="9" height="34" rx="4.5"/>
  <circle class="cf-pele" cx="0" cy="-57" r="17"/>
  <path class="cf-cabelo" d="M-16.6,-61 q2,-19 16.6,-19 q14.6,0 16.6,19 q-5.4,-9 -16.6,-9 q-11.2,0 -16.6,9 Z"/>
  <circle class="cf-olho" cx="-6" cy="-59" r="5.6"/>
  <circle class="cf-olho" cx="6" cy="-59" r="5.6"/>
  <circle class="cf-pupila" cx="-6" cy="-59" r="2.3"/>
  <circle class="cf-pupila" cx="6" cy="-59" r="2.3"/>
  <path class="cf-traco-f" d="M0,-54 q4,3.4 0,6.4"/>
  <path class="cf-traco-f" d="M-6,-46 q6,5 12,0"/>
  </g>
  <rect class="cf-balanca" x="62" y="249" width="76" height="14" rx="3"/>
  <rect class="cf-visor" x="84" y="252" width="32" height="8" rx="2"/>
  <line class="cf-onibus-b" x1="27" y1="263" x2="173" y2="263" stroke-width="1.6"/>
  <rect class="cf-onibus-b" x="20" y="46" width="160" height="224" rx="8"/>
  <text class="cf-leitura cf-mono" x="100" y="303" text-anchor="middle">70 kg</text>
  <text class="cf-rotulo-esc cf-mono" x="100" y="325" text-anchor="middle">peso normal</text>
</svg>
