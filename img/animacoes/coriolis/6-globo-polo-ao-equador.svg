    </g>
  </g>
  <circle class="cf-globo-b" cx="180" cy="152" r="108"/>

  <path class="cf-reta" d="M180,152 L180,260" stroke-dasharray="108" stroke-dashoffset="108">
    <animate attributeName="stroke-dashoffset" dur="5s" values="108;0;0" keyTimes="0;0.8;1" repeatCount="indefinite"/>
