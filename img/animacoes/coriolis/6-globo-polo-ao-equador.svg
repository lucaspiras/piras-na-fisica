      <animateTransform attributeName="transform" type="rotate" dur="5s"
        values="0 180 152;-50 180 152;-50 180 152" keyTimes="0;0.8;1" repeatCount="indefinite"/>
      <circle class="cf-oceano" cx="180" cy="152" r="108"/>
      <path class="cf-meridiano" d="M180,152 L180,44 M180,152 L126,58.5 M180,152 L86.5,98 M180,152 L72,152 M180,152 L86.5,206 M180,152 L126,245.5 M180,152 L180,260 M180,152 L234,245.5 M180,152 L273.5,206 M180,152 L288,152 M180,152 L273.5,98 M180,152 L234,58.5"/>
