  <text class="cf-rot-claro cf-mono" x="180" y="144" text-anchor="middle">polo N</text>
  <text class="cf-rotulo-esc cf-mono" x="66" y="156" text-anchor="end">equador</text>
  <text class="cf-rotulo-esc cf-mono" x="180" y="288" text-anchor="middle">branco: no espaço · vermelho: sobre o solo</text>
</svg>
