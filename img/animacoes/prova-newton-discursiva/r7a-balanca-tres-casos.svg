<?xml version="1.0" encoding="UTF-8"?>
<!-- Resposta do item 7a: a balança no elevador nas três situações, mostrando que ela marca a normal e não o peso.
     Autossuficiente: pode ser aberto direto no navegador, usado em <img src>,
     inserido em slide ou importado em editor vetorial.
     Cor pelo sistema de variaveis fig-* do site, com o modo escuro junto.
     Fonte da geometria: atividades/testes/prova-newton-discursiva/gabarito_newton_discursiva.html
     Gerado por scripts/extrair-figuras-provas.ps1 - nao editar a mao. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="800" height="480"
     role="img" aria-labelledby="prova-newton-discursiva-r7a-balanca-tres-casos">
  <title id="prova-newton-discursiva-r7a-balanca-tres-casos">Resposta do item 7a: a balança no elevador nas três situações, mostrando que ela marca a normal e não o peso.</title>
  <style><![CDATA[
/* === CORES DAS FIGURAS === */
  /* Mesma paleta do catálogo em img/animacoes/. Em classe, e não em atributo, para o
     .svg avulso poder carregar a versão noturna junto. */
  /* `:root` serve aos dois destinos de uma vez: na página HTML ele é o elemento html,
     e as variáveis descem para o SVG embutido E para a legenda ao lado dele; no
     arquivo .svg avulso, o elemento raiz é o próprio svg. Preso num seletor `svg`, o
     bloco pintava o desenho e deixava as bolinhas da legenda sem cor. */
  :root {
    --fig-superficie-2:#f8fafc;
    --fig-corpo:       #f1f5f9;
    --fig-corpo-b:     #334155;
    --fig-apoio:       #64748b;
    --fig-guia:        #cbd5e1;
    --fig-divisor:     #e2e8f0;
    --fig-texto:       #334155;
    --fig-rotulo:      #64748b;
    --fig-peso:        #9333ea;
    --fig-normal:      #16a34a;
    --fig-atrito:      #ea580c;
    --fig-aplicada:    #ef4444;
    --fig-tracao:      #0e7490;
    --fig-cinza:       #94a3b8;
  }
  .fig-chao      { fill: none; stroke: var(--fig-apoio); stroke-width: 2.6; }
  .fig-chao-fino { fill: none; stroke: var(--fig-guia);  stroke-width: 1.4; }
  .fig-corpo     { fill: var(--fig-corpo);   stroke: var(--fig-corpo-b); stroke-width: 1.8; }
  .fig-corpo-2   { fill: var(--fig-divisor); stroke: var(--fig-apoio);   stroke-width: 1.6; }
  .fig-rampa     { fill: var(--fig-superficie-2); stroke: var(--fig-corpo-b); stroke-width: 2; }
  .fig-haste     { fill: none; stroke: var(--fig-corpo-b); stroke-width: 2; }
  .fig-divisor   { fill: none; stroke: var(--fig-divisor); stroke-width: 1.4; stroke-dasharray: 5 4; }
  .fig-cabine    { fill: none; stroke: var(--fig-apoio); stroke-width: 1.6; stroke-dasharray: 6 4; }
  .fig-terra     { fill: none; stroke: var(--fig-apoio); stroke-width: 2; }
  .fig-tarja     { fill: var(--fig-superficie-2); opacity: .9; }
  .fig-texto     { fill: var(--fig-texto); }
  .fig-rotulo    { fill: var(--fig-rotulo); }
  .fig-v-peso     { fill: none; stroke: var(--fig-peso);     stroke-width: 2.8; }
  .fig-v-normal   { fill: none; stroke: var(--fig-normal);   stroke-width: 2.8; }
  .fig-v-atrito   { fill: none; stroke: var(--fig-atrito);   stroke-width: 2.8; }
  .fig-v-aplicada { fill: none; stroke: var(--fig-aplicada); stroke-width: 2.8; }
  .fig-v-tracao   { fill: none; stroke: var(--fig-tracao);   stroke-width: 2.8; }
  .fig-v-fantasma { fill: none; stroke: var(--fig-cinza);    stroke-width: 2.2; }
  .fig-trac       { stroke-dasharray: 5 3; }
  .fig-fina       { stroke-width: 2.2; }
  .fig-p-peso     { fill: var(--fig-peso); }
  .fig-p-normal   { fill: var(--fig-normal); }
  .fig-p-atrito   { fill: var(--fig-atrito); }
  .fig-p-aplicada { fill: var(--fig-aplicada); }
  .fig-p-tracao   { fill: var(--fig-tracao); }
  .fig-p-fantasma { fill: var(--fig-cinza); }
  .fig-r-peso     { fill: var(--fig-peso); }
  .fig-r-normal   { fill: var(--fig-normal); }
  .fig-r-atrito   { fill: var(--fig-atrito); }
  .fig-r-aplicada { fill: var(--fig-aplicada); }
  .fig-r-tracao   { fill: var(--fig-tracao); }
  .fig-r-cinza    { fill: var(--fig-cinza); }
  @media (prefers-color-scheme: dark) {
    :root {
      --fig-superficie-2:#172033;
      --fig-corpo:       #1e293b;
      --fig-corpo-b:     #cbd5e1;
      --fig-apoio:       #94a3b8;
      --fig-guia:        #475569;
      --fig-divisor:     #334155;
      --fig-texto:       #e2e8f0;
      --fig-rotulo:      #94a3b8;
      --fig-peso:        #c084fc;
      --fig-normal:      #4ade80;
      --fig-atrito:      #fb923c;
      --fig-aplicada:    #f87171;
      --fig-tracao:      #22d3ee;
      --fig-cinza:       #64748b;
    }
  }
  /* === FIM DAS CORES DAS FIGURAS === */
  ]]></style>
