"/><line class="fig-chao-fino" x1="244" y1="156" x2="237" y2="163"/><line class="fig-chao-fino" x1="253" y1="156" x2="246" y2="163"/><line class="fig-chao-fino" x1="262" y1="156" x2="255" y2="163"/><line class="fig-chao-fino" x1="271" y1="156" x2="264" y2="163"/><line class="fig-chao-fino" x1="280" y1="156" x2="273" y2="163"/><line class="fig-chao-fino" x1="289" y1="156" x2="282" y2="163"/><line class="fig-chao-fino" x1="298" y1="156" x2="291" y2="163"/><line class="fig-chao-fino" x1="307" y1="156" x2="300" y2="163"/><line class="fig-chao-fino" x1="316" y1="156" x2="309" y2="163"/><line class="fig-chao-fino" x1="325" y1="156" x2="318" y2="163"/><line class="fig-chao-fino" x1="334" y1="156" x2="327" y2="163"/><text class="fig-rotulo" x="32" y="172" font-size="11" font-weight="400">piso sem atrito</text><rect class="fig-corpo" x="104" y="120" width="140" height="36" rx="2"/><text class="fig-texto" x="252" y="144" font-size="11.5" font-weight="600">A  (7 kg)</text><rect class="fig-corpo-2" x="130" y="82" width="88" height="38" rx="2"/><text class="fig-texto" x="226" y="105" font-size="11.5" font-weight="600">B  (3 kg)</text><line class="fig-v-aplicada" x1="34" y1="144" x2="100" y2="144" marker-end="url(#p-g5a-aplicada)"/><text class="fig-r-aplicada" x="68" y="134" font-size="13" font-weight="700">F</text><line class="fig-v-atrito" x1="140" y1="111" x2="206" y2="111" marker-end="url(#p-g5a-atrito)"/><text class="fig-r-atrito" x="146" y="102" font-size="11.5" font-weight="700">f<tspan dy="4" font-size="0.75em">at</tspan><tspan dy="-4"></tspan></text><text class="fig-r-atrito" x="174" y="70" font-size="9.8" font-weight="600" text-anchor="middle">sobre B, para a frente</text><line class="fig-v-atrito fig-trac fig-fina" x1="208" y1="131" x2="138" y2="131" marker-end="url(#p-g5a-atrito)"/><text class="fig-r-atrito" x="174" y="146" font-size="9.8" font-weight="600" text-anchor="middle">a reação, sobre A</text><text class="fig-texto" x="184" y="18" font-size="12" font-weight="