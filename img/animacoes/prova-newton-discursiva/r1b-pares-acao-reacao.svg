"2"/><text class="fig-texto" x="96" y="127" font-size="11" font-weight="400" text-anchor="middle">livro</text><line class="fig-v-normal" x1="96" y1="114" x2="96" y2="50" marker-end="url(#p-g1b-normal)"/><text class="fig-r-normal" x="103" y="54" font-size="13" font-weight="700">N</text><line class="fig-v-peso" x1="96" y1="132" x2="96" y2="196" marker-end="url(#p-g1b-peso)"/><text class="fig-r-peso" x="103" y="196" font-size="13" font-weight="700">P</text><text class="fig-rotulo" x="96" y="258" font-size="9.6" font-weight="400" text-anchor="middle" font-style="italic">as duas no MESMO corpo: cancelam-se</text><rect class="fig-corpo-2" x="224" y="120" width="90" height="14" rx="2"/><text class="fig-texto" x="269" y="131" font-size="10.5" font-weight="400" text-anchor="middle">mesa</text><line class="fig-v-normal fig-trac" x1="269" y1="56" x2="269" y2="118" marker-end="url(#p-g1b-normal)"/><text class="fig-r-normal" x="243" y="112" font-size="13" font-weight="700">N′</text><rect class="fig-tarja" x="281" y="83" width="45.2" height="13"/><text class="fig-r-normal" x="284" y="92" font-size="10" font-weight="600">na mesa</text><path class="fig-terra" d="M 204 246 Q 286 218 368 246"/><text class="fig-texto" x="286" y="262" font-size="10.5" font-weight="400" text-anchor="middle">Terra</text><line class="fig-v-peso fig-trac" x1="286" y1="228" x2="286" y2="166" marker-end="url(#p-g1b-peso)"/><text class="fig-r-peso" x="260" y="162" font-size="13" font-weight="700">P′</text><rect class="fig-tarja" x="297" y="187" width="50.8" height="13"/><text class="fig-r-peso" x="300" y="196" font-size="10" font-weight="600">na Terra</text>
