="146" x2="134" y2="153"/><line class="fig-chao-fino" x1="150" y1="146" x2="143" y2="153"/><line class="fig-chao-fino" x1="159" y1="146" x2="152" y2="153"/><line class="fig-chao-fino" x1="168" y1="146" x2="161" y2="153"/><rect class="fig-corpo" x="66" y="118" width="62" height="28" rx="2"/><text class="fig-texto" x="97" y="136" font-size="11" font-weight="400" text-anchor="middle">A  4 kg</text><line class="fig-v-normal" x1="97" y1="118" x2="97" y2="64" marker-end="url(#p-g6a-normal)"/><text class="fig-r-normal" x="104" y="68" font-size="13" font-weight="700">N</text><line class="fig-v-peso" x1="97" y1="146" x2="97" y2="198" marker-end="url(#p-g6a-peso)"/><text class="fig-r-peso" x="104" y="198" font-size="13" font-weight="700">P<tspan dy="4" font-size="0.75em">A</tspan><tspan dy="-4"></tspan></text><line class="fig-v-tracao" x1="128" y1="132" x2="178" y2="132" marker-end="url(#p-g6a-tracao)"/><text class="fig-r-tracao" x="182" y="137" font-size="13" font-weight="700">T</text><line class="fig-v-atrito" x1="66" y1="132" x2="26" y2="132" marker-end="url(#p-g6a-atrito)"/><text class="fig-r-atrito" x="20" y="123" font-size="13" font-weight="700">f<tspan dy="4" font-size="0.75em">at</tspan><tspan dy="-4"></tspan></text><rect class="fig-corpo" x="258" y="110" width="58" height="30" rx="2"/><text class="fig-texto" x="287" y="129" font-size="11" font-weight="400" text-anchor="middle">B  6 kg</text><line class="fig-v-tracao" x1="287" y1="110" x2="287" y2="56" marker-end="url(#p-g6a-tracao)"/><text class="fig-r-tracao" x="294" y="60" font-size="13" font-weight="700">T</text><line class="fig-v-peso" x1="287" y1="140" x2="287" y2="196" marker-end="url(#p-g6a-peso)"/><text class="fig-r-peso" x="294" y="196" font-size="13" font-weight="700">P<tspan dy="4" font-size="0.75em">B</tspan><tspan dy="-4"></tspan></text><text class="fig-rotulo" x="288" y="216" font-size="10" font-weight="400" text-anchor="middle" font-style="italic">as duas trações têm o mesmo módulo</text>
