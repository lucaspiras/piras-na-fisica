rito)"/><text class="fig-r-atrito" x="172" y="93.25" font-size="13" font-weight="700">f<tspan dy="4" font-size="0.75em">at</tspan><tspan dy="-4"></tspan> = 20 N</text><text class="fig-texto" x="174" y="228" font-size="11" font-weight="400" text-anchor="middle" font-style="italic">o atrito sobe a rampa, contra o movimento</text>
