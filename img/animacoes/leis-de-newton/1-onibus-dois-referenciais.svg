<?xml version="1.0" encoding="UTF-8"?>
<!-- A mesma cena do onibus que arranca, vista da calcada e vista de dentro.
     Autossuficiente: pode ser aberto direto no navegador, usado em <img src>,
     inserido em slide ou importado em editor vetorial.
     Fonte da geometria: atividades/estudos_dirigidos/dinamica/ed_leis_newton/index.html
     Gerado por scripts/extrair-figuras-eds.ps1 — nao editar a mao. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="1520" height="600"
     role="img" aria-labelledby="leis-de-newton-1-onibus-dois-referenciais">
  <title id="leis-de-newton-1-onibus-dois-referenciais">Dois painéis com o mesmo ônibus urbano em corte, visto de lado, com bancos, janelas e a barra do teto. O ônibus arranca e uma sacola pendurada na barra se inclina para trás. No painel da calçada, um referencial inercial, a seta mostra a aceleração do ônibus e a sacola apenas mantém a velocidade que já tinha. No painel de dentro do ônibus, um referencial não inercial, aparece uma seta pontilhada para trás, rotulada força que não existe e marcada com um xis.</title>
  <style><![CDATA[
    svg {
      --fig-superficie:  #f1f5f9;
      --fig-superficie-2:#f8fafc;
      --fig-corpo:       #f1f5f9;
      --fig-corpo-b:     #334155;
      --fig-apoio:       #64748b;
      --fig-guia:        #cbd5e1;
      --fig-divisor:     #e2e8f0;
      --fig-texto:       #334155;
      --fig-rotulo:      #64748b;
      --fig-peso:        #9333ea;
      --fig-peso-suave:  #faf5ff;
      --fig-normal:      #16a34a;
      --fig-normal-suave:#f0fdf4;
      --fig-atrito:      #ea580c;
      --fig-aplicada:    #ef4444;
      --fig-tracao:      #0e7490;
      --fig-ok:          #15803d;
      --fig-ok-suave:    #dcfce7;
      --fig-alerta:      #a16207;
      --fig-alerta-suave:#fef3c7;
      --fig-erro:        #dc2626;
      --fig-cinza:       #94a3b8;
      --fig-cinetico:    #c2410c;
      --fig-onibus:      #f0c33c;
      --fig-onibus-i:    #fbf3dd;
      --fig-vidro:       #bfe0f2;
      --fig-banco:       #7286a0;
      --fig-pneu:        #2a3342;
      --fig-calota:      #9aa3af;
      --fig-poste:       #7d8590;
      --fig-asfalto:     #9aa1a9;
      --fig-barra:       #b9803a;
      --fig-contorno:    #2a3342;
      --fig-fonte-m:     'Space Mono', ui-monospace, monospace;
      --fig-fonte-t:     'Poppins', system-ui, sans-serif;
    }


    /* estruturas */
    .fig-chao      { fill: none; stroke: var(--fig-apoio);   stroke-width: 3; }
    .fig-chao-fino { fill: none; stroke: var(--fig-guia);    stroke-width: 2; }
    .fig-corpo     { fill: var(--fig-corpo);      stroke: var(--fig-corpo-b); stroke-width: 2; }
    .fig-corpo-2   { fill: var(--fig-divisor);    stroke: var(--fig-apoio);   stroke-width: 1.5; }
    .fig-rampa     { fill: var(--fig-superficie-2); stroke: var(--fig-apoio); stroke-width: 2.5; }
    .fig-haste     { fill: none; stroke: var(--fig-corpo-b); stroke-width: 2; }
    .fig-divisor   { fill: none; stroke: var(--fig-divisor); stroke-width: 2; stroke-dasharray: 5 4; }
    .fig-guia      { fill: none; stroke: var(--fig-guia);    stroke-width: 1.5; stroke-dasharray: 5 4; }
    .fig-eixo      { fill: none; stroke: var(--fig-texto);   stroke-width: 2; }
    .fig-eixo-p    { fill: var(--fig-texto); }
    .fig-cerca     { fill: none; stroke: var(--fig-erro);    stroke-width: 2; stroke-dasharray: 6 4; }

    /* caixas de apoio */
    .fig-caixa-normal { fill: var(--fig-normal-suave); stroke: var(--fig-normal); stroke-width: 1.5; }
    .fig-caixa-peso   { fill: var(--fig-peso-suave);   stroke: var(--fig-peso);   stroke-width: 1.5; }
    .fig-zona-ok      { fill: var(--fig-ok);      opacity: .05; }
    .fig-zona-cin     { fill: var(--fig-cinetico); opacity: .05; }

    /* vetores — traço e ponta seguem a mesma grandeza */
    .fig-v-peso     { fill: none; stroke: var(--fig-peso);     stroke-width: 3; }
    .fig-v-normal   { fill: none; stroke: var(--fig-normal);   stroke-width: 3; }
    .fig-v-atrito   { fill: none; stroke: var(--fig-atrito);   stroke-width: 3; }
    .fig-v-aplicada { fill: none; stroke: var(--fig-aplicada); stroke-width: 3; }
    .fig-v-tracao   { fill: none; stroke: var(--fig-tracao);   stroke-width: 3; }
    .fig-v-fantasma { fill: none; stroke: var(--fig-cinza);    stroke-width: 3; stroke-dasharray: 4 3; }
    .fig-p-peso     { fill: var(--fig-peso); }
    .fig-p-normal   { fill: var(--fig-normal); }
    .fig-p-atrito   { fill: var(--fig-atrito); }
    .fig-p-aplicada { fill: var(--fig-aplicada); }
    .fig-p-tracao   { fill: var(--fig-tracao); }
    .fig-p-fantasma { fill: var(--fig-cinza); }

    /* curva do gráfico de atrito */
    .fig-curva-est { fill: none; stroke: var(--fig-ok);       stroke-width: 3.5; }
    .fig-curva-cin { fill: none; stroke: var(--fig-cinetico); stroke-width: 3.5; }
    .fig-curva-sal { fill: none; stroke: var(--fig-cinetico); stroke-width: 3.5; stroke-dasharray: 6 4; }
    .fig-no-est    { fill: var(--fig-ok); }
    .fig-no-cin    { fill: var(--fig-cinetico); }

    /* corpos coloridos */
    .fig-obj-ok     { fill: var(--fig-ok-suave);     stroke: var(--fig-ok);     stroke-width: 2; }
    .fig-obj-alerta { fill: var(--fig-alerta-suave); stroke: var(--fig-alerta); stroke-width: 2; }

    /* ônibus urbano em corte (figura dos referenciais inerciais) */
    .fig-asfalto   { fill: var(--fig-asfalto); }
    .fig-onibus    { fill: var(--fig-onibus); }
    .fig-onibus-i  { fill: var(--fig-onibus-i); }
    .fig-onibus-b  { fill: none; stroke: var(--fig-contorno); stroke-width: 2; stroke-linejoin: round; }
    .fig-vidro     { fill: var(--fig-vidro); }
    .fig-banco     { fill: var(--fig-banco); }
    .fig-barra     { fill: none; stroke: var(--fig-barra); stroke-width: 2.4; stroke-linecap: round; }
    .fig-piso      { fill: none; stroke: var(--fig-contorno); stroke-width: 1.6; }
    .fig-pneu      { fill: var(--fig-pneu); }
    .fig-calota    { fill: var(--fig-calota); }
    .fig-poste     { fill: var(--fig-poste); }
    .fig-alca-ok     { fill: none; stroke: var(--fig-ok);     stroke-width: 2; }
    .fig-alca-alerta { fill: none; stroke: var(--fig-alerta); stroke-width: 2; }
    .fig-caixa-alerta { fill: var(--fig-alerta-suave); }

    /* textos */
    .fig-t         { font-family: var(--fig-fonte-t); font-size: 11px;   fill: var(--fig-texto); }
    .fig-t-rot     { font-family: var(--fig-fonte-t); font-size: 10px;   fill: var(--fig-rotulo); }
    .fig-t-nota    { font-family: var(--fig-fonte-t); font-size: 11.5px; font-weight: 600; fill: var(--fig-texto); }
    .fig-m         { font-family: var(--fig-fonte-m); font-size: 12px;   fill: var(--fig-texto); }
    .fig-m-peq     { font-family: var(--fig-fonte-m); font-size: 11px;   fill: var(--fig-rotulo); }
    .fig-tit       { font-family: var(--fig-fonte-m); font-size: 12px;   font-weight: 700; fill: var(--fig-ok); }
    .fig-tit-alerta{ font-family: var(--fig-fonte-m); font-size: 12px;   font-weight: 700; fill: var(--fig-alerta); }
    .fig-tit-erro  { font-family: var(--fig-fonte-m); font-size: 12px;   font-weight: 700; fill: var(--fig-erro); }
    .fig-r-peso    { font-family: var(--fig-fonte-m); font-size: 12px;   font-weight: 700; fill: var(--fig-peso); }
    .fig-r-normal  { font-family: var(--fig-fonte-m); font-size: 12px;   font-weight: 700; fill: var(--fig-normal); }
    .fig-r-atrito  { font-family: var(--fig-fonte-m); font-size: 12px;   font-weight: 700; fill: var(--fig-atrito); }
    .fig-r-aplicada{ font-family: var(--fig-fonte-m); font-size: 12px;   font-weight: 700; fill: var(--fig-aplicada); }
    .fig-r-tracao  { font-family: var(--fig-fonte-m); font-size: 12px;   font-weight: 700; fill: var(--fig-tracao); }
    .fig-r-ok      { font-family: var(--fig-fonte-m); font-size: 12px;   font-weight: 700; fill: var(--fig-ok); }
    .fig-r-cin     { font-family: var(--fig-fonte-m); font-size: 12px;   font-weight: 700; fill: var(--fig-cinetico); }
    .fig-r-erro    { font-family: var(--fig-fonte-m); font-size: 15px;   font-weight: 700; fill: var(--fig-erro); }
    .fig-peq       { font-size: 9.5px; }
    .fig-med       { font-size: 11.5px; }
    .fig-nota-ok     { fill: var(--fig-ok); }
    .fig-nota-alerta { fill: var(--fig-alerta); }
    .fig-nota-erro   { fill: var(--fig-erro); }

    /* Quem abrir o arquivo com o sistema no modo escuro ve a versao noturna.
       Embutido aqui porque o .svg carregado como imagem e um documento a
       parte e nao enxerga o data-theme da pagina. */
    @media (prefers-color-scheme: dark) {
      svg {
        --fig-superficie:  #1e293b;
        --fig-superficie-2:#172033;
        --fig-corpo:       #1e293b;
        --fig-corpo-b:     #cbd5e1;
        --fig-apoio:       #94a3b8;
        --fig-guia:        #475569;
        --fig-divisor:     #334155;
        --fig-texto:       #e2e8f0;
        --fig-rotulo:      #94a3b8;
        --fig-peso:        #c084fc;
        --fig-peso-suave:  #2e1065;
        --fig-normal:      #4ade80;
        --fig-normal-suave:#052e16;
        --fig-atrito:      #fb923c;
        --fig-aplicada:    #f87171;
        --fig-tracao:      #22d3ee;
        --fig-ok:          #4ade80;
        --fig-ok-suave:    #14532d;
        --fig-alerta:      #fbbf24;
        --fig-alerta-suave:#451a03;
        --fig-erro:        #f87171;
        --fig-cinza:       #64748b;
        --fig-cinetico:    #fb923c;
        --fig-onibus:      #c9a032;
        --fig-onibus-i:    #2b2a22;
        --fig-vidro:       #24485e;
        --fig-banco:       #3f4d61;
        --fig-pneu:        #0b0f16;
        --fig-calota:      #6b7280;
        --fig-poste:       #4b5563;
        --fig-asfalto:     #2c3138;
        --fig-barra:       #8a5f2b;
        --fig-contorno:    #0b0f16;
      }
    }
  ]]></style>
  <defs>
    <marker id="nl1-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path class="fig-p-aplicada" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="nl1-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path class="fig-p-fantasma" d="M0,0 L10,5 L0,10 z"/>
    </marker>

    <!-- Ônibus urbano em corte, desenhado uma vez e usado nos dois painéis.
         Origem no canto superior esquerdo da carroceria; as rodas descem até y = 108. -->
    <g id="ln-onibus">
      <rect class="fig-onibus" x="0" y="0" width="280" height="92" rx="15"/>
      <rect class="fig-onibus-i" x="7" y="7" width="266" height="71" rx="10"/>
      <rect class="fig-vidro" x="14" y="20" width="38" height="28" rx="4"/>
      <rect class="fig-vidro" x="60" y="20" width="38" height="28" rx="4"/>
      <rect class="fig-vidro" x="106" y="20" width="38" height="28" rx="4"/>
      <rect class="fig-vidro" x="152" y="20" width="38" height="28" rx="4"/>
      <rect class="fig-vidro" x="198" y="20" width="38" height="28" rx="4"/>
      <rect class="fig-vidro" x="248" y="20" width="24" height="40" rx="4"/>
      <path class="fig-barra" d="M18,14 L260,14"/>
      <rect class="fig-banco" x="16" y="52" width="5" height="26" rx="2"/>
      <rect class="fig-banco" x="21" y="66" width="17" height="12" rx="2"/>
      <rect class="fig-banco" x="52" y="52" width="5" height="26" rx="2"/>
      <rect class="fig-banco" x="57" y="66" width="17" height="12" rx="2"/>
      <rect class="fig-banco" x="88" y="52" width="5" height="26" rx="2"/>
      <rect class="fig-banco" x="93" y="66" width="17" height="12" rx="2"/>
      <line class="fig-piso" x1="7" y1="78" x2="273" y2="78"/>
      <rect class="fig-onibus-b" x="0" y="0" width="280" height="92" rx="15"/>
      <circle class="fig-pneu" cx="65" cy="94" r="14"/>
      <circle class="fig-calota" cx="65" cy="94" r="6"/>
      <circle class="fig-pneu" cx="215" cy="94" r="14"/>
      <circle class="fig-calota" cx="215" cy="94" r="6"/>
    </g>
  </defs>

  <!-- ============ PAINEL A — da calçada ============ -->
  <text class="fig-tit" x="16" y="26">DA CALÇADA · referencial inercial</text>

  <rect class="fig-asfalto" x="8" y="204" width="356" height="26"/>
  <line class="fig-chao" x1="8" y1="204" x2="364" y2="204"/>
  <rect class="fig-poste" x="14" y="152" width="4" height="52" rx="1.5"/>
  <rect class="fig-poste" x="8" y="148" width="16" height="5" rx="2"/>
  <rect class="fig-poste" x="340" y="152" width="4" height="52" rx="1.5"/>
  <rect class="fig-poste" x="334" y="148" width="16" height="5" rx="2"/>

  <use href="#ln-onibus" x="28" y="96"/>

  <!-- aceleração do ônibus -->
  <line class="fig-v-aplicada" x1="200" y1="76" x2="300" y2="76" marker-end="url(#nl1-red)"/>
  <text class="fig-r-aplicada fig-med" x="200" y="64">a do ônibus</text>

  <!-- sacola pendurada na barra, inclinada para trás -->
  <line class="fig-guia" x1="224" y1="110" x2="224" y2="172"/>
  <g transform="translate(224,110) rotate(16)">
    <line class="fig-haste" x1="0" y1="0" x2="0" y2="31"/>
    <path class="fig-alca-ok" d="M-7,31 q7,-10 14,0"/>
    <path class="fig-obj-ok" d="M-11,31 L11,31 L13.5,53 L-13.5,53 Z"/>
  </g>

  <text class="fig-t-nota" x="16" y="256">Da calçada, a sacola só mantém a velocidade que já tinha.</text>

  <!-- divisor -->
  <line class="fig-divisor" x1="380" y1="14" x2="380" y2="286"/>

  <!-- ============ PAINEL B — de dentro ============ -->
  <text class="fig-tit-alerta" x="396" y="26">DE DENTRO · referencial NÃO inercial</text>

  <rect class="fig-asfalto" x="396" y="204" width="356" height="26"/>
  <line class="fig-chao" x1="396" y1="204" x2="752" y2="204"/>
  <rect class="fig-poste" x="402" y="152" width="4" height="52" rx="1.5"/>
  <rect class="fig-poste" x="396" y="148" width="16" height="5" rx="2"/>
  <rect class="fig-poste" x="728" y="152" width="4" height="52" rx="1.5"/>
  <rect class="fig-poste" x="722" y="148" width="16" height="5" rx="2"/>

  <use href="#ln-onibus" x="416" y="96"/>

  <!-- sacola pendurada na barra, inclinada para trás -->
  <line class="fig-guia" x1="612" y1="110" x2="612" y2="172"/>
  <g transform="translate(612,110) rotate(16)">
    <line class="fig-haste" x1="0" y1="0" x2="0" y2="31"/>
    <path class="fig-alca-alerta" d="M-7,31 q7,-10 14,0"/>
    <path class="fig-obj-alerta" d="M-11,31 L11,31 L13.5,53 L-13.5,53 Z"/>
  </g>

  <!-- pseudo-força -->
  <line class="fig-v-fantasma" x1="584" y1="152" x2="548" y2="152" marker-end="url(#nl1-gray)"/>
  <rect class="fig-caixa-alerta" x="472" y="127" width="70" height="32" rx="5"/>
  <text class="fig-m-peq fig-peq" x="507" y="140" text-anchor="middle">força que</text>
  <text class="fig-m-peq fig-peq" x="507" y="153" text-anchor="middle">não existe</text>
  <text class="fig-r-erro" x="558" y="172">✗</text>

  <text class="fig-t-nota" x="396" y="256">De dentro, inventamos uma força que nenhum corpo exerce.</text>
</svg>
