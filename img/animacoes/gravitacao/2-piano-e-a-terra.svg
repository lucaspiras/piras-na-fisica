<!-- Piano acima do horizonte curvo da Terra, com o peso apontando para o centro do planeta.
     Autossuficiente: pode ser aberto direto no navegador, usado em <img src>,
     inserido em slide ou importado em editor vetorial.
     Fonte da geometria: disciplinas/fisica_1_mecanica/apresentacoes/forcas-newton/index.html
     Gerado por scripts/extrair-figuras-paginas.ps1 — nao editar a mao. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 300" width="940" height="600"
     role="img" aria-labelledby="gravitacao-2-piano-e-a-terra">
  <title id="gravitacao-2-piano-e-a-terra">Um piano de cauda, visto de perfil e com o tampo levantado, apoiado em três pés iguais, suspenso acima do horizonte curvo da Terra. Abaixo do piano, uma seta vermelha vertical aponta para o solo, rotulada P igual a m vezes g, e segue em linha tracejada para dentro do planeta, na direção do centro. O planeta aparece em corte, com oceano, continentes e uma faixa de atmosfera sobre o horizonte.</title>
