<?xml version="1.0" encoding="UTF-8"?>
<!-- Sol e Terra se atraindo: o par de setas tem o mesmo tamanho nos dois corpos.
     Autossuficiente: pode ser aberto direto no navegador, usado em <img src>,
     inserido em slide ou importado em editor vetorial.
     Fonte da geometria: disciplinas/fisica_1_mecanica/apresentacoes/forcas-newton/index.html
     Gerado por scripts/extrair-figuras-paginas.ps1 — nao editar a mao. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 300" width="940" height="600"
     role="img" aria-labelledby="gravitacao-1-sol-e-terra-se-atraem">
  <title id="gravitacao-1-sol-e-terra-se-atraem">O Sol, grande, à esquerda, e a Terra, pequena, à direita. Uma seta parte do Sol na direção da Terra e outra parte da Terra na direção do Sol; as duas têm o mesmo comprimento e estão rotuladas F g, porque as duas forças do par têm o mesmo módulo. Embaixo, uma cota marca a distância d entre os centros.</title>
  <style><![CDATA[
    svg {
      --figa-sol:          #F4A024;
      --figa-sol-halo:     #FBE3BB;
      --figa-terra:        #144E96;
      --figa-terra-claro:  #3D86DB;
      --figa-terra-borda:  #0C3A73;
      --figa-atmosfera:    #9CC6F2;
      --figa-continente:   #2F9E5E;
      --figa-continente-2: #57BE7E;
      --figa-contorno:     #16171A;
      --figa-vetor:        #B3261E;
      --figa-guia:         #A8ABB2;
      --figa-texto:        #16171A;
      --figa-rotulo:       #54565C;
      --figa-rotulo-claro: #EAF1FC;
      --figa-piano:        #1B1D22;
      --figa-piano-2:      #33363E;
      --figa-piano-luz:    #4A4E58;
      --figa-teclas:       #F7F6F2;
      --figa-lua:          #C9CCD4;
      --figa-cratera:      #A2A6AE;
      --figa-caixa:        #E0BE8E;
      --figa-caixa-b:      #8A6234;
      --figa-apoio:        #54565C;
      --figa-hachura:      #A8ABB2;
      --figa-bloco:        #DBEAFE;
      --figa-bloco-b:      #3B82F6;
      --figa-rampa:        #EDEFF2;
      --figa-peso:         #9333EA;
      --figa-normal:       #16A34A;
      --figa-atrito:       #C2410C;
      /* declaradas aqui, e não herdadas do deck, porque o .svg avulso gerado a
         partir desta seção leva a paleta e mais nada */
      --figa-fonte-t:    'IBM Plex Sans', system-ui, sans-serif;
      --figa-fonte-m:    'IBM Plex Mono', ui-monospace, monospace;
    }

    /* Quem abrir o arquivo com o sistema no modo escuro ve a versao noturna.
       Embutido aqui porque o .svg carregado como imagem e um documento a
       parte e nao enxerga o data-theme da pagina. */
    @media (prefers-color-scheme: dark) {
      svg {
        --figa-sol:          #F4B95A;
        --figa-sol-halo:     #4A3A1C;
        --figa-terra:        #0B2F5E;
        --figa-terra-claro:  #2A6BB8;
        --figa-terra-borda:  #7FAEE4;
        --figa-atmosfera:    #4E7CB4;
        --figa-continente:   #2E8B57;
        --figa-continente-2: #46A96C;
        --figa-contorno:     #E6E7EA;
        --figa-vetor:        #F87171;
        --figa-guia:         #6B7280;
        --figa-texto:        #E6E7EA;
        --figa-rotulo:       #A8ABB2;
        --figa-rotulo-claro: #EAF1FC;
        --figa-piano:        #0B0C0E;
        --figa-piano-2:      #23252B;
        --figa-piano-luz:    #3C4049;
        --figa-teclas:       #E8E6E0;
        --figa-lua:          #8B909A;
        --figa-cratera:      #6B7078;
        --figa-caixa:        #7A5A31;
        --figa-caixa-b:      #D2AE79;
        --figa-apoio:        #A8ABB2;
        --figa-hachura:      #6B7280;
        --figa-bloco:        #1E3A5F;
        --figa-bloco-b:      #60A5FA;
        --figa-rampa:        #1E293B;
        --figa-peso:         #C084FC;
        --figa-normal:       #4ADE80;
        --figa-atrito:       #FB923C;
      }
    }

    .fga-sol        { fill: var(--figa-sol); stroke: var(--figa-contorno); stroke-width: 3; }
    .fga-halo       { fill: none; stroke: var(--figa-sol-halo); stroke-width: 10; }
    .fga-raio       { fill: none; stroke: var(--figa-sol); stroke-width: 5; stroke-linecap: round; }
    .fga-terra      { fill: var(--figa-terra); stroke: var(--figa-contorno); stroke-width: 3; }
    .fga-continente { fill: var(--figa-continente); }
    .fga-oc-raso    { stop-color: var(--figa-terra-claro); }
    .fga-oc-fundo   { stop-color: var(--figa-terra); }
    .fga-cont       { fill: var(--figa-continente); }
    .fga-cont-luz   { fill: var(--figa-continente-2); }
    .fga-crosta     { fill: none; stroke: var(--figa-terra-borda); stroke-width: 3; }
    .fga-lua        { fill: var(--figa-lua); stroke: var(--figa-contorno); stroke-width: 2.5; }
    .fga-cratera    { fill: var(--figa-cratera); }
    .fga-centro     { fill: var(--figa-teclas); stroke: var(--figa-contorno); stroke-width: 1.5; }
    .fga-caixa      { fill: var(--figa-caixa); stroke: var(--figa-caixa-b); stroke-width: 2.5; }
    .fga-ripa       { fill: none; stroke: var(--figa-caixa-b); stroke-width: 2; }
    .fga-chao       { fill: none; stroke: var(--figa-apoio); stroke-width: 3; stroke-linecap: round; }
    .fga-hachura    { fill: none; stroke: var(--figa-hachura); stroke-width: 1.6; }
    .fga-bloco      { fill: var(--figa-bloco); stroke: var(--figa-bloco-b); stroke-width: 2.5; }
    .fga-rampa      { fill: var(--figa-rampa); stroke: var(--figa-apoio); stroke-width: 2.5; stroke-linejoin: round; }
    .fga-ang        { fill: none; stroke: var(--figa-atrito); stroke-width: 1.8; }
    .fga-v-peso     { fill: none; stroke: var(--figa-peso); stroke-width: 4; }
    .fga-v-normal   { fill: none; stroke: var(--figa-normal); stroke-width: 4; }
    .fga-v-atrito   { fill: none; stroke: var(--figa-atrito); stroke-width: 4; }
    .fga-v-forca    { fill: none; stroke: var(--figa-vetor); stroke-width: 4; }
    .fga-p-peso     { fill: var(--figa-peso); }
    .fga-p-normal   { fill: var(--figa-normal); }
    .fga-p-atrito   { fill: var(--figa-atrito); }
    .fga-m-peso     { font-family: var(--figa-fonte-m); font-size: 19px; font-weight: 700; fill: var(--figa-peso); }
    .fga-m-normal   { font-family: var(--figa-fonte-m); font-size: 19px; font-weight: 700; fill: var(--figa-normal); }
    .fga-m-atrito   { font-family: var(--figa-fonte-m); font-size: 19px; font-weight: 700; fill: var(--figa-atrito); }
    .fga-tit        { font-family: var(--figa-fonte-t); font-size: 19px; font-weight: 700; fill: var(--figa-texto); }
    .fga-rel        { font-family: var(--figa-fonte-m); font-size: 20px; font-weight: 700; fill: var(--figa-texto); }
    .fga-cota-t     { font-family: var(--figa-fonte-m); font-size: 18px; font-weight: 700; fill: var(--figa-rotulo); }
    .fga-atm        { fill: none; stroke: var(--figa-atmosfera); stroke-width: 12; opacity: .55; }
    .fga-guia       { fill: none; stroke: var(--figa-guia); stroke-width: 2; stroke-dasharray: 7 6; }
    .fga-cota       { fill: none; stroke: var(--figa-guia); stroke-width: 2; }
    .fga-vetor      { fill: none; stroke: var(--figa-vetor); stroke-width: 5; }
    .fga-ponta      { fill: var(--figa-vetor); }
    .fga-piano      { fill: var(--figa-piano); stroke: var(--figa-contorno); stroke-width: 2.5; }
    .fga-piano-2    { fill: var(--figa-piano-2); stroke: var(--figa-contorno); stroke-width: 2.5; }
    .fga-piano-luz  { fill: var(--figa-piano-luz); }
    .fga-haste      { fill: none; stroke: var(--figa-piano-luz); stroke-width: 4; stroke-linecap: round; }
    .fga-teclas     { fill: var(--figa-teclas); stroke: var(--figa-contorno); stroke-width: 2.5; }
    .fga-tecla-p    { fill: var(--figa-piano); }
    .fga-t          { font-family: var(--figa-fonte-t); font-size: 20px; font-weight: 600; fill: var(--figa-texto); }
    .fga-rot        { font-family: var(--figa-fonte-t); font-size: 17px; fill: var(--figa-rotulo); }
    .fga-rot-claro  { font-family: var(--figa-fonte-t); font-size: 17px; fill: var(--figa-rotulo-claro); }
    .fga-m          { font-family: var(--figa-fonte-m); font-size: 20px; font-weight: 500; fill: var(--figa-vetor); }
    .fga-mg         { font-family: var(--figa-fonte-m); font-size: 19px; font-weight: 500; fill: var(--figa-rotulo); }
  ]]></style>
  <defs>
    <marker id="fga-seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
                <path class="fga-ponta" d="M0,0 L10,5 L0,10 z"/>
              </marker>
  </defs>
  <circle class="fga-halo" cx="86" cy="140" r="66"/>
  <path class="fga-raio" d="M86,44 L86,28 M18,140 L2,140 M38,92 L26,80 M38,188 L26,200 M134,92 L146,80 M134,188 L146,200 M86,236 L86,252"/>
