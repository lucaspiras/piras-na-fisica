  <animate attributeName="cy" dur="6s" values="78;85.5;108.1;145.7;198.3;266;266" keyTimes="0;0.12;0.24;0.36;0.48;0.6;1" calcMode="linear" repeatCount="indefinite"/>
  </circle>
