<?xml version="1.0" encoding="UTF-8"?>
<!-- Bateria de 12 V alimentando dois resistores em serie, de 20 e 40 ohms.
     Autossuficiente: pode ser aberto direto no navegador, usado em <img src>,
     inserido em slide ou importado em editor vetorial.
     Fonte da geometria: atividades/listas/circuitos/lista_3_associacao_resistores.html
