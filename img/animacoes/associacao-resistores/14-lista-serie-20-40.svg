  <title id="associacao-resistores-14-lista-serie-20-40">Circuito de malha única. Uma bateria de doze volts, à esquerda, alimenta dois resistores ligados um depois do outro no fio de cima: R1, de vinte ohms, e R2, de quarenta ohms.</title>
  <style><![CDATA[
    svg {
