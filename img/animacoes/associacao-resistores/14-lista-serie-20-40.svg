    @media (prefers-color-scheme: dark) {
      svg {
        --fig-bloco:    #1e3a5f;
        --fig-bloco-b:  #60a5fa;
        --fig-bloco2:   #3b1f5e;
        --fig-bloco2-b: #c084fc;
        --fig-apoio:    #cbd5e1;
        --fig-hachura:  #64748b;
