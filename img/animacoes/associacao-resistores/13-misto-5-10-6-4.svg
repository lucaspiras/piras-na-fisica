<?xml version="1.0" encoding="UTF-8"?>
<!-- Circuito misto com um resistor de 5 ohms em série com um bloco paralelo formado por um resistor de 10 ohms e pelo ramo de 6 mais 4 ohms, alimentado por uma fonte de 20 volts.
     Autossuficiente: leva o proprio CSS, sem buscar fonte, folha de estilo ou
     script na rede. Pode ser aberto direto no navegador, usado em <img src>,
     inserido em slide ou importado em editor vetorial.
     Fonte da geometria: disciplinas/eletricidade_basica/apresentacoes/associacao-de-resistores/index.html -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 380" width="1480" height="760"
     role="img" aria-labelledby="ar-titulo-13">
  <title id="ar-titulo-13">Circuito misto com um resistor de 5 ohms em série com um bloco paralelo formado por um resistor de 10 ohms e pelo ramo de 6 mais 4 ohms, alimentado por uma fonte de 20 volts.</title>
  <style><![CDATA[
    svg {
      /* Trocar qualquer uma destas retematiza o desenho sem editar o resto. */
      --ar-tinta:  #16171A;   /* fios, corpo dos simbolos               */
      --ar-corpo:  #ffffff;   /* preenchimento do retangulo do resistor */
      --ar-rotulo: #54565C;   /* valores e nomes dos componentes        */
      --ar-acento: #A16207;   /* setas de corrente e destaques          */
      --ar-acento2: #1E63F0;  /* segundo acento, do voltimetro          */
    }

    /* Sem retangulo de fundo: a figura e transparente e assume o fundo de
       quem a hospeda, seja slide, prova ou pagina. So o miolo do resistor e
       pintado, porque ali o branco e parte do simbolo e nao pano de fundo.
       Um .svg carregado como imagem e documento a parte e nao enxerga o
       data-theme do site, entao o tema escuro vem por media query do sistema. */
    @media (prefers-color-scheme: dark) {
      svg {
        --ar-tinta:  #E7E9EE;
        --ar-corpo:  #1E2027;
        --ar-rotulo: #A9ABB2;
        --ar-acento: #EAB308;
        --ar-acento2: #5FA0FF;
      }
    }
  ]]></style>
  <line x1="90" y1="90" x2="150" y2="90" stroke-width="6" stroke-linecap="round" style="stroke:var(--ar-tinta)"/>
  <line x1="240" y1="90" x2="620" y2="90" stroke-width="6" stroke-linecap="round" style="stroke:var(--ar-tinta)"/>
  <line x1="90" y1="310" x2="620" y2="310" stroke-width="6" stroke-linecap="round" style="stroke:var(--ar-tinta)"/>
  <line x1="90" y1="90" x2="90" y2="170" stroke-width="6" stroke-linecap="round" style="stroke:var(--ar-tinta)"/>
  <line x1="90" y1="230" x2="90" y2="310" stroke-width="6" stroke-linecap="round" style="stroke:var(--ar-tinta)"/>
  <line x1="75" y1="180" x2="105" y2="180" stroke-width="4" style="stroke:var(--ar-tinta)"/>
  <line x1="80" y1="205" x2="100" y2="205" stroke-width="10" style="stroke:var(--ar-tinta)"/>
  <text x="30" y="240" font-family="IBM Plex Mono, monospace" font-size="20" style="fill:var(--ar-rotulo)">20 V</text>
  <rect x="150" y="72" width="90" height="36" rx="4" stroke-width="5" style="fill:var(--ar-corpo);stroke:var(--ar-tinta)"/>
  <text x="195" y="145" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="20" style="fill:var(--ar-rotulo)">R<tspan font-size="0.72em" baseline-shift="sub">1</tspan>=5Ω</text>
  <line x1="380" y1="90" x2="380" y2="150" stroke-width="6" stroke-linecap="round" style="stroke:var(--ar-tinta)"/>
  <line x1="380" y1="230" x2="380" y2="310" stroke-width="6" stroke-linecap="round" style="stroke:var(--ar-tinta)"/>
  <rect x="363" y="150" width="34" height="80" rx="4" stroke-width="5" style="fill:var(--ar-corpo);stroke:var(--ar-tinta)"/>
  <text x="380" y="345" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="20" style="fill:var(--ar-rotulo)">R<tspan font-size="0.72em" baseline-shift="sub">2</tspan>=10Ω</text>
  <line x1="620" y1="90" x2="620" y2="120" stroke-width="6" stroke-linecap="round" style="stroke:var(--ar-tinta)"/>
  <rect x="603" y="120" width="34" height="40" rx="4" stroke-width="5" style="fill:var(--ar-corpo);stroke:var(--ar-tinta)"/>
  <line x1="620" y1="160" x2="620" y2="230" stroke-width="6" stroke-linecap="round" style="stroke:var(--ar-tinta)"/>
  <rect x="603" y="230" width="34" height="40" rx="4" stroke-width="5" style="fill:var(--ar-corpo);stroke:var(--ar-tinta)"/>
  <line x1="620" y1="270" x2="620" y2="310" stroke-width="6" stroke-linecap="round" style="stroke:var(--ar-tinta)"/>
  <text x="655" y="145" font-family="IBM Plex Mono, monospace" font-size="20" style="fill:var(--ar-rotulo)">R<tspan font-size="0.72em" baseline-shift="sub">3</tspan>=6Ω</text>
  <text x="655" y="255" font-family="IBM Plex Mono, monospace" font-size="20" style="fill:var(--ar-rotulo)">R<tspan font-size="0.72em" baseline-shift="sub">4</tspan>=4Ω</text>
</svg>
