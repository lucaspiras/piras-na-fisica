<?xml version="1.0" encoding="UTF-8"?>
<!-- Circuito misto: o resistor R1 em série com a fonte, seguido de R2 e R3 ligados em paralelo entre os mesmos dois nós.
     Autossuficiente: leva o proprio CSS, sem buscar fonte, folha de estilo ou
     script na rede. Pode ser aberto direto no navegador, usado em <img src>,
     inserido em slide ou importado em editor vetorial.
     Fonte da geometria: disciplinas/eletricidade_basica/apresentacoes/associacao-de-resistores/index.html -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" width="1240" height="760"
     role="img" aria-labelledby="ar-titulo-10">
  <title id="ar-titulo-10">Circuito misto: o resistor R1 em série com a fonte, seguido de R2 e R3 ligados em paralelo entre os mesmos dois nós.</title>
  <style><![CDATA[
    svg {
      /* Trocar qualquer uma destas retematiza o desenho sem editar o resto. */
      --ar-tinta:  #16171A;   /* fios, corpo dos simbolos               */
      --ar-corpo:  #ffffff;   /* preenchimento do retangulo do resistor */
      --ar-rotulo: #54565C;   /* valores e nomes dos componentes        */
      --ar-acento: #A16207;   /* setas de corrente e destaques          */
    }

    /* Sem retangulo de fundo: a figura e transparente e assume o fundo de
       quem a hospeda, seja slide, prova ou pagina. So o miolo do resistor e
       pintado, porque ali o branco e parte do simbolo e nao pano de fundo.
       Um .svg carregado como imagem e documento a parte e nao enxerga o
       data-theme do site, entao o tema escuro vem por media query do sistema. */
    @media (prefers-color-scheme: dark) {
      svg {
        --ar-tinta:  #E7E9EE;
        --ar-corpo:  #1E2027;
        --ar-rotulo: #A9ABB2;
        --ar-acento: #EAB308;
      }
    }
  ]]></style>
  <line x1="90" y1="90" x2="150" y2="90" stroke-width="6" stroke-linecap="round" style="stroke:var(--ar-tinta)"/>
  <line x1="240" y1="90" x2="560" y2="90" stroke-width="6" stroke-linecap="round" style="stroke:var(--ar-tinta)"/>
  <line x1="90" y1="310" x2="560" y2="310" stroke-width="6" stroke-linecap="round" style="stroke:var(--ar-tinta)"/>
  <line x1="90" y1="90" x2="90" y2="170" stroke-width="6" stroke-linecap="round" style="stroke:var(--ar-tinta)"/>
  <line x1="90" y1="230" x2="90" y2="310" stroke-width="6" stroke-linecap="round" style="stroke:var(--ar-tinta)"/>
  <line x1="75" y1="180" x2="105" y2="180" stroke-width="4" style="stroke:var(--ar-tinta)"/>
  <line x1="80" y1="205" x2="100" y2="205" stroke-width="10" style="stroke:var(--ar-tinta)"/>
  <rect x="150" y="72" width="90" height="36" rx="4" stroke-width="5" style="fill:var(--ar-corpo);stroke:var(--ar-tinta)"/>
  <text x="195" y="145" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="23" style="fill:var(--ar-rotulo)">R<tspan font-size="0.72em" baseline-shift="sub">1</tspan></text>
  <line x1="340" y1="90" x2="340" y2="150" stroke-width="6" stroke-linecap="round" style="stroke:var(--ar-tinta)"/>
  <line x1="340" y1="230" x2="340" y2="310" stroke-width="6" stroke-linecap="round" style="stroke:var(--ar-tinta)"/>
  <rect x="323" y="150" width="34" height="80" rx="4" stroke-width="5" style="fill:var(--ar-corpo);stroke:var(--ar-tinta)"/>
  <text x="340" y="345" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="23" style="fill:var(--ar-rotulo)">R<tspan font-size="0.72em" baseline-shift="sub">2</tspan></text>
  <line x1="560" y1="90" x2="560" y2="150" stroke-width="6" stroke-linecap="round" style="stroke:var(--ar-tinta)"/>
  <line x1="560" y1="230" x2="560" y2="310" stroke-width="6" stroke-linecap="round" style="stroke:var(--ar-tinta)"/>
  <rect x="543" y="150" width="34" height="80" rx="4" stroke-width="5" style="fill:var(--ar-corpo);stroke:var(--ar-tinta)"/>
  <text x="560" y="345" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="23" style="fill:var(--ar-rotulo)">R<tspan font-size="0.72em" baseline-shift="sub">3</tspan></text>
</svg>
