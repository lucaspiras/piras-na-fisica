<?xml version="1.0" encoding="UTF-8"?>
<!-- Animacao: a prancha vai subindo e a caixa escorrega quando o angulo passa do limiar.
     Autossuficiente: pode ser aberto direto no navegador, usado em <img src>,
     inserido em slide ou importado em editor vetorial.
     Fonte da geometria: disciplinas/fisica_1_mecanica/apresentacoes/forcas-newton/index.html
     Gerado por scripts/extrair-figuras-paginas.ps1 — nao editar a mao. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" width="840" height="500"
     role="img" aria-labelledby="forcas-27-rampa-que-inclina">
  <title id="forcas-27-rampa-que-inclina">Animação de uma prancha articulada numa dobradiça à esquerda. A prancha vai sendo levantada pela ponta direita, com uma caixa apoiada sobre ela; quando a inclinação passa de certo ângulo, a caixa escorrega de uma vez até a parte de baixo. A linha tracejada marca a horizontal, e o ângulo entre ela e a prancha é o theta da medida.</title>
