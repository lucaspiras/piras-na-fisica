<?xml version="1.0" encoding="UTF-8"?>
<!-- Corpo que cai de uma altura h e para numa deformacao d: a normal fica h/d vezes o peso.
     Autossuficiente: pode ser aberto direto no navegador, usado em <img src>,
     inserido em slide ou importado em editor vetorial.
     Fonte da geometria: disciplinas/fisica_1_mecanica/apresentacoes/forcas-newton/index.html
     Gerado por scripts/extrair-figuras-paginas.ps1 — nao editar a mao. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="640" height="600"
     role="img" aria-labelledby="forcas-15-normal-no-impacto">
  <title id="forcas-15-normal-no-impacto">Um corpo cai de uma altura h, marcada por uma cota alta à esquerda. Embaixo, o contorno tracejado mostra o corpo no instante em que toca o chão e o corpo cheio mostra o mesmo corpo já amassado; a diferença entre os dois é a distância de parada d, marcada por uma cota curta ao lado. A seta da normal é desenhada muito maior que a do peso.</title>
