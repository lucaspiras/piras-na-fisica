<?xml version="1.0" encoding="UTF-8"?>
<!-- Caminhonete em movimento com uma caixa solta sobre a carroceria.
     Autossuficiente: pode ser aberto direto no navegador, usado em <img src>,
     inserido em slide ou importado em editor vetorial.
     Fonte da geometria: atividades/listas/forcas/lista_2_atrito.html
     Gerado por scripts/extrair-figuras-paginas.ps1 — nao editar a mao. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" width="920" height="400"
     role="img" aria-labelledby="forcas-42-caixa-na-carroceria">
  <title id="forcas-42-caixa-na-carroceria">Caminhonete vista de lado, andando para a direita, com a cabine à frente. Sobre a carroceria horizontal, atrás da cabine, há uma caixa solta. Uma seta azul acima da cabine indica o sentido da velocidade.</title>
  <style><![CDATA[
    svg {
      --fig-bloco:    #dbeafe;
      --fig-bloco-b:  #3b82f6;
      --fig-bloco2:   #e9d5ff;
      --fig-bloco2-b: #9333ea;
      --fig-apoio:    #475569;
      --fig-hachura:  #94a3b8;
      --fig-rampa:    #f1f5f9;
      --fig-fio:      #334155;
      --fig-polia:    #cbd5e1;
      --fig-polia-b:  #475569;
      --fig-peso:     #9333ea;
      --fig-normal:   #16a34a;
      --fig-tracao:   #0e7490;
      --fig-forca:    #ef4444;
      --fig-angulo:   #c2410c;
      --fig-texto:    #1e293b;
      --fig-rotulo:   #64748b;
      --fig-guia:     #cbd5e1;
      --fig-cabine:   #f8fafc;
      --fig-pessoa:   #0f766e;
      --fig-balanca:  #e2e8f0;
      --fig-veloc:    #2563eb;
      --fig-atrito:   #db2777;
      /* declaradas aqui, e nao herdadas de --fonte, porque o .svg avulso
         gerado a partir desta seção leva a paleta e mais nada */
      --fig-fonte-t:  'DM Sans', system-ui, sans-serif;
      --fig-fonte-m:  'Space Mono', ui-monospace, monospace;
    }

    /* Quem abrir o arquivo com o sistema no modo escuro ve a versao noturna.
       Embutido aqui porque o .svg carregado como imagem e um documento a
       parte e nao enxerga o data-theme da pagina. */
    @media (prefers-color-scheme: dark) {
      svg {
        --fig-bloco:    #1e3a5f;
        --fig-bloco-b:  #60a5fa;
        --fig-bloco2:   #3b1f5e;
        --fig-bloco2-b: #c084fc;
        --fig-apoio:    #cbd5e1;
        --fig-hachura:  #64748b;
        --fig-rampa:    #1e293b;
        --fig-fio:      #cbd5e1;
        --fig-polia:    #475569;
        --fig-polia-b:  #cbd5e1;
        --fig-peso:     #c084fc;
        --fig-normal:   #4ade80;
        --fig-tracao:   #22d3ee;
        --fig-forca:    #f87171;
        --fig-angulo:   #fb923c;
        --fig-texto:    #e2e8f0;
        --fig-rotulo:   #94a3b8;
        --fig-guia:     #475569;
        --fig-cabine:   #172033;
        --fig-pessoa:   #5eead4;
        --fig-balanca:  #334155;
        --fig-veloc:    #60a5fa;
        --fig-atrito:   #f472b6;
      }
    }

    .fg-chao    { fill: none; stroke: var(--fig-apoio); stroke-width: 3; stroke-linecap: round; }
    .fg-hachura { fill: none; stroke: var(--fig-hachura); stroke-width: 1.5; }
    .fg-bloco   { fill: var(--fig-bloco); stroke: var(--fig-bloco-b); stroke-width: 2; }
    .fg-bloco2  { fill: var(--fig-bloco2); stroke: var(--fig-bloco2-b); stroke-width: 2; }
    .fg-rampa   { fill: var(--fig-rampa); stroke: var(--fig-apoio); stroke-width: 2.5; stroke-linejoin: round; }
    .fg-fio     { fill: none; stroke: var(--fig-fio); stroke-width: 2.5; stroke-linecap: round; }
    .fg-polia   { fill: var(--fig-polia); stroke: var(--fig-polia-b); stroke-width: 2; }
    .fg-eixo    { fill: var(--fig-polia-b); }
    .fg-guia    { fill: none; stroke: var(--fig-guia); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .fg-ang     { fill: none; stroke: var(--fig-angulo); stroke-width: 1.8; }
    .fg-cabine  { fill: var(--fig-cabine); stroke: var(--fig-apoio); stroke-width: 2.5; }
    .fg-balanca { fill: var(--fig-balanca); stroke: var(--fig-apoio); stroke-width: 2; }
    .fg-pessoa  { fill: var(--fig-pessoa); }
    .fg-membro  { fill: none; stroke: var(--fig-pessoa); stroke-width: 3.2; stroke-linecap: round; }
    .fg-fixo    { fill: none; stroke: var(--fig-apoio); stroke-width: 2; }
    .fg-v-peso   { fill: none; stroke: var(--fig-peso);   stroke-width: 2.5; }
    .fg-v-normal { fill: none; stroke: var(--fig-normal); stroke-width: 2.5; }
    .fg-v-tracao { fill: none; stroke: var(--fig-tracao); stroke-width: 2.5; }
    .fg-v-forca  { fill: none; stroke: var(--fig-forca);  stroke-width: 2.5; }
    .fg-v-veloc  { fill: none; stroke: var(--fig-veloc);  stroke-width: 2.5; }
    .fg-v-acel   { fill: none; stroke: var(--fig-angulo); stroke-width: 2.5; }
    .fg-v-atrito { fill: none; stroke: var(--fig-atrito); stroke-width: 2.5; }
    .fg-p-peso   { fill: var(--fig-peso); }
    .fg-p-normal { fill: var(--fig-normal); }
    .fg-p-tracao { fill: var(--fig-tracao); }
    .fg-p-forca  { fill: var(--fig-forca); }
    .fg-p-veloc  { fill: var(--fig-veloc); }
    .fg-p-acel   { fill: var(--fig-angulo); }
    .fg-p-atrito { fill: var(--fig-atrito); }
    .fg-t     { font-family: var(--fig-fonte-t); font-size: 12px; fill: var(--fig-texto); }
    .fg-rot   { font-family: var(--fig-fonte-t); font-size: 11px; fill: var(--fig-rotulo); }
    .fg-m     { font-family: var(--fig-fonte-m); font-size: 12px; font-weight: 700; fill: var(--fig-texto); }
    .fg-peso  { font-family: var(--fig-fonte-m); font-size: 12px; font-weight: 700; fill: var(--fig-peso); }
    .fg-norm  { font-family: var(--fig-fonte-m); font-size: 12px; font-weight: 700; fill: var(--fig-normal); }
    .fg-trac  { font-family: var(--fig-fonte-m); font-size: 12px; font-weight: 700; fill: var(--fig-tracao); }
    .fg-forc  { font-family: var(--fig-fonte-m); font-size: 12px; font-weight: 700; fill: var(--fig-forca); }
    .fg-angt  { font-family: var(--fig-fonte-m); font-size: 12px; font-weight: 700; fill: var(--fig-angulo); }
    .fg-vel   { font-family: var(--fig-fonte-m); font-size: 12px; font-weight: 700; fill: var(--fig-veloc); }
    .fg-atr   { font-family: var(--fig-fonte-m); font-size: 12px; font-weight: 700; fill: var(--fig-atrito); }
  ]]></style>
  <defs>
    <marker id="sv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
            <path class="fg-p-veloc" d="M0,0 L10,5 L0,10 z"/>
          </marker>
  </defs>
  <line class="fg-chao" x1="20" y1="170" x2="440" y2="170"/>
  <path class="fg-hachura" d="M30,170 L18,184 M60,170 L48,184 M90,170 L78,184 M120,170 L108,184 M150,170 L138,184 M180,170 L168,184 M210,170 L198,184 M240,170 L228,184 M270,170 L258,184 M300,170 L288,184 M330,170 L318,184 M360,170 L348,184 M390,170 L378,184 M420,170 L408,184"/>

  <rect class="fg-cabine" x="60" y="110" width="250" height="26" rx="3"/>
  <rect class="fg-cabine" x="310" y="66" width="80" height="70" rx="6"/>
  <rect class="fg-balanca" x="350" y="76" width="30" height="24" rx="3"/>

  <circle class="fg-polia" cx="110" cy="150" r="18"/>
  <circle class="fg-eixo" cx="110" cy="150" r="5"/>
  <circle class="fg-polia" cx="340" cy="150" r="18"/>
  <circle class="fg-eixo" cx="340" cy="150" r="5"/>

  <rect class="fg-bloco" x="160" y="76" width="60" height="34" rx="3"/>
  <text class="fg-t" x="190" y="98" text-anchor="middle">caixa</text>

  <line class="fg-v-veloc" x1="330" y1="40" x2="400" y2="40" marker-end="url(#sv)"/>
  <text class="fg-vel" x="360" y="32">v</text>

  <text class="fg-rot" x="20" y="197">carroceria horizontal · a caixa não está presa</text>
</svg>
