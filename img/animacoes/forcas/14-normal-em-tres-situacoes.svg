  <line class="fga-v-peso" x1="672" y1="154" x2="672" y2="206" marker-end="url(#fga-seta-p)"/>
  <text class="fga-m-peso" x="684" y="196">P</text>
  <text class="fga-rel" x="628" y="256" text-anchor="middle">N = F</text>
</svg>
