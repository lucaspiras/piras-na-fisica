<!-- Treno puxado na neve: a normal perpendicular ao contato e o atrito paralelo a ele.
     Autossuficiente: pode ser aberto direto no navegador, usado em <img src>,
     inserido em slide ou importado em editor vetorial.
     Fonte da geometria: disciplinas/fisica_1_mecanica/apresentacoes/forcas-newton/index.html
     Gerado por scripts/extrair-figuras-paginas.ps1 — nao editar a mao. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 290" width="920" height="580"
     role="img" aria-labelledby="forcas-20-o-que-e-o-atrito">
  <title id="forcas-20-o-que-e-o-atrito">Um trenó sobre a neve, puxado por uma corda que sobe para a direita. Do trenó saem quatro setas: a tração ao longo da corda, a normal para cima e perpendicular ao chão, o peso para baixo, e o atrito para trás, rente ao chão e paralelo a ele. Um pequeno símbolo de ângulo reto marca a perpendicularidade entre a normal e a superfície.</title>
