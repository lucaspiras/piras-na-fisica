  <title id="forcas-26-roda-travada-e-girando">Duas rodas sobre o chão. Na da esquerda, travada, um X marca que ela não gira, há marcas de derrapagem no chão e a seta do atrito é curta. Na da direita, girando, uma seta curva indica a rotação e a seta do atrito é visivelmente mais longa.</title>
