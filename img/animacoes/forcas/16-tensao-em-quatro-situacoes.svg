<!-- A tensao puxando em quatro arranjos de fio, com direcao e sentido em cada extremo.
     Autossuficiente: pode ser aberto direto no navegador, usado em <img src>,
     inserido em slide ou importado em editor vetorial.
     Fonte da geometria: disciplinas/fisica_1_mecanica/apresentacoes/forcas-newton/index.html
     Gerado por scripts/extrair-figuras-paginas.ps1 — nao editar a mao. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 275" width="2000" height="550"
     role="img" aria-labelledby="forcas-16-tensao-em-quatro-situacoes">
  <title id="forcas-16-tensao-em-quatro-situacoes">Quatro quadros com a força de tensão. No primeiro, um corpo pendurado no teto: a tensão puxa o corpo para cima e o teto para baixo, com setas de mesmo tamanho. No segundo, dois corpos ligados por um fio horizontal: a tensão puxa cada um na direção do outro. No terceiro, um fio que passa por uma polia na borda da mesa: a tensão puxa o bloco na horizontal e o corpo pendurado na vertical, com o mesmo valor. No quarto, um corpo sustentado por dois fios em ângulo: cada fio puxa na sua própria direção.</title>
