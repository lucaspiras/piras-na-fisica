    <rect x="112" y="212" width="56" height="19" fill="url(#rc-cobreV)"/>
    <rect x="112" y="235" width="56" height="38" fill="url(#rc-rotV)"/>
    <rect x="118" y="212" width="4" height="68" fill="#ffffff" opacity="0.22"/>
    <rect x="156" y="212" width="9" height="68" fill="#000000" opacity="0.26"/>
  </g>
  <rect x="112" y="212" width="56" height="68" rx="7" fill="none" stroke="#0d0e11" stroke-width="1.2"/>
  <text x="140" y="260" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="15" fill="#e8e3d8">1,5 V</text>
