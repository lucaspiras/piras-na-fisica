  <rect x="94" y="106" width="92" height="200" rx="13" fill="none" stroke="#07080a" stroke-width="1.5"/>
  <rect x="99" y="112" width="5" height="188" rx="2.5" fill="#ffffff" opacity="0.13"/>
  <rect x="104" y="116" width="72" height="180" rx="9" fill="url(#rc-poco)"/>
  <rect x="124" y="117" width="32" height="6" rx="2" fill="url(#rc-niquelV)"/>
  <path d="M118 199 L162 203 L118 207 L162 211" fill="none" stroke="url(#rc-niquelV)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
