  <rect x="133" y="123" width="14" height="8" rx="2" fill="url(#rc-niquelV)" stroke="#0d0e11" stroke-width="1"/>
  
  <clipPath id="rc-p2"><rect x="112" y="212" width="56" height="68" rx="7"/></clipPath>
  <g clip-path="url(#rc-p2)">
