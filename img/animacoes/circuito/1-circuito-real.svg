      <stop offset="0%" stop-color="#08090b"/><stop offset="100%" stop-color="#23272e"/>
    </linearGradient>
    <linearGradient id="rc-celV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#31343a"/><stop offset="13%" stop-color="#7d838d"/>
      <stop offset="33%" stop-color="#c6ccd4"/><stop offset="50%" stop-color="#9aa1ab"/>
      <stop offset="76%" stop-color="#575c65"/><stop offset="100%" stop-color="#26292e"/>
