  <path d="M140 100 C 140 76 156 70 184 70 L 330 70 C 372 70 384 104 388 150 C 391 190 396 218 404 231" fill="none" stroke="#cf2a2a" stroke-width="9.5" stroke-linecap="round"/>
  <path d="M140 100 C 140 76 156 70 184 70 L 330 70 C 372 70 384 104 388 150 C 391 190 396 218 404 231" fill="none" stroke="#ff9b9b" stroke-width="2.8" stroke-linecap="round" opacity="0.55" transform="translate(0,-2.6)"/>
  
  <path d="M140 312 C 140 336 156 342 184 342 L 232 342 M308 342 L 330 342 C 372 342 384 310 388 288 C 391 272 396 262 404 258" fill="none" stroke="#08090b" stroke-width="13" stroke-linecap="round"/>
  <path d="M140 312 C 140 336 156 342 184 342 L 232 342 M308 342 L 330 342 C 372 342 384 310 388 288 C 391 272 396 262 404 258" fill="none" stroke="#2a2d33" stroke-width="9.5" stroke-linecap="round"/>
  <path d="M140 312 C 140 336 156 342 184 342 L 232 342 M308 342 L 330 342 C 372 342 384 310 388 288 C 391 272 396 262 404 258" fill="none" stroke="#8a9099" stroke-width="2.8" stroke-linecap="round" opacity="0.55" transform="translate(0,-2.6)"/>

