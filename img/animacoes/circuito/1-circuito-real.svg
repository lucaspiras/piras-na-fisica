    <rect x="226" y="343" width="88" height="4" rx="2" fill="#ffffff" opacity="0.13"/>
    <rect x="234" y="320" width="13" height="22" rx="2" fill="url(#rc-cobreV)" stroke="#6b4314" stroke-width="1"/>
    <rect x="296" y="320" width="13" height="22" rx="2" fill="url(#rc-cobreV)" stroke="#6b4314" stroke-width="1"/>
    <g class="chave-lamina" data-lamina="" data-giro="rotate(-42 241 326)">
      <rect x="236" y="320" width="74" height="11" rx="5" fill="url(#rc-niquelV)" stroke="#3b3f46" stroke-width="1.1"/>
      <rect x="300" y="313" width="17" height="25" rx="6" fill="url(#rc-plast)" stroke="#07080a" stroke-width="1.1"/>
