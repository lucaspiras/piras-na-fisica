<?xml version="1.0" encoding="UTF-8"?>
<!-- Circuito elétrico 2 de 2, com interruptor clicável.
     Autossuficiente: leva o próprio CSS e o próprio script.
     ATENÇÃO: dentro de <img> o desenho aparece mas o clique NÃO funciona,
     porque o navegador trata img como imagem estática. Para interagir, use
     <object type="image/svg+xml" data="...">, um <iframe>, ou abra o arquivo.
     Fonte: disciplinas/eletricidade_basica/apresentacoes/circuitos/index.html -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420" width="780" height="504"
     aria-labelledby="ct-titulo-2">
  <title id="ct-titulo-2">Circuito em símbolos com interruptor: fonte, fios, lâmpada e a corrente animada. Clique no interruptor para abrir o circuito e interromper a corrente.</title>
  <style><![CDATA[
    svg {
      /* Trocar qualquer um destes retematiza o desenho sem editar o resto. */
      --fundo:            #FDF8EC;
      --corrente:         #22D3EE;   /* 10,2:1 sobre o fio preto */
      --corrente-escuro:  #0E7490;   /* 5,0:1 sobre o creme      */
      --acento:           #A16207;
      --acento2:          #1E63F0;
      --rotulo:           #54565C;
    }

    @keyframes flow { to { stroke-dashoffset: -32; } }

    .chave { cursor: pointer; }
    .chave:focus { outline: none; }
    .chave:hover .chave-alvo { fill-opacity: .09; }
    .chave:focus-visible .chave-alvo { fill-opacity: .14; stroke: var(--acento); stroke-width: 2.5; }
    .chave-lamina { transition: transform .18s cubic-bezier(.34,1.3,.64,1); }

    @media (prefers-reduced-motion: reduce) {
      .chave-lamina { transition: none; }
      [style*="animation:flow"] { animation: none !important; }
      animate { display: none; }
    }
  ]]></style>
  <rect width="650" height="420" rx="14" style="fill:var(--fundo)"/>
  <!-- wires -->
  <path d="M140 100 H460" fill="none" stroke="#16171A" stroke-width="5"/>
  <path d="M460 100 V170 M460 230 V320 M460 320 H302 M238 320 H140 M140 320 V232 M140 178 V100" fill="none" stroke="#16171A" stroke-width="5"/>
  <!-- corrente percorrendo o circuito inteiro, do + ao − da pilha -->
  <g data-so-fechado=""><path d="M140 178 V100 H460 V170" pointer-events="none" fill="none" style="stroke:var(--corrente);animation:flow 1s linear infinite;" stroke-width="5" stroke-dasharray="14 18"/>
  <path d="M460 230 V320 H140 V232" pointer-events="none" fill="none" style="stroke:var(--corrente);animation:flow 1s linear infinite;" stroke-width="5" stroke-dasharray="14 18"/>
  <!-- setas de sentido, uma em cada trecho -->
  <polygon points="287,87 313,100 287,113" pointer-events="none" style="fill:var(--corrente);stroke:#16171A;stroke-width:1.5;stroke-linejoin:round"/>
  <polygon points="447,123 473,123 460,149" pointer-events="none" style="fill:var(--corrente);stroke:#16171A;stroke-width:1.5;stroke-linejoin:round"/>
  <polygon points="395,307 395,333 369,320" pointer-events="none" style="fill:var(--corrente);stroke:#16171A;stroke-width:1.5;stroke-linejoin:round"/>
  <polygon points="127,145 153,145 140,119" pointer-events="none" style="fill:var(--corrente);stroke:#16171A;stroke-width:1.5;stroke-linejoin:round"/>
  </g>
  <!-- interruptor: pino em x=238, contato em x=302 -->
  <g class="chave" data-chave="" data-aberto="false" role="button" tabindex="0">
    <rect class="chave-alvo" x="216" y="262" width="112" height="82" rx="8" fill="#16171A" fill-opacity="0"/>
    <circle cx="238" cy="320" r="6" fill="#16171A"/>
    <circle cx="302" cy="320" r="6" fill="#16171A"/>
    <g class="chave-lamina" data-lamina="" data-giro="rotate(-42 238 320)">
      <line x1="238" y1="320" x2="308" y2="320" stroke="#16171A" stroke-width="5.5" stroke-linecap="round"/>
    </g>
  </g>
  <text x="300" y="250" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="22" style="fill:var(--rotulo)">interruptor</text>
  <!-- battery (fonte) on left -->
  <line x1="116" y1="178" x2="164" y2="178" style="stroke:var(--acento)" stroke-width="6"/>
  <line x1="128" y1="194" x2="152" y2="194" style="stroke:var(--acento)" stroke-width="9"/>
  <line x1="116" y1="210" x2="164" y2="210" style="stroke:var(--acento)" stroke-width="6"/>
  <line x1="128" y1="226" x2="152" y2="226" style="stroke:var(--acento)" stroke-width="9"/>
  <text x="92" y="172" font-family="IBM Plex Mono, monospace" font-size="26" style="fill:var(--acento)">+</text>
  <!-- lamp (consumidor) on right -->
  <circle cx="460" cy="200" r="32" fill="#fff" stroke="#16171A" stroke-width="5"/>
  <line x1="438" y1="178" x2="482" y2="222" style="stroke:var(--acento2)" stroke-width="5"/>
  <line x1="482" y1="178" x2="438" y2="222" style="stroke:var(--acento2)" stroke-width="5"/>
  <!-- labels -->
  <text x="60" y="270" font-family="IBM Plex Mono, monospace" font-size="25" style="fill:var(--acento)">fonte</text>
  <text x="250" y="58" data-so-fechado="" font-family="IBM Plex Mono, monospace" font-size="25" style="fill:var(--corrente-escuro)">corrente</text>
  <text x="470" y="270" font-family="IBM Plex Mono, monospace" font-size="25" fill="#16171A">consumidor</text>
  <text x="220" y="360" font-family="IBM Plex Mono, monospace" font-size="25" style="fill:var(--rotulo)">fios condutores</text>
  <script><![CDATA[
    // Interruptor: gira a lâmina e liga/desliga o que depende do circuito
    // fechado ([data-so-fechado] some, [data-so-aberto] aparece).
    (function () {
      Array.prototype.forEach.call(document.querySelectorAll('[data-chave]'), function (g) {
        var svg = g.ownerSVGElement || document.documentElement;
        function pinta() {
          var aberto = g.getAttribute('data-aberto') === 'true';
          var lam = svg.querySelector('[data-lamina]');
          if (lam) lam.setAttribute('transform', aberto ? lam.getAttribute('data-giro') : '');
          Array.prototype.forEach.call(svg.querySelectorAll('[data-so-fechado]'), function (e) {
            e.style.display = aberto ? 'none' : '';
          });
          Array.prototype.forEach.call(svg.querySelectorAll('[data-so-aberto]'), function (e) {
            e.style.display = aberto ? '' : 'none';
          });
          g.setAttribute('aria-label', aberto
            ? 'Interruptor aberto, circuito interrompido. Ative para fechar.'
            : 'Interruptor fechado, circuito completo. Ative para abrir.');
        }
        function alterna() {
          g.setAttribute('data-aberto', g.getAttribute('data-aberto') === 'true' ? 'false' : 'true');
          pinta();
        }
        g.addEventListener('click', alterna);
        g.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); alterna(); }
        });
        pinta();
      });
    })();
  ]]></script>
</svg>
