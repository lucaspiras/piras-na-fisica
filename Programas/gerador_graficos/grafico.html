<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Gr&aacute;ficos - Portal de F&iacute;sica</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-TY56KM22X8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-TY56KM22X8');
  </script>

  <!-- Caminhos absolutos -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="./grafico.css">

  <!-- Bibliotecas -->
  <script src="https://cdn.jsdelivr.net/npm/mathjs@11/lib/browser/math.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div id="header"></div>
<script src="/js/include.js"></script>

<main class="pagina-larga grafico-page">

  <section class="destaque grafico-hero">
    <div>
      <span class="grafico-kicker">Ferramenta matemática</span>
      <h2>Gerador de Gráficos</h2>
      <p>Digite uma ou mais funções do tipo <strong>f(x)</strong> e exporte uma imagem pronta para usar.</p>
    </div>
  </section>

  <section class="conteudo app-container grafico-app">
    <div class="app-card painel-controles">
      <div class="grupo-controles">
        <div class="campo campo-amplo">
          <label for="equacao">Funções</label>
          <input type="text" id="equacao" value="x^2; 2*x+1" placeholder="Ex.: x^2; 2*x+1; sin(x)">
          <small>Separe várias funções com ponto e ví rgula.</small>
        </div>
      </div>

      <div class="grupo-controles grupo-titulos">
        <div class="campo">
          <label for="tituloGrafico">Título do gráfico</label>
          <input type="text" id="tituloGrafico" value="Gráfico das funções">
        </div>

        <div class="campo">
          <label for="tituloX">Título eixo X</label>
          <input type="text" id="tituloX" value="x">
        </div>

        <div class="campo">
          <label for="tituloY">Título eixo Y</label>
          <input type="text" id="tituloY" value="f(x)">
        </div>
      </div>

      <div class="grupo-controles grupo-medidas">
        <div class="campo campo-curto">
          <label for="xmin">x mínimo</label>
          <input type="number" id="xmin" value="-10">
        </div>

        <div class="campo campo-curto">
          <label for="xmax">x máximo</label>
          <input type="number" id="xmax" value="10">
        </div>

        <div class="campo campo-curto">
          <label for="passoCurva">Passo da curva</label>
          <input type="number" id="passoCurva" value="0.001" step="0.001" min="0.0001">
        </div>

        <div class="campo campo-curto">
          <label for="passoPontos">Passo dos pontos</label>
          <input type="number" id="passoPontos" value="1" step="0.1" min="0.0001">
        </div>

        <div class="campo campo-curto">
          <label for="larguraGrafico">Largura (px)</label>
          <input type="number" id="larguraGrafico" value="900" min="320">
        </div>

        <div class="campo campo-curto">
          <label for="alturaGrafico">Altura (px)</label>
          <input type="number" id="alturaGrafico" value="540" min="260">
        </div>

        <label class="controle-check" for="mostrarPontos">
          <input type="checkbox" id="mostrarPontos">
          <span>Mostrar pontos</span>
        </label>

        <label class="controle-check" for="mostrarGrade">
          <input type="checkbox" id="mostrarGrade" checked>
          <span>Mostrar grade</span>
        </label>
      </div>

      <div class="grupo-controles grupo-cores" id="coresContainer">
      </div>

      <div class="acoes-grafico">
        <button class="botao-principal" type="button" onclick="gerarGrafico()">
          Gerar gr&aacute;fico
        </button>
        <button class="botao-secundario" type="button" onclick="baixarImagem()">
          Baixar imagem
        </button>
      </div>
    </div>

    <div class="area-grafico">
      <canvas id="graficoCanvas"></canvas>
    </div>
  </section>

</main>

<footer>
  <p>&copy; 2025 - Portal de F&iacute;sica</p>
</footer>

<script src="/Programas/gerador_graficos/js/grafico.js"></script>

</body>
</html>
