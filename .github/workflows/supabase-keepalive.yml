name: Supabase Keep-Alive

on:
  schedule:
    # Roda a cada 2 dias às 08:00 UTC — margem maior abaixo do limite de 7 do Supabase free
    - cron: "0 8 */2 * *"
  workflow_dispatch: # permite rodar manualmente pelo GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar tabela feedbacks (ping no root não conta como atividade de banco)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://vlihugczatpmnyjbdmqw.supabase.co/rest/v1/feedbacks?select=id&limit=1" \
            -H "apikey: sb_publishable__QOgJ-nSBouPG9kcbpjcAA_MrcVuNqX")
          echo "Status HTTP: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 500 ]; then
            echo "ERRO: projeto nao respondeu corretamente (HTTP $STATUS)"
            exit 1
          fi
          echo "Projeto ativo."
