name: Gerar Redirects

on:
  push:
    branches: [main]
    paths:
      - "scripts/redirects.txt"

jobs:
  redirects:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Gerar stubs de redirect
        shell: pwsh
        run: pwsh scripts/gerar-redirects.ps1

      - name: Atualizar sitemap (exclui stubs automaticamente)
        shell: pwsh
        run: pwsh scripts/gerar-sitemap.ps1

      - name: Commitar arquivos gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nenhuma alteracao gerada."
          else
            git commit -m "chore: stubs de redirect e sitemap atualizados automaticamente"
            git push
          fi
