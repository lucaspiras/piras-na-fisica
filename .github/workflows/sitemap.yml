name: Atualizar Sitemap

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"

jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Gerar sitemap.xml
        shell: pwsh
        run: pwsh scripts/gerar-sitemap.ps1

      - name: Commitar sitemap se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if git diff --staged --quiet; then
            echo "Sitemap sem alteracoes."
          else
            git commit -m "chore: atualiza sitemap.xml automaticamente"
            git push
          fi
